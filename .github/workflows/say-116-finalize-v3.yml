name: SAY-116 Finalize v3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sayosomi/say-116-typo-suggestions-matcher-stable-unknown-name-diagnostics'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-116-typo-suggestions-matcher-stable-unknown-name-diagnostics
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply SAY-116 patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/say-116-finalize-v2.yml').read_text().splitlines()
          start = workflow.index("          python - <<'PY'") + 1
          end = workflow.index("          PY", start)
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in workflow[start:end])
          exec(compile(script, 'say-116-v2-patches.py', 'exec'))

          path = Path('src/dsl/dslDocument.ts')
          text = path.read_text()
          old = "    ...compiled.diagnostics,\n    ...(sourceLexicalNamespace?.diagnostics ?? []),\n    ...scalarAnalysisCompilation.diagnostics,"
          new = "    ...projectedCompilerDiagnostics,\n    ...(sourceLexicalNamespace?.diagnostics ?? []),\n    ...scalarAnalysisCompilation.diagnostics,"
          if text.count(old) != 1:
              raise SystemExit(f'dslDocument projection target count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Focused tests
        run: npm test -- src/dsl/dslTypoMatcher.test.ts src/dsl/dslUnknownNameDiagnostics.test.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build VS Code extension
        run: npm run build:vscode

      - name: Full Node tests
        run: npm test

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/say-116-apply.yml \
            .github/workflows/say-116-pr-apply.yml \
            .github/workflows/say-116-fix-embedded-target.yml \
            .github/workflows/say-116-finalize.yml \
            .github/workflows/say-116-finalize-v2.yml \
            .github/workflows/say-116-finalize-v3.yml
          git add \
            src/dsl/dslTypeParser.ts \
            src/dsl/dslCallParser.ts \
            src/dsl/dslParser.ts \
            src/dsl/dslReferences.ts \
            src/dsl/dslDocument.ts
          git commit -m "feat: add stable unknown-name diagnostics (SAY-116)"
          git push origin HEAD:sayosomi/say-116-typo-suggestions-matcher-stable-unknown-name-diagnostics
