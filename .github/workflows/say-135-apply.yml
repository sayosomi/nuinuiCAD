name: SAY-135 apply

on:
  push:
    branches:
      - sayosomi/say-135-module-diagnostics-vs-code-relatedinformation-projection
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'sayosomi/say-135-module-diagnostics-vs-code-relatedinformation-projection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sayosomi/say-135-module-diagnostics-vs-code-relatedinformation-projection
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Refresh latest main
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused implementation
        run: |
          python .github/say135_apply_v3.py
          rm .github/say135_apply.py .github/say135_apply_v2.py .github/say135_apply_v3.py .github/workflows/say-135-apply.yml
      - name: Install dependencies
        run: npm ci
      - name: Focused tests
        run: npm test -- vscode-extension/src/compilerDiagnostics.test.ts vscode-extension/src/extension.test.ts
      - name: VS Code build
        run: npm run build:vscode
      - name: App build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit implementation
        run: |
          git add -- vscode-extension/src/compilerDiagnostics.ts vscode-extension/src/compilerDiagnostics.test.ts vscode-extension/src/extension.ts vscode-extension/src/extension.test.ts .github/say135_apply.py .github/say135_apply_v2.py .github/say135_apply_v3.py .github/workflows/say-135-apply.yml
          git diff --cached --check
          git commit -m "feat: project diagnostic related information (SAY-135)"
          git push origin HEAD:sayosomi/say-135-module-diagnostics-vs-code-relatedinformation-projection
