name: Notify Discord on merged pull requests

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - closed
      - opened
      - reopened
      - ready_for_review
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  notify-out-of-date-pull-requests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted default branch notification helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send out-of-date pull request notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MERGE_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/discordPrNotification.mjs main-push

  notify-merged-pull-request:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted default branch notification helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send merged pull request notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MERGE_WEBHOOK_URL }}
          REPOSITORY_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: node scripts/ci/discordPrNotification.mjs merge

  notify-actionable-pull-request:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'ready_for_review')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted default branch notification helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send actionable pull request notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MERGE_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/discordPrNotification.mjs pr-lifecycle

  notify-ci-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted default branch notification helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send CI failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MERGE_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/discordPrNotification.mjs ci-failure
