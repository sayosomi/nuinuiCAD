name: SAY-145 language-session ownership fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-session-ownership:
    if: ${{ github.event.pull_request.head.ref == 'sayosomi/say-145-runtime-diagnostics-session-ownership-fix' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout SAY-145 follow-up branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Move runtime diagnostic state into language session and verify
        run: python3 scripts/say145-session-ownership-fix.py
