      "point A2 = coordinate(x: 0, y: 20)",
      "point A3 = coordinate(x: -20, y: 0)",
      "point P1 = coordinate(x: 60, y: -20)",
      "point P2 = coordinate(x: 60, y: 20)",
      "point P3 = coordinate(x: 80, y: 0)",
      "line L1 = segment(start: P1, end: P2)",
      "line L2 = segment(start: P2, end: P3)",
      "arc Direct = arc(center: O, radius: 20, startAngle: 10, endAngle: 20)",
      "arc Through = through(point1: A1, point2: A2, point3: A3, startAngle: 30, endAngle: 40)",
      "arc Corner = corner(endpoint1: L1:end, endpoint2: L2:start, radius: 5, intersectionIndex: 0)",
      "line T1 = commonTangent(first: Direct, second: Through, kind: external, side: left)",
      "line T2 = commonTangent(first: Direct, second: Corner, kind: external, side: right)"
    ].join("\n");
    const { result } = evaluateSource(source);
    expect(result.errors).toEqual([]);
