name: SAY-21 apply implementation

on:
  push:
    branches:
      - sayosomi/say-21-common-tangent
    paths:
      - .github/workflows/say21-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SAY-21 changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)

          # Authored model and type metadata.
          replace("src/types/geometry.ts", '''export type ArcLineElement = CadElementBase & {\n''', '''export type CommonTangentLineKind = "external" | "internal";\nexport type CommonTangentLineSide = "left" | "right";\n\nexport type CommonTangentLineElement = CadElementBase & {\n  type: "commonTangentLine";\n  firstLineId: ElementId;\n  secondLineId: ElementId;\n  kind: CommonTangentLineKind;\n  side: CommonTangentLineSide;\n};\n\nexport type ArcLineElement = CadElementBase & {\n''')
          replace("src/types/geometry.ts", '''  | AngleLengthLineElement\n  | ArcLineElement\n''', '''  | AngleLengthLineElement\n  | CommonTangentLineElement\n  | ArcLineElement\n''')
          replace("src/types/geometry.ts", '''  angleLengthLine: "角度距離線",\n  arcLine: "arc line",\n''', '''  angleLengthLine: "角度距離線",\n  commonTangentLine: "共通接線",\n  arcLine: "arc line",\n''')
          replace("src/types/geometry.ts", '''  angleLengthLine: "line",\n  arcLine: "line",\n''', '''  angleLengthLine: "line",\n  commonTangentLine: "line",\n  arcLine: "line",\n''')

          # DSL registry: first/second are broad line references at parse time;
          # the evaluator owns the exact arc-only runtime diagnostic contract.
          replace("src/dsl/dslConstructions.ts", '''  {\n    category: "line", construction: "polar", elementType: "angleLengthLine",\n    args: [\n      required("start", "startPoint"),\n      required("angle", "angleDeg"),\n      required("length")\n    ]\n  },\n''', '''  {\n    category: "line", construction: "polar", elementType: "angleLengthLine",\n    args: [\n      required("start", "startPoint"),\n      required("angle", "angleDeg"),\n      required("length")\n    ]\n  },\n  {\n    category: "line", construction: "commonTangent", elementType: "commonTangentLine",\n    args: [\n      required("first", "firstLineId"),\n      required("second", "secondLineId"),\n      required("kind"),\n      required("side")\n    ]\n  },\n''')

          replace("src/model/elementNames.ts", '''  angleLengthLine: "角度距離線",\n  arcLine: "円弧線",\n''', '''  angleLengthLine: "角度距離線",\n  commonTangentLine: "共通接線",\n  arcLine: "円弧線",\n''')

          # Factory defaults + line-like membership.
          replace("src/model/elementFactory.ts", '''      element.type === "line" ||\n      element.type === "angleLengthLine" ||\n      element.type === "arcLine" ||\n''', '''      element.type === "line" ||\n      element.type === "angleLengthLine" ||\n      element.type === "commonTangentLine" ||\n      element.type === "arcLine" ||\n''')
          replace("src/model/elementFactory.ts", '''  const uniqueName = (elementId: ElementId, requestedName: string) =>\n''', '''  const arcLikeElements = referenceElements.filter(\n    (element) =>\n      element.type === "arcLine" ||\n      element.type === "threePointArcLine" ||\n      element.type === "cornerRadiusArcLine"\n  );\n  const uniqueName = (elementId: ElementId, requestedName: string) =>\n''')
          replace("src/model/elementFactory.ts", '''    case "arcLine": {\n''', '''    case "commonTangentLine": {\n      const id = createId(type);\n      const lineCount = elements.filter((element) => element.type === "commonTangentLine").length;\n      const firstArc = arcLikeElements[0];\n      const secondArc = arcLikeElements.find((element) => element.id !== firstArc?.id) ?? firstArc;\n      return {\n        id,\n        name: uniqueName(id, `共通接線${lineCount + 1}`),\n        type,\n        activity: "visible",\n        firstLineId: firstArc?.id ?? "",\n        secondLineId: secondArc?.id ?? "",\n        kind: "external",\n        side: "left"\n      };\n    }\n    case "arcLine": {\n''')

          # Parameter schema drives Inspector, DSL argument application, and choice stepping.
          replace("src/parameters/parameterDefinitions.ts", '''    case "arcLine":\n      return [\n''', '''    case "commonTangentLine":\n      return [\n        ...commonParameters,\n        { key: "firstLineId", label: "1つ目の円弧", kind: "lineReference" },\n        { key: "secondLineId", label: "2つ目の円弧", kind: "lineReference" },\n        { key: "kind", label: "接線種別", kind: "choice", choiceOptions: ["external", "internal"] },\n        { key: "side", label: "側", kind: "choice", choiceOptions: ["left", "right"] },\n      ];\n    case "arcLine":\n      return [\n''')

          # Dependency graph + duplication remapping.
          replace("src/model/dependencies.ts", '''      case "arcLine":\n        return [\n''', '''      case "commonTangentLine":\n        return [element.firstLineId, element.secondLineId];\n      case "arcLine":\n        return [\n''')
          replace("src/model/dependencies.ts", '''    case "angleLengthLine":\n    case "arcLine":\n''', '''    case "angleLengthLine":\n    case "commonTangentLine":\n    case "arcLine":\n''')
          replace("src/model/elementDuplication.ts", '''    case "arcLine":\n      return {\n''', '''    case "commonTangentLine":\n      return {\n        ...element,\n        firstLineId: mapId(element.firstLineId, idMap),\n        secondLineId: mapId(element.secondLineId, idMap)\n      };\n    case "arcLine":\n      return {\n''')

          # Straight-line behavior in selection/reference/module surfaces.
          replace("src/model/pointAnchors.ts", '''    if (element.type === "line") {\n      return [derivedAnchor(element.id, "start"), derivedAnchor(element.id, "end")];\n    }\n''', '''    if (element.type === "line" || element.type === "commonTangentLine") {\n      return [derivedAnchor(element.id, "start"), derivedAnchor(element.id, "end")];\n    }\n''')
          replace("src/model/pointAnchors.ts", '''  element.type === "angleLengthLine" ||\n  element.type === "arcLine" ||\n''', '''  element.type === "angleLengthLine" ||\n  element.type === "commonTangentLine" ||\n  element.type === "arcLine" ||\n''')
          replace("src/commands/commandRuntime.ts", '''  element.type === "angleLengthLine" ||\n  element.type === "arcLine" ||\n''', '''  element.type === "angleLengthLine" ||\n  element.type === "commonTangentLine" ||\n  element.type === "arcLine" ||\n''')
          replace("src/palette/colorApplicability.ts", '''    case "angleLengthLine":\n    case "arcLine":\n''', '''    case "angleLengthLine":\n    case "commonTangentLine":\n    case "arcLine":\n''')
          replace("src/dsl/moduleGeometryInterfaces.ts", '''  return construction.elementType === "line" || construction.elementType === "angleLengthLine" ? "line" : "path";\n''', '''  return construction.elementType === "line" || construction.elementType === "angleLengthLine" || construction.elementType === "commonTangentLine" ? "line" : "path";\n''')
          replace("src/dsl/dslDocumentTestUtils.ts", '''    for (const key of ["line1Id", "line2Id", "baseLineId", "lineId"]) {\n''', '''    for (const key of ["line1Id", "line2Id", "firstLineId", "secondLineId", "baseLineId", "lineId"]) {\n''')
          replace("src/geometry/numericReferenceProperties.ts", '''    element.type === "angleLengthLine" ||\n    element.type === "arcLine" ||\n''', '''    element.type === "angleLengthLine" ||\n    element.type === "commonTangentLine" ||\n    element.type === "arcLine" ||\n''')

          # TypeScript reference evaluator.
          replace("src/geometry/lineEvaluators.ts", '''  circleThroughThreePoints,\n  degreesToRadians,\n''', '''  CIRCLE_EPSILON,\n  circleThroughThreePoints,\n  degreesToRadians,\n''')
          replace("src/geometry/lineEvaluators.ts", '''import { geometryError, getPointAnchorOrError, numericError } from "./evaluationContext";\n''', '''import { dependencyError, geometryError, getPointAnchorOrError, numericError } from "./evaluationContext";\n''')
          replace("src/geometry/lineEvaluators.ts", '''      case "arcLine": {\n''', '''      case "commonTangentLine": {\n        const firstGeometry = computedGeometry.get(element.firstLineId);\n        const secondGeometry = computedGeometry.get(element.secondLineId);\n        if (!firstGeometry) {\n          errors.push(dependencyError(element, element.firstLineId, elementsById, disabledByGroupId, errors));\n        } else if (firstGeometry.kind !== "arcLine") {\n          errors.push(geometryError(element, "first に円弧が指定されていません。共通接線には円弧を指定してください。"));\n        }\n        if (!secondGeometry) {\n          errors.push(dependencyError(element, element.secondLineId, elementsById, disabledByGroupId, errors));\n        } else if (secondGeometry.kind !== "arcLine") {\n          errors.push(geometryError(element, "second に円弧が指定されていません。共通接線には円弧を指定してください。"));\n        }\n        if (firstGeometry?.kind !== "arcLine" || secondGeometry?.kind !== "arcLine") break;\n\n        const r1 = firstGeometry.radius;\n        const r2 = secondGeometry.radius;\n        if (!(r1 > CIRCLE_EPSILON)) {\n          errors.push(geometryError(element, "first の半径が0以下です。共通接線には半径のある円弧を指定してください。"));\n        }\n        if (!(r2 > CIRCLE_EPSILON)) {\n          errors.push(geometryError(element, "second の半径が0以下です。共通接線には半径のある円弧を指定してください。"));\n        }\n        if (!(r1 > CIRCLE_EPSILON) || !(r2 > CIRCLE_EPSILON)) break;\n\n        const dx = secondGeometry.center.x - firstGeometry.center.x;\n        const dy = secondGeometry.center.y - firstGeometry.center.y;\n        const centerDistance = Math.hypot(dx, dy);\n        if (centerDistance <= CIRCLE_EPSILON) {\n          errors.push(geometryError(\n            element,\n            Math.abs(r1 - r2) <= CIRCLE_EPSILON\n              ? "2つの円が同一円のため、共通接線を1本に決定できません。"\n              : "2つの円が同心円のため、共通接線は存在しません。"\n          ));\n          break;\n        }\n\n        const threshold = element.kind === "external" ? Math.abs(r1 - r2) : r1 + r2;\n        if (centerDistance < threshold - CIRCLE_EPSILON) {\n          errors.push(geometryError(\n            element,\n            `kind: ${element.kind} の共通接線は存在しません。2つの円の位置・半径または kind を変更してください。`\n          ));\n          break;\n        }\n        if (centerDistance <= threshold + CIRCLE_EPSILON) {\n          errors.push(geometryError(element, "2つの接点が一致するため、有限長の共通接線として表現できません。2つの円の位置・半径または kind を変更してください。"));\n          break;\n        }\n\n        const secondRadiusSign = element.kind === "external" ? 1 : -1;\n        const cosine = (r1 - secondRadiusSign * r2) / centerDistance;\n        const clampedCosine = Math.max(-1, Math.min(1, cosine));\n        const sineSquared = 1 - clampedCosine * clampedCosine;\n        const sine = Math.sqrt(sineSquared < 0 && sineSquared > -CIRCLE_EPSILON ? 0 : Math.max(0, sineSquared));\n        const ux = dx / centerDistance;\n        const uy = dy / centerDistance;\n        const vx = -uy;\n        const vy = ux;\n        const sideSign = element.side === "left" ? 1 : -1;\n        const nx = clampedCosine * ux + sideSign * sine * vx;\n        const ny = clampedCosine * uy + sideSign * sine * vy;\n        const start: ComputedPoint = {\n          kind: "point",\n          elementId: `${element.id}:start`,\n          name: `${element.name}.始点`,\n          x: firstGeometry.center.x + r1 * nx,\n          y: firstGeometry.center.y + r1 * ny\n        };\n        const end: ComputedPoint = {\n          kind: "point",\n          elementId: `${element.id}:end`,\n          name: `${element.name}.終点`,\n          x: secondGeometry.center.x + secondRadiusSign * r2 * nx,\n          y: secondGeometry.center.y + secondRadiusSign * r2 * ny\n        };\n        const length = Math.hypot(end.x - start.x, end.y - start.y);\n        if (length <= CIRCLE_EPSILON) {\n          errors.push(geometryError(element, "2つの接点が一致するため、有限長の共通接線として表現できません。2つの円の位置・半径または kind を変更してください。"));\n          break;\n        }\n        const angles = lineTangentAngles(start, end);\n        computedGeometry.set(element.id, {\n          kind: "line",\n          elementId: element.id,\n          name: element.name,\n          startPointId: null,\n          endPointId: null,\n          start,\n          end,\n          length,\n          ...angles\n        });\n        break;\n      }\n      case "arcLine": {\n''')

          # Rust production eligibility and evaluator dispatch.
          replace("src/geometry/rustEvaluationEligibility.ts", '''  "angleLengthLine",\n  "arcLine",\n''', '''  "angleLengthLine",\n  "commonTangentLine",\n  "arcLine",\n''', 3)
          replace("src-tauri/src/evaluation/mod.rs", '''mod corner_radius_evaluator;\n''', '''mod common_tangent_evaluator;\n#[cfg(test)]\nmod common_tangent_evaluator_tests;\nmod corner_radius_evaluator;\n''')
          replace("src-tauri/src/evaluation/mod.rs", '''use corner_radius_evaluator::evaluate_corner_radius_arc_line;\n''', '''use common_tangent_evaluator::evaluate_common_tangent_line;\nuse corner_radius_evaluator::evaluate_corner_radius_arc_line;\n''')
          replace("src-tauri/src/evaluation/mod.rs", '''        Some("angleLengthLine") => evaluate_angle_length_line(&element, &local_variables, state),\n        Some("arcLine") => evaluate_arc_line(&element, &local_variables, state),\n''', '''        Some("angleLengthLine") => evaluate_angle_length_line(&element, &local_variables, state),\n        Some("commonTangentLine") => evaluate_common_tangent_line(&element, state),\n        Some("arcLine") => evaluate_arc_line(&element, &local_variables, state),\n''')

          write("src-tauri/src/evaluation/common_tangent_evaluator.rs", r'''use serde_json::{json, Value};

use super::errors::{dependency_error, geometry_error};
use super::math::CIRCLE_EPSILON;
use super::types::{element_id, element_name, insert_geometry, EvaluationState};

const COLLAPSED_MESSAGE: &str = "2つの接点が一致するため、有限長の共通接線として表現できません。2つの円の位置・半径または kind を変更してください。";

fn arc_geometry(state: &mut EvaluationState, element: &Value, key: &str, label: &str) -> Option<Value> {
    let reference_id = element.get(key).and_then(Value::as_str).unwrap_or_default();
    let Some(geometry) = state.computed_geometry.get(reference_id).cloned() else {
        let error = dependency_error(state, element, reference_id);
        state.errors.push(error);
        return None;
    };
    if geometry.get("kind").and_then(Value::as_str) != Some("arcLine") {
        state.errors.push(geometry_error(
            element,
            format!("{label} に円弧が指定されていません。共通接線には円弧を指定してください。"),
        ));
        return None;
    }
    Some(geometry)
}

pub(crate) fn evaluate_common_tangent_line(element: &Value, state: &mut EvaluationState) {
    let first = arc_geometry(state, element, "firstLineId", "first");
    let second = arc_geometry(state, element, "secondLineId", "second");
    let (Some(first), Some(second)) = (first, second) else { return; };

    let r1 = first.get("radius").and_then(Value::as_f64).unwrap_or(f64::NAN);
    let r2 = second.get("radius").and_then(Value::as_f64).unwrap_or(f64::NAN);
    if !(r1 > CIRCLE_EPSILON) {
        state.errors.push(geometry_error(
            element,
            "first の半径が0以下です。共通接線には半径のある円弧を指定してください。".to_owned(),
        ));
    }
    if !(r2 > CIRCLE_EPSILON) {
        state.errors.push(geometry_error(
            element,
            "second の半径が0以下です。共通接線には半径のある円弧を指定してください。".to_owned(),
        ));
    }
    if !(r1 > CIRCLE_EPSILON) || !(r2 > CIRCLE_EPSILON) { return; }

    let c1x = first["center"]["x"].as_f64().unwrap_or(f64::NAN);
    let c1y = first["center"]["y"].as_f64().unwrap_or(f64::NAN);
    let c2x = second["center"]["x"].as_f64().unwrap_or(f64::NAN);
    let c2y = second["center"]["y"].as_f64().unwrap_or(f64::NAN);
    let dx = c2x - c1x;
    let dy = c2y - c1y;
    let distance = dx.hypot(dy);
    if distance <= CIRCLE_EPSILON {
        let message = if (r1 - r2).abs() <= CIRCLE_EPSILON {
            "2つの円が同一円のため、共通接線を1本に決定できません。"
        } else {
            "2つの円が同心円のため、共通接線は存在しません。"
        };
        state.errors.push(geometry_error(element, message.to_owned()));
        return;
    }

    let kind = element.get("kind").and_then(Value::as_str).unwrap_or("external");
    let side = element.get("side").and_then(Value::as_str).unwrap_or("left");
    let second_radius_sign = if kind == "internal" { -1.0 } else { 1.0 };
    let threshold = if kind == "internal" { r1 + r2 } else { (r1 - r2).abs() };
    if distance < threshold - CIRCLE_EPSILON {
        state.errors.push(geometry_error(
            element,
            format!("kind: {kind} の共通接線は存在しません。2つの円の位置・半径または kind を変更してください。"),
        ));
        return;
    }
    if distance <= threshold + CIRCLE_EPSILON {
        state.errors.push(geometry_error(element, COLLAPSED_MESSAGE.to_owned()));
        return;
    }

    let cosine = ((r1 - second_radius_sign * r2) / distance).clamp(-1.0, 1.0);
    let sine_squared = 1.0 - cosine * cosine;
    let sine = if sine_squared < 0.0 && sine_squared > -CIRCLE_EPSILON {
        0.0
    } else {
        sine_squared.max(0.0).sqrt()
    };
    let ux = dx / distance;
    let uy = dy / distance;
    let vx = -uy;
    let vy = ux;
    let side_sign = if side == "right" { -1.0 } else { 1.0 };
    let nx = cosine * ux + side_sign * sine * vx;
    let ny = cosine * uy + side_sign * sine * vy;
    let start_x = c1x + r1 * nx;
    let start_y = c1y + r1 * ny;
    let end_x = c2x + second_radius_sign * r2 * nx;
    let end_y = c2y + second_radius_sign * r2 * ny;
    let length = (end_x - start_x).hypot(end_y - start_y);
    if length <= CIRCLE_EPSILON {
        state.errors.push(geometry_error(element, COLLAPSED_MESSAGE.to_owned()));
        return;
    }

    let start_angle = (end_y - start_y).atan2(end_x - start_x).to_degrees().rem_euclid(360.0);
    let end_angle = (start_y - end_y).atan2(start_x - end_x).to_degrees().rem_euclid(360.0);
    let id = element_id(element).unwrap_or_default();
    let name = element_name(element);
    insert_geometry(state, id.clone(), json!({
        "kind": "line",
        "elementId": id,
        "name": name,
        "startPointId": null,
        "endPointId": null,
        "start": {
            "kind": "point", "elementId": format!("{id}:start"), "name": format!("{name}.始点"),
            "x": start_x, "y": start_y
        },
        "end": {
            "kind": "point", "elementId": format!("{id}:end"), "name": format!("{name}.終点"),
            "x": end_x, "y": end_y
        },
        "length": length,
        "startAngleDeg": start_angle,
        "endAngleDeg": end_angle,
        "startTangentAngleDeg": start_angle,
        "endTangentAngleDeg": end_angle
    }));
}
''')

          # Focused TypeScript tests: DSL round-trip, four solutions, orientation,
          # diagnostics, and choice stepping.
          write("src/geometry/commonTangentEvaluator.test.ts", r'''import { describe, expect, it } from "vitest";
import { compileDslDocument } from "../dsl/dslDocument";
import { roundTrip } from "../dsl/dslDocumentTestUtils";
import { createCadElement } from "../model/elementFactory";
import { choiceAfterStep } from "../dsl/dslValueStep";
import { findParameterDefinition } from "../parameters/parameterDefinitions";
import type { CadElement, ComputedLine } from "../types/geometry";
import { evaluateElements } from "./evaluate";

const sourceFor = (kind: "external" | "internal", side: "left" | "right") => [
  "nui 4",
  "point C1 = coordinate(x: 0, y: 0)",
  "point C2 = coordinate(x: 60, y: 0)",
  "arc A = arc(center: C1, radius: 20, startAngle: 40, endAngle: 80)",
  "arc B = arc(center: C2, radius: 10, startAngle: 210, endAngle: 250)",
  `line T = commonTangent(first: A, second: B, kind: ${kind}, side: ${side})`
].join("\n");

const evaluateSource = (source: string) => {
  const compiled = compileDslDocument(source);
  expect(compiled.diagnostics.filter((item) => item.severity === "error")).toEqual([]);
  expect(compiled.document).not.toBeNull();
  const tangent = compiled.document!.elements.find((element) => element.name === "T")!;
  const result = evaluateElements(compiled.document!.elements, {
    statementInfoByElementId: compiled.statementMap!.byElementId
  });
  return { compiled, tangent, result, geometry: result.computedGeometry.get(tangent.id) as ComputedLine | undefined };
};

const crossFromFirstCenter = (line: ComputedLine) => 60 * line.start.y;

const expectTangent = (line: ComputedLine, kind: "external" | "internal", side: "left" | "right") => {
  expect(line.kind).toBe("line");
  expect(line.startPointId).toBeNull();
  expect(line.endPointId).toBeNull();
  expect(Math.hypot(line.start.x, line.start.y)).toBeCloseTo(20, 10);
  expect(Math.hypot(line.end.x - 60, line.end.y)).toBeCloseTo(10, 10);
  const tx = line.end.x - line.start.x;
  const ty = line.end.y - line.start.y;
  expect(tx * line.start.x + ty * line.start.y).toBeCloseTo(0, 9);
  expect(side === "left" ? crossFromFirstCenter(line) : -crossFromFirstCenter(line)).toBeGreaterThan(0);
  expect(kind === "external" ? line.start.y * line.end.y : -line.start.y * line.end.y).toBeGreaterThan(0);
};

describe("commonTangent", () => {
  it.each(["external", "internal"] as const)("evaluates %s left/right from full supporting circles", (kind) => {
    const left = evaluateSource(sourceFor(kind, "left"));
    const right = evaluateSource(sourceFor(kind, "right"));
    expect(left.result.errors).toEqual([]);
    expect(right.result.errors).toEqual([]);
    expectTangent(left.geometry!, kind, "left");
    expectTangent(right.geometry!, kind, "right");
    expect(right.geometry!.start.y).toBeCloseTo(-left.geometry!.start.y, 10);
    expect(right.geometry!.end.y).toBeCloseTo(-left.geometry!.end.y, 10);
  });

  it("round-trips the canonical DSL construction", () => {
    const { document, text, parsed } = roundTrip(sourceFor("internal", "right"));
    const tangent = document.elements.find((element) => element.name === "T");
    expect(tangent).toMatchObject({ type: "commonTangentLine", kind: "internal", side: "right" });
    expect(text).toContain("line T = commonTangent(first: A, second: B, kind: internal, side: right)");
    expect(parsed.elements.find((element) => element.name === "T")).toMatchObject({ type: "commonTangentLine", kind: "internal", side: "right" });
  });

  it("uses first->second orientation when arguments are swapped", () => {
    const normal = evaluateSource(sourceFor("external", "left")).geometry!;
    const swapped = evaluateSource(sourceFor("external", "left").replace("first: A, second: B", "first: B, second: A")).geometry!;
    expect(Math.hypot(swapped.start.x - 60, swapped.start.y)).toBeCloseTo(10, 10);
    expect(Math.hypot(swapped.end.x, swapped.end.y)).toBeCloseTo(20, 10);
    expect(normal.start.x).not.toBeCloseTo(swapped.start.x, 5);
  });

  it("accepts arc/through/corner outputs rather than authored arc type only", () => {
