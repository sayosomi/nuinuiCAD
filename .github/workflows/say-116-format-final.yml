name: SAY-116 Format Final

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'sayosomi/say-116-typo-suggestions-matcher-stable-unknown-name-diagnostics'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-116-typo-suggestions-matcher-stable-unknown-name-diagnostics
          fetch-depth: 0

      - name: Normalize formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def lines(path):
              p = Path(path)
              return p, p.read_text().splitlines(keepends=True)

          def find_sequence(items, stripped):
              for i in range(len(items) - len(stripped) + 1):
                  if [line.strip() for line in items[i:i + len(stripped)]] == stripped:
                      return i
              raise SystemExit(f'sequence not found: {stripped}')

          p, items = lines('src/dsl/dslCallParser.ts')
          i = find_sequence(items, [
              'diagnostic(', 'diagnostics,', 'message,',
              'constructionSpan ?? categorySpan,',
              'constructionSpan ? "unknown-construction" : undefined', ');'
          ])
          indents = [4, 6, 6, 6, 6, 4]
          for offset, indent in enumerate(indents):
              items[i + offset] = ' ' * indent + items[i + offset].strip() + '\n'
          i = find_sequence(items, [
              'diagnostic(', 'diagnostics,',
              '`construction「${construction}」に引数「${arg.key}」はありません。候補: ${[...allowed.keys()].join("、")}。`,',
              'arg.keySpan!,', '"unknown-construction-argument"', ');'
          ])
          indents = [6, 8, 8, 8, 8, 6]
          for offset, indent in enumerate(indents):
              items[i + offset] = ' ' * indent + items[i + offset].strip() + '\n'
          p.write_text(''.join(items))

          p, items = lines('src/dsl/dslDocument.ts')
          i = find_sequence(items, [
              '...compiled.diagnostics.map((diagnostic, index) =>',
              'diagnostic.code === "undefined-geometry-reference"',
              '? (projectedCompilerDiagnostics[index] ?? diagnostic)',
              ': diagnostic', '),'
          ])
          indents = [4, 6, 8, 8, 4]
          for offset, indent in enumerate(indents):
              items[i + offset] = ' ' * indent + items[i + offset].strip() + '\n'
          p.write_text(''.join(items))

          p, items = lines('src/dsl/dslParser.ts')
          i = find_sequence(items, [
              'diagnostics: keyword', '? [diagnostic(', 'line,',
              '`未対応のDSLキーワードです: ${keyword}`,',
              '"unknown-dsl-keyword",',
              'project({ start: 0, end: keyword.length }) ?? undefined',
              ')]', ': [diagnostic(line, "文はキーワードから始めてください。")]'
          ])
          indents = [4, 6, 10, 10, 10, 10, 8, 6]
          for offset, indent in enumerate(indents):
              items[i + offset] = ' ' * indent + items[i + offset].strip() + '\n'
          p.write_text(''.join(items))

          p, items = lines('src/dsl/dslTypeParser.ts')
          i = find_sequence(items, [
              'span: typeSpan,', 'code: "unknown-type"', '});',
              'return { declaredType: null, choiceOptionSpans: [] };'
          ])
          indents = [6, 6, 4, 4]
          for offset, indent in enumerate(indents):
              items[i + offset] = ' ' * indent + items[i + offset].strip() + '\n'
          p.write_text(''.join(items))
          PY
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused tests
        run: npm test -- src/dsl/dslTypoMatcher.test.ts src/dsl/dslUnknownNameDiagnostics.test.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/say-116-format-final.yml
          git add src/dsl/dslCallParser.ts src/dsl/dslDocument.ts src/dsl/dslParser.ts src/dsl/dslTypeParser.ts
          git diff --cached --check
          git commit -m "chore: normalize SAY-116 diagnostics formatting"
          git push origin HEAD:sayosomi/say-116-typo-suggestions-matcher-stable-unknown-name-diagnostics
