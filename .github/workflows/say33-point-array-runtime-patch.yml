name: SAY-33 geometry array final alignment

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'sayosomi' && github.head_ref == 'sayosomi/say-33-nui4-typed-geometry-arrays-point-line-path'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sayosomi/say-33-nui4-typed-geometry-arrays-point-line-path
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply source-semantic alignment fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count}, found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          # Module call matching must count parentheses nested inside array literals.
          replace_exact(
              'src/dsl/dslModuleParser.ts',
              '''    } else if (character === ")" && bracketDepth === 0) {\n      parenDepth -= 1;\n      if (parenDepth === 0) return index;\n''',
              '''    } else if (character === ")") {\n      parenDepth = Math.max(0, parenDepth - 1);\n      if (parenDepth === 0 && bracketDepth === 0) return index;\n'''
          )

          # Host-neutral completion may answer geometry arrays from source lexical
          # semantics even when a dirty initializer makes Module semantic analysis
          # fail closed on the exact current source.
          replace_exact(
              'src/dsl/dslCompletionQuery.ts',
              '''import {\n  moduleCompletionCandidates,\n  isInsideModuleSemanticStatement,\n  type ModuleCompletionCandidate,\n  type ModuleCompletionParameterMetadata\n} from "./moduleCompletionCandidates";\n''',
              '''import {\n  moduleCompletionCandidates,\n  isInsideModuleSemanticStatement,\n  type ModuleCompletionCandidate,\n  type ModuleCompletionParameterMetadata\n} from "./moduleCompletionCandidates";\nimport { geometryArrayDeclarationCompletionContextAt } from "./dslGeometryArrayCompletionContext";\n'''
          )
          replace_exact(
              'src/dsl/dslCompletionQuery.ts',
              '''  // Exact semantic snapshots remain authoritative whenever they can answer.\n  // A fatal current compile may still be exact in source/revision but lack the\n  // Module semantic instance needed for a transient argument-label site.\n  if (compiled && semantic && exact && (context.kind === "moduleCallee" || context.kind === "moduleArgumentLabel" || compiled.moduleSemanticAnalysis)) {\n''',
              '''  const sourceOnlyGeometryArrayContext = context.kind === "geometryArrayValue" || (\n    context.kind === "moduleQualifiedMember" &&\n    geometryArrayDeclarationCompletionContextAt(input.lineText, input.localPosition) !== null\n  );\n\n  // Exact semantic snapshots remain authoritative whenever they can answer.\n  // Geometry-array completion is source-owned and remains available even when\n  // a dirty array initializer makes Module semantic analysis fail closed.\n  if (compiled && semantic && exact && (\n    context.kind === "moduleCallee" ||\n    context.kind === "moduleArgumentLabel" ||\n    compiled.moduleSemanticAnalysis ||\n    sourceOnlyGeometryArrayContext\n  )) {\n'''
          )
          replace_exact(
              'src/dsl/dslCompletionQuery.ts',
              '''    context.kind === "templateHole"\n  )) from += 1;\n''',
              '''    context.kind === "templateHole" ||\n    context.kind === "geometryArrayValue"\n  )) from += 1;\n'''
          )

          # Source-only array completion needs its own Module parameter/export
          # fallback because latest main intentionally withholds Module semantic
          # analysis for fatal dirty authoring states.
          completion_path = Path('src/dsl/moduleCompletionCandidates.ts')
          completion = completion_path.read_text()
          anchor = '''const geometryArrayTypeForSlot = (\n  compiled: CompiledDslDocument,\n  definitionStatementId: string,\n  parameterIndex: number\n): GeometryArrayType | null =>\n  compiled.sourceLexicalNamespace?.geometryArraySemanticAnalysis?.moduleParametersBySlot\n    .get(`${definitionStatementId}:${parameterIndex}`)?.type ?? null;\n'''
          addition = anchor + '''\nconst sourceModuleOwnerIndex = (compiled: CompiledDslDocument, statementIndex: number): number | null => {\n  const visited = new Set<number>();\n  let enclosing = compiled.statements[statementIndex]?.enclosing ?? null;\n  while (enclosing && !visited.has(enclosing.statementIndex)) {\n    visited.add(enclosing.statementIndex);\n    const owner = compiled.statements[enclosing.statementIndex];\n    if (owner?.kind === "moduleDefinition") return enclosing.statementIndex;\n    enclosing = owner?.enclosing ?? null;\n  }\n  return null;\n};\n\nconst uniqueGeometryArrayCandidates = (candidates: readonly ModuleCompletionCandidate[]): ModuleCompletionCandidate[] => {\n  const seen = new Set<string>();\n  return candidates.filter((candidate) => {\n    const key = candidate.identity ?? `${candidate.kind}:${candidate.label}`;\n    if (seen.has(key)) return false;\n    seen.add(key);\n    return true;\n  });\n};\n\nconst sourceModuleArrayParameterCompletions = (\n  compiled: CompiledDslDocument,\n  statementIndex: number,\n  expected: GeometryArrayType\n): ModuleCompletionCandidate[] => {\n  const analysis = compiled.sourceLexicalNamespace?.geometryArraySemanticAnalysis;\n  const ownerIndex = sourceModuleOwnerIndex(compiled, statementIndex);\n  if (!analysis || ownerIndex === null) return [];\n  return analysis.moduleParameters\n    .filter((parameter) => parameter.definitionStatementIndex === ownerIndex && !parameter.optional)\n    .filter((parameter) => isGeometryArrayTypeAssignable(parameter.type, expected))\n    .map((parameter) => ({\n      kind: "binding" as const,\n      label: parameter.name,\n      identity: `module-array-parameter:${parameter.definitionStatementId}:${parameter.parameterIndex}`\n    }));\n};\n\nconst sourceModuleGeometryParameterCompletions = (\n  compiled: CompiledDslDocument,\n  statementIndex: number,\n  expected: GeometryArrayType\n): ModuleCompletionCandidate[] => {\n  const ownerIndex = sourceModuleOwnerIndex(compiled, statementIndex);\n  const owner = ownerIndex === null ? null : compiled.statements[ownerIndex];\n  if (owner?.kind !== "moduleDefinition") return [];\n  const result: ModuleCompletionCandidate[] = [];\n  owner.parameters.forEach((parameter, parameterIndex) => {\n    if (parameter.optional) return;\n    const actual = moduleGeometryInterfaceTypeOf(parameter.type);\n    if (!actual) return;\n    const identity = `source-module-geometry:${ownerIndex}:${parameterIndex}`;\n    if (expected.elementType === "point") {\n      if (actual === "point") result.push({ kind: "geometry", label: parameter.name, identity });\n      else if (actual === "line" || actual === "path") {\n        result.push(\n          { kind: "geometry", label: `${parameter.name}.start`, identity: `${identity}:start` },\n          { kind: "geometry", label: `${parameter.name}.end`, identity: `${identity}:end` }\n        );\n      }\n      return;\n    }\n    if (isModuleGeometryInterfaceAssignable(actual, expected.elementType)) {\n      result.push({ kind: "geometry", label: parameter.name, identity });\n    }\n  });\n  return result;\n};\n'''
          if completion.count(anchor) != 1:
              raise SystemExit('moduleCompletionCandidates: slot anchor mismatch')
          completion = completion.replace(anchor, addition, 1)
          old = '''  const analysis = compiled.sourceLexicalNamespace?.geometryArraySemanticAnalysis;\n  if (!analysis) return [];\n  const result: ModuleCompletionCandidate[] = [];\n  for (const name of bodyNames(compiled, statementIndex, request?.scopeId)) {\n'''
          new = '''  const analysis = compiled.sourceLexicalNamespace?.geometryArraySemanticAnalysis;\n  if (!analysis) return [];\n  const result: ModuleCompletionCandidate[] = [\n    ...sourceModuleArrayParameterCompletions(compiled, statementIndex, expected)\n  ];\n  for (const name of bodyNames(compiled, statementIndex, request?.scopeId)) {\n'''
          if completion.count(old) != 1:
              raise SystemExit('moduleCompletionCandidates: reference result anchor mismatch')
          completion = completion.replace(old, new, 1)
          old = '''  return result;\n};\n\nconst geometryArrayMemberCompletions = (\n  compiled: CompiledDslDocument,\n  statementIndex: number,\n  expected: GeometryArrayType,\n  request?: ModuleCompletionRequest\n): ModuleCompletionCandidate[] =>\n  expected.elementType === "point"\n    ? geometryCompletions(compiled, statementIndex, "point", request)\n    : geometryInterfaceCompletions(compiled, statementIndex, expected.elementType, request);\n'''
          new = '''  return uniqueGeometryArrayCandidates(result);\n};\n\nconst geometryArrayMemberCompletions = (\n  compiled: CompiledDslDocument,\n  statementIndex: number,\n  expected: GeometryArrayType,\n  request?: ModuleCompletionRequest\n): ModuleCompletionCandidate[] => {\n  const semantic = expected.elementType === "point"\n    ? geometryCompletions(compiled, statementIndex, "point", request)\n    : geometryInterfaceCompletions(compiled, statementIndex, expected.elementType, request);\n  return uniqueGeometryArrayCandidates([\n    ...semantic,\n    ...sourceModuleGeometryParameterCompletions(compiled, statementIndex, expected)\n  ]);\n};\n'''
          if completion.count(old) != 1:
              raise SystemExit('moduleCompletionCandidates: member block mismatch')
          completion = completion.replace(old, new, 1)

          qualified_anchor = '''const qualifiedMemberCompletions = (compiled: CompiledDslDocument, statementIndex: number, request: ModuleCompletionRequest): ModuleCompletionCandidate[] => {\n'''
          qualified_helper = '''const sourceQualifiedGeometryArrayCompletions = (\n  compiled: CompiledDslDocument,\n  statementIndex: number,\n  request: ModuleCompletionRequest\n): ModuleCompletionCandidate[] | null => {\n  const context = geometryArrayContextForRequest(compiled, statementIndex, request);\n  if (!context || !request.qualifiedInstanceName) return null;\n  const resolved = visibleLookup(\n    compiled,\n    statementIndex,\n    request.qualifiedInstanceName,\n    request.scopeId,\n    request.sourceOrderIndex\n  );\n  if (resolved?.lookup.kind !== "resolved" || resolved.lookup.declaration.kind !== "moduleInstance") return [];\n  const instanceStatement = compiled.statements[resolved.lookup.declaration.statementIndex];\n  const input = lexicalInput(compiled, null);\n  if (instanceStatement?.kind !== "moduleInstance" || !input) return [];\n  const callee = resolveModuleLexicalDeclaration(\n    input,\n    resolved.lookup.declaration.statementIndex,\n    instanceStatement.moduleName\n  );\n  if (callee.kind !== "resolved" || callee.declaration.kind !== "moduleDefinition") return [];\n  const definitionIndex = callee.declaration.statementIndex;\n  if (context.mode === "arrayReference") {\n    return (compiled.sourceLexicalNamespace?.geometryArraySemanticAnalysis?.values ?? [])\n      .filter((value) => value.ownerModuleDefinitionStatementIndex === definitionIndex && value.exported)\n      .filter((value) => isGeometryArrayTypeAssignable(value.type, context.expectedType))\n      .map((value) => ({ kind: "binding" as const, label: value.name, identity: value.statementId }));\n  }\n  const result: ModuleCompletionCandidate[] = [];\n  compiled.statements.forEach((statement, candidateIndex) => {\n    if (\n      statement.kind !== "element" ||\n      !statement.exported ||\n      sourceModuleOwnerIndex(compiled, candidateIndex) !== definitionIndex\n    ) return;\n    const actual = moduleGeometryInterfaceTypeOfElement(statement);\n    if (!actual) return;\n    const identity = compiled.statementMap?.statementIdByStatementIndex?.get(candidateIndex) ?? `module-export:${candidateIndex}`;\n    if (context.expectedType.elementType === "point") {\n      if (actual === "point") result.push({ kind: "geometry", label: statement.name, identity });\n      else if (actual === "line" || actual === "path") {\n        result.push(\n          { kind: "geometry", label: `${statement.name}.start`, identity: `${identity}:start` },\n          { kind: "geometry", label: `${statement.name}.end`, identity: `${identity}:end` }\n        );\n      }\n      return;\n    }\n    if (isModuleGeometryInterfaceAssignable(actual, context.expectedType.elementType)) {\n      result.push({ kind: "geometry", label: statement.name, identity });\n    }\n  });\n  return result;\n};\n\n'''
          if completion.count(qualified_anchor) != 1:
              raise SystemExit('moduleCompletionCandidates: qualified anchor mismatch')
          completion = completion.replace(qualified_anchor, qualified_helper + qualified_anchor, 1)

          old = '''  const declarationArrayContext = request.liveStatementText && request.logicalCursorPosition !== undefined\n    ? geometryArrayDeclarationCompletionContextAt(request.liveStatementText, request.logicalCursorPosition)\n    : null;\n  if (declarationArrayContext) return geometryArrayCandidates(request.compiled, statementIndex, declarationArrayContext, request);\n  if (!request.compiled.moduleSemanticAnalysis) return [];\n  if (request.kind === "value") return moduleArgumentValues(request.compiled, statementIndex, request.argumentIndex ?? 0, request);\n  if (request.kind === "qualifiedMember") return qualifiedMemberCompletions(request.compiled, statementIndex, request);\n'''
          new = '''  const declarationArrayContext = request.liveStatementText && request.logicalCursorPosition !== undefined\n    ? geometryArrayDeclarationCompletionContextAt(request.liveStatementText, request.logicalCursorPosition)\n    : null;\n  if (declarationArrayContext && request.kind !== "qualifiedMember") {\n    return geometryArrayCandidates(request.compiled, statementIndex, declarationArrayContext, request);\n  }\n  if (request.kind === "qualifiedMember") {\n    const sourceArrayCandidates = sourceQualifiedGeometryArrayCompletions(request.compiled, statementIndex, request);\n    if (sourceArrayCandidates !== null) return sourceArrayCandidates;\n  }\n  if (!request.compiled.moduleSemanticAnalysis) return [];\n  if (request.kind === "value") return moduleArgumentValues(request.compiled, statementIndex, request.argumentIndex ?? 0, request);\n  if (request.kind === "qualifiedMember") return qualifiedMemberCompletions(request.compiled, statementIndex, request);\n'''
          if completion.count(old) != 1:
              raise SystemExit('moduleCompletionCandidates: dispatch block mismatch')
          completion = completion.replace(old, new, 1)
          completion_path.write_text(completion)

          # Module inline point[] runtime validation must match ordinary point[]
          # source semantics: coordinate tuples and derived points are valid.
          runtime_path = Path('src/dsl/moduleGeometryArrayRuntime.ts')
          runtime = runtime_path.read_text()
          runtime = runtime.replace(
              'import type { ElementId } from "../types/geometry";\n',
              'import type { ElementId } from "../types/geometry";\nimport { derivedAnchor, isDerivedPointKeyForGeometryCategory } from "../model/pointAnchors";\n',
              1
          )
          runtime = runtime.replace(
              'import { parseDslReferenceToken, parseDslSourceReference } from "./dslReferenceTokens";\n',
              'import { parseDslReferenceToken, parseDslSourceReference } from "./dslReferenceTokens";\nimport { coordinateComponent } from "./dslParameterSpanScanner";\n',
              1
          )
          old = '''const referencePath = (text: string) => {\n  const parsed = parseDslSourceReference(text.trim());\n  if (parsed.kind !== "valid" || parsed.reference.property) return null;\n  return parseDslReferenceToken(parsed.reference.pathText);\n};\n'''
          new = '''const parsedSourceReference = (text: string) => {\n  const parsed = parseDslSourceReference(text.trim());\n  return parsed.kind === "valid" ? parsed.reference : null;\n};\n\nconst referencePath = (text: string) => {\n  const reference = parsedSourceReference(text);\n  if (!reference || reference.property) return null;\n  return parseDslReferenceToken(reference.pathText);\n};\n\nconst coordinateMember = (text: string) => {\n  const span = { start: 0, end: text.length };\n  return coordinateComponent(text, span, "x") && coordinateComponent(text, span, "y") ? text.trim() : null;\n};\n\nconst isLineEndpointPointKey = (value: string) => value === "start" || value === "end";\n\nconst aliasWithPointKey = (alias: GeometryAlias | undefined, pointKey: string | null): GeometryAlias | null => {\n  if (!alias) return null;\n  if (!pointKey) return alias;\n  return alias.kind === "line" ? { kind: "point", anchor: derivedAnchor(alias.elementId, pointKey) } : null;\n};\n'''
          if runtime.count(old) != 1:
              raise SystemExit('runtime reference helper mismatch')
          runtime = runtime.replace(old, new, 1)
          pattern = re.compile(r'''        const trimmed = member\.text\.trim\(\);\n        if \(\/\^coordinate.*?        addDiagnostic\(runtimeDiagnostic\(statement, span, "geometry-array-member-unresolved", `未解決の geometry array member です: \$\{member\.text\}`\)\);''', re.S)
          replacement = '''        const coordinate = coordinateMember(member.text);\n        if (coordinate) {\n          const actual: GeometryArrayType = { kind: "geometryArray", elementType: "point" };\n          if (!isGeometryArrayTypeAssignable(actual, parameter.type)) {\n            addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-type-mismatch", `geometry array argument「${parameter.name}」に point を渡せません。`));\n          } else members.push({ interfaceType: "point", alias: null });\n          continue;\n        }\n        const sourceReference = parsedSourceReference(member.text);\n        if (!sourceReference) {\n          addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-invalid-member", "geometry array member は geometry reference または coordinate point で指定してください。"));\n          continue;\n        }\n        const path = parseDslReferenceToken(sourceReference.pathText);\n        if (path.segments.length === 0) {\n          addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-invalid-member", "geometry array member の参照が不正です。"));\n          continue;\n        }\n        const pointKey = sourceReference.property;\n        if (pointKey && parameter.type.elementType !== "point") {\n          addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-type-mismatch", "derived point reference は point[] の member としてのみ使用できます。"));\n          continue;\n        }\n\n        const ownerIndex = moduleOwnerIndexOf(statements, instance.statementIndex);\n        if (path.segments.length === 1 && !path.absolute && ownerIndex !== null) {\n          const owner = statements[ownerIndex];\n          if (owner?.kind === "moduleDefinition") {\n            const parameterIndexInOwner = owner.parameters.findIndex((candidate) => candidate.name === path.segments[0]);\n            if (parameterIndexInOwner >= 0) {\n              const ownerParameter = owner.parameters[parameterIndexInOwner]!;\n              const nestedArray = geometryArrayTypeOfModuleParameter(ownerParameter);\n              if (nestedArray) {\n                addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-nested-array", "geometry array を literal member として入れ子にすることはできません。"));\n                continue;\n              }\n              const interfaceType = moduleGeometryInterfaceTypeOf(ownerParameter.type);\n              const ownerDefinitionId = stableStatementIdByIndex.get(ownerIndex);\n              if (interfaceType && ownerDefinitionId) {\n                if (pointKey && ((interfaceType !== "line" && interfaceType !== "path") || !isLineEndpointPointKey(pointKey))) {\n                  addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-type-mismatch", `geometry parameter「${path.segments[0]}」の derived point「${pointKey}」を point[] member として解決できません。`));\n                  continue;\n                }\n                const memberInterfaceType: ModuleGeometryInterfaceType = pointKey ? "point" : interfaceType;\n                const actual: GeometryArrayType = { kind: "geometryArray", elementType: memberInterfaceType };\n                if (!isGeometryArrayTypeAssignable(actual, parameter.type)) {\n                  addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-type-mismatch", `geometry array argument「${parameter.name}」の member 型が一致しません。`));\n                  continue;\n                }\n                const baseAlias = sourceAliasForTarget({\n                  kind: "parameter",\n                  definitionStatementId: ownerDefinitionId,\n                  parameterIndex: parameterIndexInOwner,\n                  geometryKind: interfaceType === "point" ? "point" : "line"\n                }, callerPath, contextsByPath, moduleMaterialization, exportsByPath);\n                members.push({ interfaceType: memberInterfaceType, alias: aliasWithPointKey(baseAlias, pointKey) });\n                continue;\n              }\n            }\n          }\n        }\n\n        const lookup = resolveSourceLexicalPath(sourceNamespace, instance.statementIndex, path);\n        if (lookup.kind === "resolved") {\n          const interfaceType = moduleGeometryInterfaceTypeOfElement(lookup.declaration.statement);\n          if (!interfaceType) {\n            addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-not-geometry", `参照先「${member.text}」は geometry value ではありません。`));\n            continue;\n          }\n          const sourceStatement = lookup.declaration.statement;\n          if (sourceStatement.kind !== "element" || !isGeometryDeclarationCategory(sourceStatement.category)) continue;\n          if (pointKey && !isDerivedPointKeyForGeometryCategory(sourceStatement.category, pointKey)) {\n            addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-type-mismatch", `derived point「${pointKey}」を参照先「${sourceReference.pathText}」から解決できません。`));\n            continue;\n          }\n          const memberInterfaceType: ModuleGeometryInterfaceType = pointKey ? "point" : interfaceType;\n          const actual: GeometryArrayType = { kind: "geometryArray", elementType: memberInterfaceType };\n          if (!isGeometryArrayTypeAssignable(actual, parameter.type)) {\n            addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-type-mismatch", `geometry array argument「${parameter.name}」の member 型が一致しません。`));\n            continue;\n          }\n          const baseAlias = sourceAliasForTarget({\n            kind: "sourceGeometry",\n            statementId: lookup.declaration.statementId,\n            statementIndex: lookup.declaration.statementIndex,\n            category: sourceStatement.category,\n            geometryKind: interfaceType === "point" ? "point" : "line"\n          }, callerPath, contextsByPath, moduleMaterialization, exportsByPath);\n          members.push({ interfaceType: memberInterfaceType, alias: aliasWithPointKey(baseAlias, pointKey) });\n          continue;\n        }\n        if (lookup.kind === "invalidTraversal" && lookup.declaration.kind === "moduleInstance" && path.segments.length === 2) {\n          const childPath = [...callerPath, lookup.declaration.statementId];\n          const exportEntry = exportsByPath.get(pathKey(childPath))?.get(path.segments[1]!);\n          if (!exportEntry) {\n            addDiagnostic(runtimeDiagnostic(statement, span, "module-undefined-export", `module export「${path.segments[1]}」が見つかりません。`));\n            continue;\n          }\n          const exportedStatement = statements[exportEntry.exported.exportedStatementIndex];\n          const interfaceType = moduleGeometryInterfaceTypeOfElement(exportedStatement);\n          if (!interfaceType) continue;\n          if (pointKey && (exportedStatement?.kind !== "element" || !isGeometryDeclarationCategory(exportedStatement.category) || !isDerivedPointKeyForGeometryCategory(exportedStatement.category, pointKey))) {\n            addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-type-mismatch", `module export「${path.segments[1]}」の derived point「${pointKey}」を解決できません。`));\n            continue;\n          }\n          const memberInterfaceType: ModuleGeometryInterfaceType = pointKey ? "point" : interfaceType;\n          const actual: GeometryArrayType = { kind: "geometryArray", elementType: memberInterfaceType };\n          if (!isGeometryArrayTypeAssignable(actual, parameter.type)) {\n            addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-type-mismatch", `geometry array argument「${parameter.name}」の member 型が一致しません。`));\n            continue;\n          }\n          members.push({ interfaceType: memberInterfaceType, alias: aliasWithPointKey(exportEntry.alias, pointKey) });\n          continue;\n        }\n        addDiagnostic(runtimeDiagnostic(statement, span, "geometry-array-member-unresolved", `未解決の geometry array member です: ${member.text}`));'''
          runtime, count = pattern.subn(replacement, runtime, count=1)
          if count != 1:
              raise SystemExit(f'runtime member replacement count={count}')
          runtime_path.write_text(runtime)

          test_path = Path('src/dsl/moduleGeometryArrayRuntime.integration.test.ts')
          tests = test_path.read_text()
          anchor = '  it("checks array argument assignability directionally", () => {\n'
          case = '''  it("accepts coordinate and derived point members in inline point[] arguments", () => {\n    const compiled = compileWithIds([\n      "nui 4",\n      "line L = segment(start: (0, 0), end: (10, 0))",\n      "module M(points: point[]) {",\n      "}",\n      "instance Use = M(points: [@L.start, @L.end, (1, 2)])"\n    ].join("\\n"));\n\n    expect(errorsOf(compiled)).toEqual([]);\n    expect(compiled.document).not.toBeNull();\n  });\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit('runtime test anchor mismatch')
          test_path.write_text(tests.replace(anchor, case + anchor, 1))
          PY
      - name: Focused verification
        run: >-
          npx vitest run
          src/dsl/dslModuleParser.test.ts
          src/dsl/dslCompletionQuery.test.ts
          src/dsl/geometryArrayCompletion.integration.test.ts
          src/dsl/geometryArraySemanticAnalysis.integration.test.ts
          src/dsl/moduleGeometryArrayRuntime.integration.test.ts
      - run: npm run build
      - run: npm run lint
      - name: Commit successful fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/say33-point-array-runtime-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(SAY-33): align geometry array source semantics"
          git push origin HEAD:sayosomi/say-33-nui4-typed-geometry-arrays-point-line-path
