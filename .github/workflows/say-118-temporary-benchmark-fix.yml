name: SAY-118 temporary benchmark fix

on:
  push:
    branches:
      - sayosomi/say-118-explorer-v1-view-container-source-elements-tree

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sayosomi/say-118-explorer-v1-view-container-source-elements-tree
      - name: Apply exact benchmark listener baseline fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('vscode-extension/src/extension.test.ts')
          text = path.read_text()
          old = '    expect(mocks.onDidChangeTextDocument).toHaveBeenCalledTimes(1);'
          new = '    expect(mocks.onDidChangeTextDocument).toHaveBeenCalledTimes(2);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target line, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff --exit-code -- . ':!vscode-extension/src/extension.test.ts' || {
            echo 'unexpected files changed' >&2
            exit 1
          }
      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vscode-extension/src/extension.test.ts
          git commit -m 'test(vscode): update benchmark listener baseline'
          git push origin HEAD:sayosomi/say-118-explorer-v1-view-container-source-elements-tree
