name: SAY-116 Finalize v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sayosomi/say-116-typo-suggestions-matcher-stable-unknown-name-diagnostics'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-116-typo-suggestions-matcher-stable-unknown-name-diagnostics
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply stable diagnostic patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          def decode(value: str) -> str:
              return base64.b64decode(value).decode()

          def replace_once(path: str, old64: str, new64: str) -> None:
              file = Path(path)
              text = file.read_text()
              old = decode(old64)
              new = decode(new64)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once("src/dsl/dslTypeParser.ts", "ICAgIGRpYWdub3N0aWNzLnB1c2goewogICAgICBtZXNzYWdlOiBg5LiN5piO44Gq5Z6L5rOo6YeI44Gn44GZOiAke3RleHR9KCR7YWNjZXB0ZWR9IOOBruOBhOOBmuOCjOOBi+OCkuaMh+WumuOBl+OBpuOBj+OBoOOBleOBhClgLAogICAgICBzcGFuOiB0eXBlU3BhbgogICAgfSk7", "ICAgIGRpYWdub3N0aWNzLnB1c2goewogICAgICBtZXNzYWdlOiBg5LiN5piO44Gq5Z6L5rOo6YeI44Gn44GZOiAke3RleHR9KCR7YWNjZXB0ZWR9IOOBruOBhOOBmuOCjOOBi+OCkuaMh+WumuOBl+OBpuOBj+OBoOOBleOBhClgLAogICAgICBzcGFuOiB0eXBlU3BhbiwKICAgICAgY29kZTogInVua25vd24tdHlwZSIKICAgIH0pOw==")
          replace_once("src/dsl/dslCallParser.ts", "ICAgIGRpYWdub3N0aWMoZGlhZ25vc3RpY3MsIG1lc3NhZ2UsIGNvbnN0cnVjdGlvblNwYW4gPz8gY2F0ZWdvcnlTcGFuKTs=", "ICAgIGRpYWdub3N0aWMoZGlhZ25vc3RpY3MsIG1lc3NhZ2UsIGNvbnN0cnVjdGlvblNwYW4gPz8gY2F0ZWdvcnlTcGFuLCAidW5rbm93bi1jb25zdHJ1Y3Rpb24iKTs=")
          replace_once("src/dsl/dslCallParser.ts", "ICAgICAgZGlhZ25vc3RpYyhkaWFnbm9zdGljcywgYGNvbnN0cnVjdGlvbuOAjCR7Y29uc3RydWN0aW9ufeOAjeOBq+W8leaVsOOAjCR7YXJnLmtleX3jgI3jga/jgYLjgorjgb7jgZvjgpPjgILlgJnoo5w6ICR7Wy4uLmFsbG93ZWQua2V5cygpXS5qb2luKCLjgIEiKX3jgIJgLCBhcmcua2V5U3BhbiEpOw==", "ICAgICAgZGlhZ25vc3RpYyhkaWFnbm9zdGljcywgYGNvbnN0cnVjdGlvbuOAjCR7Y29uc3RydWN0aW9ufeOAjeOBq+W8leaVsOOAjCR7YXJnLmtleX3jgI3jga/jgYLjgorjgb7jgZvjgpPjgILlgJnoo5w6ICR7Wy4uLmFsbG93ZWQua2V5cygpXS5qb2luKCLjgIEiKX3jgIJgLCBhcmcua2V5U3BhbiEsICJ1bmtub3duLWNvbnN0cnVjdGlvbi1hcmd1bWVudCIpOw==")
          replace_once("src/dsl/dslParser.ts", "", "")
          replace_once("src/dsl/dslParser.ts", "ICAgIGRpYWdub3N0aWNzOiBbZGlhZ25vc3RpYyhsaW5lLCBrZXl3b3JkID8gYOacquWvvuW/nOOBrkRTTOOCreODvOODr+ODvOODieOBp+OBmTogJHtrZXl3b3JkfWAgOiAi5paH44Gv44Kt44O844Ov44O844OJ44GL44KJ5aeL44KB44Gm44GP44Gg44GV44GE44CCIild", "")
          replace_once("src/dsl/dslReferences.ts", "Y29uc3QgZGlhZ25vc3RpYyA9IChsaW5lOiBudW1iZXIsIG1lc3NhZ2U6IHN0cmluZyk6IERzbERpYWdub3N0aWMgPT4gKHsKICBzZXZlcml0eTogIndhcm5pbmciLAogIGxpbmUsCiAgY29sdW1uOiAxLAogIG1lc3NhZ2UKfSk7", "")
          replace_once("src/dsl/dslReferences.ts", "ICBkaWFnbm9zdGljcy5wdXNoKGRpYWdub3N0aWMobGluZSwgYOWPgueFp+WFiOOBjOimi+OBpOOBi+OCiuOBvuOBm+OCkzogJHt1bnJlc29sdmVkVG9rZW59YCkpOw==", "ICBkaWFnbm9zdGljcy5wdXNoKHVuZGVmaW5lZEdlb21ldHJ5UmVmZXJlbmNlRGlhZ25vc3RpYygKICAgIGxpbmUsCiAgICBg5Y+C54Wn5YWI44GM6KaL44Gk44GL44KK44G+44Gb44KTOiAke3VucmVzb2x2ZWRUb2tlbn1gLAogICAgc291cmNlU3BhbiwKICAgIHJlZmVyZW5jZS5wYXRoUmFuZ2UKICApKTs=")
          replace_once("src/dsl/dslReferences.ts", "ICBjb25zdCBlbGVtZW50SWQgPSByZXNvbHZlSWQocGF0aFRva2VuLCBpbmRleCwgbGluZSwgZGlhZ25vc3RpY3MsIGN1cnJlbnRFbGVtZW50KTs=", "ICBjb25zdCBlbGVtZW50SWQgPSByZXNvbHZlSWQocGF0aFRva2VuLCBpbmRleCwgbGluZSwgZGlhZ25vc3RpY3MsIGN1cnJlbnRFbGVtZW50LCBzb3VyY2VTcGFuKTs=")
          replace_once("src/dsl/dslReferences.ts", "ICAgIGxpbmVJZDogcmVzb2x2ZUlkKGxpbmVOYW1lLCBpbmRleCwgbGluZSwgZGlhZ25vc3RpY3MsIGN1cnJlbnRFbGVtZW50KSw=", "ICAgIGxpbmVJZDogcmVzb2x2ZUlkKGxpbmVOYW1lLCBpbmRleCwgbGluZSwgZGlhZ25vc3RpY3MsIGN1cnJlbnRFbGVtZW50LCBzb3VyY2VTcGFuKSw=")
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Focused tests
        run: npm test -- src/dsl/dslTypoMatcher.test.ts src/dsl/dslUnknownNameDiagnostics.test.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build VS Code extension
        run: npm run build:vscode

      - name: Full Node tests
        run: npm test

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/say-116-apply.yml \
            .github/workflows/say-116-pr-apply.yml \
            .github/workflows/say-116-fix-embedded-target.yml \
            .github/workflows/say-116-finalize.yml \
            .github/workflows/say-116-finalize-v2.yml
          git add \
            src/dsl/dslTypeParser.ts \
            src/dsl/dslCallParser.ts \
            src/dsl/dslParser.ts \
            src/dsl/dslReferences.ts
          git commit -m "feat: add stable unknown-name diagnostics (SAY-116)"
          git push origin HEAD:sayosomi/say-116-typo-suggestions-matcher-stable-unknown-name-diagnostics
