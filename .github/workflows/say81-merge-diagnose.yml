name: SAY-81 merge and diagnose

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  merge-diagnose:
    if: ${{ github.event.pull_request.head.ref == 'sayosomi/say-81-vs-code-reveal-in-canvas-semantic-caret-targeting-for' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SAY-81 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Merge latest main and capture Node failure
        run: python3 scripts/say81-merge-diagnose.py
