name: SAY-131 Direct Implement

on:
  push:
    branches:
      - sayosomi/say-131-runtime-diagnostics-canonical-webview-publication
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'chore: stage SAY-131 direct implementation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-131-runtime-diagnostics-canonical-webview-publication
          fetch-depth: 0

      - name: Apply implementation
        run: python scripts/say131_apply.py

      - name: Check patch
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused tests
        run: npm test -- src/vscode/VSCodeApp.runtimeDiagnostics.test.tsx src/scalars/runtimeScalarDiagnostics.test.ts

      - name: Build VS Code bundle
        run: npm run build:vscode

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Commit implementation and remove staging helpers
        run: |
          rm scripts/say131_apply.py .github/workflows/say-131-direct-implement.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish canonical runtime diagnostics (SAY-131)"
          git push origin HEAD:sayosomi/say-131-runtime-diagnostics-canonical-webview-publication
