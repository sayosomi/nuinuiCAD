name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply_say121:
    name: Apply SAY-121 semantic patch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-121-module-diagnostics-recursion-cycle-explanations
          fetch-depth: 0

      - name: Patch recursion diagnostics and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("src/dsl/moduleSemanticAnalysis.ts")
          text = path.read_text()

          old_import = 'import { moduleCallEdges, recursiveModuleInstanceIds } from "./moduleCallGraph";'
          new_import = 'import { moduleCallEdges, moduleRecursionCycles } from "./moduleCallGraph";'
          if text.count(old_import) != 1:
              raise SystemExit(f"expected exactly one moduleCallGraph import, found {text.count(old_import)}")
          text = text.replace(old_import, new_import)

          start_marker = "  const callEdges = moduleCallEdges(instances);"
          end_marker = "  for (const [statementIndex, local] of localDiagnosticsByStatement) {"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit(f"recursion diagnostic markers not found: start={start}, end={end}")
          old_block = text[start:end]
          expected_line = "  const recursiveInstances = recursiveModuleInstanceIds(semanticDefinitions, callEdges);"
          if old_block.count(expected_line) != 1 or old_block.count('issue("module-recursion"') != 1:
              raise SystemExit("recursion diagnostic block did not match the expected current implementation")

          new_block = "\n".join([
              "  const callEdges = moduleCallEdges(instances);",
              "  const recursionCycles = moduleRecursionCycles(callEdges);",
              "  const recursionInstancesByStatementId = new Map(instances.map((instance) => [instance.statementId, instance] as const));",
              "  for (const instance of instances) {",
              "    const cycle = recursionCycles.get(instance.statementId);",
              "    if (!cycle) continue;",
              "    const statement = statements[instance.statementIndex];",
              '    if (statement.kind !== "moduleInstance") continue;',
              "    const relatedSources: DiagnosticRelatedSource[] = [];",
              "    for (const edge of cycle) {",
              "      if (edge.instanceStatementId === instance.statementId) continue;",
              "      const relatedInstance = recursionInstancesByStatementId.get(edge.instanceStatementId);",
              "      if (!relatedInstance) continue;",
              "      const relatedStatement = statements[relatedInstance.statementIndex];",
              '      if (relatedStatement.kind !== "moduleInstance") continue;',
              "      relatedSources.push({",
              "        statementIndex: relatedInstance.statementIndex,",
              "        span: relatedStatement.moduleNameSpan ?? relatedStatement.keywordSpan,",
              '        message: "module recursion cycle に含まれる呼び出しです。"',
              "      });",
              "    }",
              "    addLocal(",
              "      instance.statementIndex,",
              "      issue(",
              '        "module-recursion",',
              "        statement.moduleNameSpan ?? statement.keywordSpan,",
              '        `module recursion は許可されていません:「${statement.moduleName}」。`,',
              "        { relatedSources }",
              "      )",
              "    );",
              "  }",
              "",
              ""
          ])
          path.write_text(text[:start] + new_block + text[end:])
          PY

          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/say-121-apply.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/dsl/moduleSemanticAnalysis.ts .github/workflows/ci.yml
          git add -u -- .github/workflows/say-121-apply.yml
          git commit -m "feat: attach recursion cycle related locations (SAY-121)"
          git push origin HEAD:sayosomi/say-121-module-diagnostics-recursion-cycle-explanations

  classification:
    name: Classify changes
    needs: apply_say121
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      node: ${{ steps.classify.outputs.node }}
      full_node: ${{ steps.classify.outputs.full_node }}
      vscode: ${{ steps.classify.outputs.vscode }}
      rust: ${{ steps.classify.outputs.rust }}
      parity: ${{ steps.classify.outputs.parity }}
      workflow: ${{ steps.classify.outputs.workflow }}
      unknown: ${{ steps.classify.outputs.unknown }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test change classifier
        run: node --test scripts/ci/classifyChanges.node-test.mjs

      - name: Resolve diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME:$EVENT_REF" in
            pull_request:*)
              base_sha="$PR_BASE_SHA"
              ;;
            push:refs/heads/main)
              base_sha="$PUSH_BEFORE_SHA"
              ;;
            *)
              base_sha=""
              ;;
          esac

          if [[ ! "$base_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
             [[ "$base_sha" =~ ^0+$ ]] ||
             [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unable to resolve a safe event diff base; using full CI coverage."
          else
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whitespace and classify changes
        id: classify
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          BASE_VALID: ${{ steps.base.outputs.valid }}
        run: |
          set -euo pipefail
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$BASE_VALID" == "true" ]]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
            git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" |
              node scripts/ci/classifyChanges.mjs >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/classifyChanges.mjs --full </dev/null >> "$GITHUB_OUTPUT"
          fi

  node:
    name: Node
    needs: classification
    if: ${{ needs.classification.result == 'success' && needs.classification.outputs.node == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-121-module-diagnostics-recursion-cycle-explanations
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Changed Node tests
        if: ${{ needs.classification.outputs.full_node != 'true' }}
        env:
          BASE_SHA: ${{ needs.classification.outputs.base_sha }}
        run: npm test -- --changed "$BASE_SHA" --passWithNoTests

      - name: Filesystem-backed binding resolution invariant
        if: ${{ needs.classification.outputs.full_node != 'true' }}
        run: npm test -- test/bindingResolutionPublicSurface.test.ts

      - name: Build VS Code extension
        if: ${{ needs.classification.outputs.vscode == 'true' }}
        run: npm run build:vscode

  rust_parity:
    name: Rust + parity
    needs: classification
    if: ${{ needs.classification.result == 'success' && (needs.classification.outputs.rust == 'true' || needs.classification.outputs.parity == 'true' || needs.classification.outputs.full_node == 'true') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-121-module-diagnostics-recursion-cycle-explanations

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check Rust formatting
        if: ${{ needs.classification.outputs.rust == 'true' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Cargo check
        if: ${{ needs.classification.outputs.rust == 'true' }}
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        if: ${{ needs.classification.outputs.rust == 'true' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        if: ${{ needs.classification.outputs.rust == 'true' }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Setup Node
        if: ${{ needs.classification.outputs.parity == 'true' || needs.classification.outputs.full_node == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        if: ${{ needs.classification.outputs.parity == 'true' || needs.classification.outputs.full_node == 'true' }}
        run: npm ci

      - name: Build Rust evaluation fixture
        if: ${{ needs.classification.outputs.full_node == 'true' }}
        run: cargo build --quiet --manifest-path src-tauri/Cargo.toml --example evaluate_fixture

      - name: Full Node tests
        if: ${{ needs.classification.outputs.full_node == 'true' }}
        run: npm test

      - name: TypeScript/Rust parity
        if: ${{ needs.classification.outputs.parity == 'true' }}
        run: npm run test:parity

  ci:
    name: CI
    if: ${{ always() }}
    needs:
      - classification
      - node
      - rust_parity
    runs-on: ubuntu-24.04

    steps:
      - name: Check required CI results
        env:
          CLASSIFICATION_RESULT: ${{ needs.classification.result }}
          CLASSIFICATION_NODE: ${{ needs.classification.outputs.node }}
          CLASSIFICATION_FULL_NODE: ${{ needs.classification.outputs.full_node }}
          CLASSIFICATION_VSCODE: ${{ needs.classification.outputs.vscode }}
          CLASSIFICATION_RUST: ${{ needs.classification.outputs.rust }}
          CLASSIFICATION_PARITY: ${{ needs.classification.outputs.parity }}
          CLASSIFICATION_WORKFLOW: ${{ needs.classification.outputs.workflow }}
          CLASSIFICATION_UNKNOWN: ${{ needs.classification.outputs.unknown }}
          NODE_RESULT: ${{ needs.node.result }}
          RUST_PARITY_RESULT: ${{ needs.rust_parity.result }}
        run: |
          set -euo pipefail

          if [[ "$CLASSIFICATION_RESULT" != "success" ]]; then
            echo "Classification job did not succeed: $CLASSIFICATION_RESULT"
            exit 1
          fi

          for classifier_output in \
            "$CLASSIFICATION_NODE" \
            "$CLASSIFICATION_FULL_NODE" \
            "$CLASSIFICATION_VSCODE" \
            "$CLASSIFICATION_RUST" \
            "$CLASSIFICATION_PARITY" \
            "$CLASSIFICATION_WORKFLOW" \
            "$CLASSIFICATION_UNKNOWN"; do
            if [[ "$classifier_output" != "true" && "$classifier_output" != "false" ]]; then
              echo "Malformed classifier output: '$classifier_output'"
              exit 1
            fi
          done

          if [[ "$CLASSIFICATION_NODE" == "true" ]]; then
            if [[ "$NODE_RESULT" != "success" ]]; then
              echo "Required Node job did not succeed: $NODE_RESULT"
              exit 1
            fi
          elif [[ "$NODE_RESULT" != "success" && "$NODE_RESULT" != "skipped" ]]; then
            echo "Optional Node job did not succeed: $NODE_RESULT"
            exit 1
          fi

          if [[ "$CLASSIFICATION_RUST" == "true" ||
                "$CLASSIFICATION_PARITY" == "true" ||
                "$CLASSIFICATION_FULL_NODE" == "true" ]]; then
            if [[ "$RUST_PARITY_RESULT" != "success" ]]; then
              echo "Required Rust/parity job did not succeed: $RUST_PARITY_RESULT"
              exit 1
            fi
          elif [[ "$RUST_PARITY_RESULT" != "success" &&
                  "$RUST_PARITY_RESULT" != "skipped" ]]; then
            echo "Optional Rust/parity job did not succeed: $RUST_PARITY_RESULT"
            exit 1
          fi