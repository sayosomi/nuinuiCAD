name: SAY-115 Sync Latest Main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-115-legacy-palette-remove-source-canonical-model
          fetch-depth: 0

      - name: Merge latest main and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin HEAD:sayosomi/say-115-legacy-palette-remove-source-canonical-model
