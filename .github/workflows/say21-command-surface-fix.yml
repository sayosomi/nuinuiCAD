name: SAY-21 command surface fix

on:
  push:
    branches:
      - sayosomi/say-21-common-tangent
    paths:
      - .github/workflows/say21-command-surface-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Patch command surface
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found: {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/commands/commandTypes.ts",
              '  | "addAngleLengthLine"\n  | "addArcLine"',
              '  | "addAngleLengthLine"\n  | "addCommonTangentLine"\n  | "addArcLine"',
          )

          replace(
              "src/commands/legacyCreationRecipes.ts",
              '  addAngleLengthLine: { type: "angleLengthLine", recipeKind: "specialized" },\n  addArcLine:',
              '  addAngleLengthLine: { type: "angleLengthLine", recipeKind: "specialized" },\n  addCommonTangentLine: { type: "commonTangentLine", recipeKind: "fallback" },\n  addArcLine:',
          )

          angle_block = '''  addAngleLengthLine: {
    id: "addAngleLengthLine",
    label: "角度距離線を追加",
    palette: { order: 8.5, keywords: ["angle", "length", "line", "角度", "距離", "長さ", "線", "追加"] },
    run: (context) => startCreationSessionForCommand("addAngleLengthLine", context)
  },
'''
          common_block = angle_block + '''  addCommonTangentLine: {
    id: "addCommonTangentLine",
    label: "Add Common Tangent",
    palette: {
      order: 8.75,
      keywords: ["common tangent", "tangent", "circle", "line", "共通接線", "接線", "円", "線", "追加"]
    },
    run: (context) => startCreationSessionForCommand("addCommonTangentLine", context)
  },
'''
          replace("src/commands/creationCommandDefinitions.ts", angle_block, common_block)

          replace(
              "src/commands/creationRecipes.test.ts",
              '      angleLengthLine: "line 作成angleLengthLine = polar(start: @A, angle: 12, length: 12)",\n      arcLine:',
              '      angleLengthLine: "line 作成angleLengthLine = polar(start: @A, angle: 12, length: 12)",\n      commonTangentLine: "line 作成commonTangentLine = commonTangent(first: @AB, second: @AB, kind: external, side: left)",\n      arcLine:',
          )
          PY

      - name: Focused verification
        run: |
          npm ci
          npx vitest run src/commands/creationRecipes.test.ts src/commands/phase4gCreationCutover.test.ts src/geometry/commonTangentEvaluator.test.ts
          npm run build
          npm run lint
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/say21-command-surface-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/say21-command-surface-fix.yml \
            src/commands/commandTypes.ts \
            src/commands/legacyCreationRecipes.ts \
            src/commands/creationCommandDefinitions.ts \
            src/commands/creationRecipes.test.ts
          git commit -m "fix: expose common tangent creation command (SAY-21)"
          git push origin HEAD:sayosomi/say-21-common-tangent
