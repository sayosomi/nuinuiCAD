name: SAY-196 root composition migration

on:
  push:
    branches:
      - sayosomi/say-196-say-180-split-extract-attached-observation-extension-host

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sayosomi/say-196-say-180-split-extract-attached-observation-extension-host
      - name: Route attached observation lifecycle through feature owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vscode-extension/src/extension.ts')
          text = path.read_text()
          replacements = [
            (
              'import {\n  vscodeObservationState,\n  type VscodeObservationHostDocument\n} from "./vscodeObservationState";',
              'import type { VscodeObservationHostDocument } from "./vscodeObservationState";\nimport { registerVscodeObservationFeature } from "./vscodeObservationFeature";'
            ),
            (
              '  vscodeObservationState.reset();\n  vscodeObservationState.setHostDocumentsProvider(observationHostDocuments);',
              '  const observationFeature = registerVscodeObservationFeature({ hostDocuments: observationHostDocuments });\n  context.subscriptions.push(observationFeature);'
            ),
            ('      vscodeObservationState.invalidateCanvasRuntime(key);', '      observationFeature.invalidateDocumentRuntime(key);'),
            ('    vscodeObservationState.removeDocument(key);', '    observationFeature.removeDocument(key);'),
            ('    vscodeObservationState.invalidateCanvasRuntime(session.documentUri);', '    observationFeature.removeCanvasSession(session.documentUri);'),
            ('          vscodeObservationState.invalidateCanvasRuntime(session.documentUri);', '          observationFeature.invalidateDocumentRuntime(session.documentUri);'),
            (
              '        vscodeObservationState.acceptCanvasPublication({\n          sessionDocumentUri: session.documentUri,\n          sessionSurfaceKind: session.surfaceKind,\n          sessionIsCurrent: sessions.get(session.documentUri, "canvas") === session && isOpenDocument(session.document),\n          currentDocumentVersion: session.document.version,\n          snapshot: message.snapshot\n        });',
              '        observationFeature.acceptCanvasPublication({\n          sessionDocumentUri: session.documentUri,\n          sessionSurfaceKind: session.surfaceKind,\n          sessionIsCurrent: sessions.get(session.documentUri, "canvas") === session && isOpenDocument(session.document),\n          currentDocumentVersion: session.document.version,\n          snapshot: message.snapshot\n        });'
            ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          if 'vscodeObservationState.' in text:
              raise SystemExit('direct vscodeObservationState call remains in extension.ts')
          path.write_text(text)
          PY
      - name: Remove one-shot migration workflow and push
        run: |
          git rm .github/workflows/say-196-root-composition.yml
          git add vscode-extension/src/extension.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "SAY-196: compose attached observation feature owner"
          git push origin HEAD:sayosomi/say-196-say-180-split-extract-attached-observation-extension-host
