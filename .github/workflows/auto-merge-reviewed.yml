name: Reserve reviewed PR auto-merge

# Exact owner review attestation bound to PR HEAD and main SHA.
# Never check out PR head, never directly merge.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  checks: read
  statuses: read
  pull-requests: write

concurrency:
  group: auto-merge-reviewed-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reserve-reviewed-pr:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'sayosomi' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/auto-merge-reviewed')
    runs-on: ubuntu-24.04
    steps:
      - name: Verify exact reviewed refs and reserve PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          # Requests must be exact to prevent accidental triggers from prose.
          [[ "$BODY" =~ ^/auto-merge-reviewed$'\n'head=([0-9a-f]{40})$'\n'base=([0-9a-f]{40})$'\n'review=PASS$ ]] ||
            { echo "BLOCKED: malformed reviewed request" >&2; exit 1; }
          EXPECTED_HEAD="${BASH_REMATCH[1]}"
          EXPECTED_MAIN="${BASH_REMATCH[2]}"
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || exit 1

          verify() {
            local pr_json current_main comparison graphql state draft base head branch head_repo base_repo mergeable existing id required_app protected_branch ci_runs ci_run_id job_runs check_runs
            pr_json="$(gh api "repos/$REPO/pulls/$PR")" || return 1
            state="$(jq -r '.state' <<< "$pr_json")"
            draft="$(jq -r '.draft' <<< "$pr_json")"
            base="$(jq -r '.base.ref' <<< "$pr_json")"
            head="$(jq -r '.head.sha' <<< "$pr_json")"
            branch="$(jq -r '.head.ref' <<< "$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
            base_repo="$(jq -r '.base.repo.full_name' <<< "$pr_json")"
            [[ "$state" == open && "$draft" == false && "$base" == main ]] ||
              { echo "BLOCKED: PR state/base/draft" >&2; return 1; }
            [[ "$head" == "$EXPECTED_HEAD" && "$head_repo" == "$REPO" && "$base_repo" == "$REPO" ]] ||
              { echo "BLOCKED: reviewed HEAD or repo identity mismatch" >&2; return 1; }
            [[ -n "$branch" && "$branch" != main ]] ||
              { echo "BLOCKED: invalid source branch" >&2; return 1; }

            current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')" || return 1
            [[ "$current_main" == "$EXPECTED_MAIN" ]] ||
              { echo "BLOCKED: authoritative main changed" >&2; return 1; }
            comparison="$(gh api "repos/$REPO/compare/$EXPECTED_MAIN...$EXPECTED_HEAD")" || return 1
            jq -e --arg main "$EXPECTED_MAIN" '
              (.status == "ahead") and
              (.base_commit.sha == $main) and
              (.merge_base_commit.sha == $main) and
              (.behind_by == 0)
            ' <<< "$comparison" >/dev/null ||
              { echo "BLOCKED: PR has not integrated current main" >&2; return 1; }

            graphql="$(gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){id mergeable autoMergeRequest{mergeMethod}}}}' -f owner="${REPO%/*}" -f repo="${REPO#*/}" -F number="$PR")" || return 1
            mergeable="$(jq -r '.data.repository.pullRequest.mergeable' <<< "$graphql")"
            existing="$(jq -r '.data.repository.pullRequest.autoMergeRequest.mergeMethod // "NONE"' <<< "$graphql")"
            id="$(jq -r '.data.repository.pullRequest.id' <<< "$graphql")"
            [[ "$mergeable" == MERGEABLE && "$existing" == NONE && "$id" != null && -n "$id" ]] ||
              { echo "BLOCKED: ambiguous mergeability or existing auto-merge" >&2; return 1; }

            echo "REVIEWED: PR identity, main, ancestry and mergeability verified" >&2
            # GitHub CLI --required cannot reliably resolve the base's required
            # check from a PR head branch under the workflow's GITHUB_TOKEN.
            # Prove main's actual protection directly, then read the check run
            # from the exact reviewed PR commit and required GitHub Actions App.
            protected_branch="$(gh api "repos/$REPO/branches/main")" || return 1
            required_app="$(jq -er '
              if .protected == true and
                .protection.enabled == true and
                .protection.required_status_checks.enforcement_level == "everyone" and
                .protection.required_status_checks.contexts == ["CI"] and
                (.protection.required_status_checks.checks | length) == 1 and
                .protection.required_status_checks.checks[0].context == "CI" and
                (.protection.required_status_checks.checks[0].app_id | type) == "number" and
                .protection.required_status_checks.checks[0].app_id > 0
              then .protection.required_status_checks.checks[0].app_id
              else empty end
            ' <<< "$protected_branch")" ||
              { echo "BLOCKED: required CI protection not proven" >&2; return 1; }

            # The protected aggregator may materialize only after dependencies.
            # Verify an exact-head pending workflow with no failed jobs; reject
            # already-complete CI even if the enclosing run is not settled.
            ci_runs="$(gh api "repos/$REPO/actions/runs?head_sha=$EXPECTED_HEAD&event=pull_request&per_page=100")" || return 1
            jq -e --arg head "$EXPECTED_HEAD" --arg branch "$branch" '
              (.total_count == 1) and
              (.workflow_runs | length == 1) and
              (.workflow_runs[0] |
                .name == "CI" and
                .path == ".github/workflows/ci.yml" and
                .event == "pull_request" and
                .head_sha == $head and
                .head_branch == $branch and
                (.status == "queued" or .status == "in_progress") and
                .conclusion == null)
            ' <<< "$ci_runs" >/dev/null ||
              { echo "BLOCKED: required CI workflow is not unambiguously pending" >&2; return 1; }
            ci_run_id="$(jq -r '.workflow_runs[0].id' <<< "$ci_runs")"
            [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]] ||
              { echo "BLOCKED: invalid CI run identity" >&2; return 1; }
            job_runs="$(gh api "repos/$REPO/actions/runs/$ci_run_id/jobs?per_page=100")" || return 1
            jq -e '
              (.total_count <= 100) and
              ((.jobs | length) == .total_count) and
              all(.jobs[]; .conclusion == null or
                .conclusion == "success" or .conclusion == "skipped")
            ' <<< "$job_runs" >/dev/null ||
              { echo "BLOCKED: CI jobs failed or ambiguous" >&2; return 1; }
            check_runs="$(gh api "repos/$REPO/commits/$EXPECTED_HEAD/check-runs?per_page=100")" || return 1
            jq -e --argjson app "$required_app" --arg head "$EXPECTED_HEAD" '
              (.total_count <= 100) and
              ([.check_runs[] | select(.name == "CI" and .app.id == $app and .head_sha == $head)] |
                length <= 1) and
              ([.check_runs[] | select(.name == "CI" and .app.id == $app and .head_sha == $head)] |
                all(.[]; .conclusion == null and
                  (.status == "queued" or .status == "in_progress")))
            ' <<< "$check_runs" >/dev/null ||
              { echo "BLOCKED: required CI check has concluded or is ambiguous" >&2; return 1; }
            echo "REVIEWED: protected CI pending, exact-head jobs not failed" >&2
            printf '%s' "$id"
          }

          # Recheck GitHub state immediately before reservation.
          ID="$(verify)" || exit 1
          ID_AGAIN="$(verify)" || exit 1
          [[ "$ID" == "$ID_AGAIN" ]] ||
            { echo "BLOCKED: PR identity changed before mutation" >&2; exit 1; }

          # Reservation only; no direct merge fallback and no retry.
          gh api graphql \
            -f query='mutation($id:ID!,$head:GitObjectID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE,expectedHeadOid:$head}){clientMutationId}}' \
            -f id="$ID" -f head="$EXPECTED_HEAD" >/dev/null

          # Read back exact reservation, not merely API mutation success.
          proof="$(gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){id state headRefOid autoMergeRequest{mergeMethod}}}}' -f owner="${REPO%/*}" -f repo="${REPO#*/}" -F number="$PR")" || exit 1
          jq -e --arg id "$ID" --arg head "$EXPECTED_HEAD" '
            .data.repository.pullRequest as $pr |
            $pr.id == $id and $pr.state == "OPEN" and
            $pr.headRefOid == $head and $pr.autoMergeRequest.mergeMethod == "MERGE"
          ' <<< "$proof" >/dev/null ||
            { echo "BLOCKED: auto-merge read-back mismatch (inspect remote state)" >&2; exit 1; }
          echo "AUTO-MERGE REVIEWED RESERVED: PR=$PR HEAD=$EXPECTED_HEAD MAIN=$EXPECTED_MAIN METHOD=MERGE"
