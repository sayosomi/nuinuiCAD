    }), [moduleMaterialization, moduleSemanticAnalysis, sourceLexicalNamespace, statementInfoByElementId]);
''',
                  '      canvasTheme,\n'
              )
          ]:
              import_path = './canvasRevisionPresentation' if '/components/' in wrapper else '../components/canvasRevisionPresentation'
              replace_exact(wrapper, import_anchor, import_anchor + f'import {{ useRevisionCoherentCanvasPresentation }} from "{import_path}";\n')
              presentation_block = module_anchor + '''    const currentCanvasPresentation = useMemo(() => ({
      elements,
