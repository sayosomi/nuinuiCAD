      evaluationState
    });
'''
              replace_exact(wrapper, module_anchor, presentation_block)
              old_fields = '      elements,\n      canonicalElements,\n      evaluationLimitIndex,\n      compiledDocumentRevision,\n' + theme_line + '      palette,\n      visibilityProfiles,\n      activeVisibilityProfileId,\n      moduleSemanticContext,\n'
              new_fields = '      elements: canvasPresentation.elements,\n      canonicalElements: canvasPresentation.canonicalElements,\n      evaluationLimitIndex: canvasPresentation.evaluationLimitIndex,\n      compiledDocumentRevision,\n' + theme_line + '      palette: canvasPresentation.palette,\n      visibilityProfiles: canvasPresentation.visibilityProfiles,\n      activeVisibilityProfileId: canvasPresentation.activeVisibilityProfileId,\n      moduleSemanticContext: canvasPresentation.moduleSemanticContext,\n'
              replace_exact(wrapper, old_fields, new_fields)
              replace_exact(
                  wrapper,
                  '      activeVisibilityProfileId,\n      canvasViewport,\n',
                  '      activeVisibilityProfileId,\n      canvasPresentation,\n      canvasViewport,\n'
              )

          Path(".github/workflows/say-102-branch-patch.yml").unlink()
