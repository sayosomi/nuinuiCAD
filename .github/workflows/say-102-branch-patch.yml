      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit patched branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve Canvas presentation across transient editor errors"
          git push origin HEAD:sayosomi/say-102-vscode-canvas-transient-invalid-source-revision-stability
