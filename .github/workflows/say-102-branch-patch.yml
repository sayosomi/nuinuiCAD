name: SAY-102 branch patch

on:
  push:
    branches:
      - sayosomi/say-102-vscode-canvas-transient-invalid-source-revision-stability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-102-vscode-canvas-transient-invalid-source-revision-stability
          fetch-depth: 0

      - name: Apply SAY-102 source patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              file.write_text(text.replace(old, new))

          # Selection reconciliation: editor snapshots carrying an error diagnostic
          # are not authoritative enough to prune the last stable Canvas selection.
          replace_exact(
              "src/state/cadUiStore.ts",
              'const currentDocumentDrawingModifiers = () => useCadDocumentStore.getState().modifiers ?? [];\n',
              '''const currentDocumentDrawingModifiers = () => useCadDocumentStore.getState().modifiers ?? [];

/**
 * A live editor compile may intentionally publish a partial document while a
 * recoverable error (notably missing-attribute-value) is still present. That
 * snapshot is useful for diagnostics/completion, but it is not authoritative
 * enough to prune Canvas selection. The next error-free editor snapshot runs
 * normal reconciliation again, so intentional delete/hidden/disabled changes
 * still clear selection once they are authoritative.
 */
const selectionReconciliationWaitsForEditorRecovery = () => {
  const documentState = useCadDocumentStore.getState();
  if (documentState.sourceUpdate.kind !== "editor") return false;
  return documentState.diagnostics.some((diagnostic) => diagnostic.severity === "error") ||
    documentState.bindingIssueDiagnostics.some((diagnostic) => diagnostic.severity === "error");
};
'''
          )
          replace_exact(
              "src/state/cadUiStore.ts",
              '''      // A typed binding is the active subject: element selection was deliberately
      // cleared (setSelectedBindingId) && must stay cleared on document recompile.
      state.selectionSubject.kind === "binding"
        ? {}
''',
              '''      // A typed binding is the active subject: element selection was deliberately
      // cleared (setSelectedBindingId) && must stay cleared on document recompile.
      // An errorful live-editor snapshot is likewise non-authoritative for
      // selection pruning; the next error-free editor revision reconciles it.
      state.selectionSubject.kind === "binding" || selectionReconciliationWaitsForEditorRecovery()
        ? {}
'''
          )

          helper = r'''import { useLayoutEffect, useRef } from "react";
import type { EvaluationEngineState } from "../geometry/useEvaluationEngine";
import type { ModuleSemanticCandidateContext } from "../model/moduleSemanticCandidateBoundary";
import type {
  CadElement,
  DocumentPalette,
  VisibilityProfile
} from "../types/geometry";

/** Document-owned Canvas inputs that must travel with one evaluation request. */
export type CanvasRevisionPresentationInputs = {
  elements: CadElement[];
  canonicalElements: CadElement[];
  evaluationLimitIndex: number | undefined;
  palette: DocumentPalette;
  visibilityProfiles: VisibilityProfile[];
  activeVisibilityProfileId: string | null;
  moduleSemanticContext: ModuleSemanticCandidateContext;
};

export type CanvasRevisionPresentationSnapshot = {
  evaluationRevision: number;
  evaluationRequestRevision: number;
  inputs: CanvasRevisionPresentationInputs;
};

export const resolveRevisionCoherentCanvasPresentation = ({
  current,
  compiledDocumentRevision,
  evaluationState,
  lastStable
}: {
  current: CanvasRevisionPresentationInputs;
  compiledDocumentRevision: number;
  evaluationState?: EvaluationEngineState;
  lastStable: CanvasRevisionPresentationSnapshot | null;
}): CanvasRevisionPresentationInputs => {
  if (!evaluationState) return current;
  if (!evaluationState.isStale && evaluationState.evaluationRevision === compiledDocumentRevision) {
    return current;
  }
  if (
    lastStable &&
    lastStable.evaluationRevision === evaluationState.evaluationRevision &&
    lastStable.evaluationRequestRevision === evaluationState.evaluationRequestRevision
  ) {
    return lastStable.inputs;
  }
  // A matching snapshot exists in every normal stale transition because the
  // previous request was rendered before it could become stale. If a host is
  // remounted mid-request, keep legacy fallback behavior rather than inventing
  // document metadata for an evaluation we cannot identify.
  return current;
};

/**
 * Keeps render-owned document metadata paired with the evaluation request that
 * produced the geometry. Current host revision/callbacks remain outside this
 * snapshot, so DrawingCanvas interaction guards continue to fail closed while
 * the rendered evaluation is stale.
 */
export const useRevisionCoherentCanvasPresentation = ({
  current,
  compiledDocumentRevision,
  evaluationState
}: {
  current: CanvasRevisionPresentationInputs;
  compiledDocumentRevision: number;
  evaluationState?: EvaluationEngineState;
}) => {
  const lastStableRef = useRef<CanvasRevisionPresentationSnapshot | null>(null);
  const resolved = resolveRevisionCoherentCanvasPresentation({
    current,
    compiledDocumentRevision,
    evaluationState,
    lastStable: lastStableRef.current
  });

  useLayoutEffect(() => {
    if (!evaluationState) return;
    if (evaluationState.isStale || evaluationState.evaluationRevision !== compiledDocumentRevision) return;
    lastStableRef.current = {
      evaluationRevision: evaluationState.evaluationRevision,
      evaluationRequestRevision: evaluationState.evaluationRequestRevision,
      inputs: current
    };
  }, [compiledDocumentRevision, current, evaluationState]);

  return resolved;
};
'''
          Path("src/components/canvasRevisionPresentation.ts").write_text(helper)

          presentation_test = r'''import { describe, expect, it } from "vitest";
import type { EvaluationEngineState } from "../geometry/useEvaluationEngine";
import type { CadElement, DocumentPalette, VisibilityProfile } from "../types/geometry";
import {
  resolveRevisionCoherentCanvasPresentation,
  type CanvasRevisionPresentationInputs,
  type CanvasRevisionPresentationSnapshot
} from "./canvasRevisionPresentation";

const point = (id: string, name: string, x: number): CadElement => ({
  id,
  name,
  type: "freePoint",
  activity: "visible",
  x,
  y: 0
});

const inputs = (id: string): CanvasRevisionPresentationInputs => ({
  elements: [point(id, id.toUpperCase(), id === "old" ? 0 : 10)],
  canonicalElements: [point(id, id.toUpperCase(), id === "old" ? 0 : 10)],
  evaluationLimitIndex: undefined,
  palette: { colors: [], defaultColorId: "" } as DocumentPalette,
  visibilityProfiles: [] as VisibilityProfile[],
  activeVisibilityProfileId: null,
  moduleSemanticContext: {}
});

const evaluationState = (
  revision: number,
  requestRevision: number,
  isStale: boolean
): EvaluationEngineState => ({
  evaluation: {
    computedGeometry: new Map(),
    evaluationErrors: new Map()
  } as EvaluationEngineState["evaluation"],
  evaluationRevision: revision,
  evaluationRequestRevision: requestRevision,
  mode: "rust",
  source: "rust",
  status: isStale ? "evaluating" : "ready",
  rustEligible: true,
  isStale,
  error: null
});

describe("revision-coherent Canvas presentation", () => {
  it("keeps the previous full document inputs while that evaluation is stale", () => {
    const oldInputs = inputs("old");
    const currentInputs = inputs("new");
    const stable: CanvasRevisionPresentationSnapshot = {
      evaluationRevision: 7,
      evaluationRequestRevision: 41,
      inputs: oldInputs
    };

    const resolved = resolveRevisionCoherentCanvasPresentation({
      current: currentInputs,
      compiledDocumentRevision: 8,
      evaluationState: evaluationState(7, 41, true),
      lastStable: stable
    });

    expect(resolved).toBe(oldInputs);
    expect(resolved.elements.map((element) => element.id)).toEqual(["old"]);
  });

  it("does not pair a stale preview request with a snapshot from another request", () => {
    const currentInputs = inputs("new");
    const stable: CanvasRevisionPresentationSnapshot = {
      evaluationRevision: 7,
      evaluationRequestRevision: 40,
      inputs: inputs("old")
    };

    const resolved = resolveRevisionCoherentCanvasPresentation({
      current: currentInputs,
      compiledDocumentRevision: 7,
      evaluationState: evaluationState(7, 41, true),
      lastStable: stable
    });

    expect(resolved).toBe(currentInputs);
  });

  it("promotes current document inputs atomically when the newer evaluation resolves", () => {
    const currentInputs = inputs("new");
    const stable: CanvasRevisionPresentationSnapshot = {
      evaluationRevision: 7,
      evaluationRequestRevision: 41,
      inputs: inputs("old")
    };

    const resolved = resolveRevisionCoherentCanvasPresentation({
      current: currentInputs,
      compiledDocumentRevision: 8,
      evaluationState: evaluationState(8, 42, false),
      lastStable: stable
    });

    expect(resolved).toBe(currentInputs);
    expect(resolved.elements.map((element) => element.id)).toEqual(["new"]);
  });
});
'''
          Path("src/components/canvasRevisionPresentation.test.ts").write_text(presentation_test)

          selection_test = r'''import { beforeEach, describe, expect, it } from "vitest";
import { dslFlatTextForElements } from "../dsl/dslDocumentTestUtils";
import type { CadElement } from "../types/geometry";
import { initialCadDocumentState, useCadDocumentStore } from "./cadDocumentStore";
import { initialCadUiState, useCadUiStore } from "./cadUiStore";

const pointA: CadElement = {
  id: "selection-a",
  name: "A",
  type: "freePoint",
  activity: "visible",
  x: 0,
  y: 0
};
const pointB: CadElement = {
  id: "selection-b",
  name: "B",
  type: "freePoint",
  activity: "visible",
  x: 60,
  y: 0
};

const validSource = dslFlatTextForElements([pointA, pointB]);
const bOnlySource = dslFlatTextForElements([pointB]);
const errorfulWithoutA = [
  bOnlySource,
  "line Temp = segment(",
  "  start: @B,",
  "  end: ",
  ")"
].join("\n");
const errorfulWithBoth = [
  validSource,
  "line Temp = segment(",
  "  start: @B,",
  "  end: ",
  ")"
].join("\n");

const selection = () => {
  const ui = useCadUiStore.getState();
  return {
    selectedElementId: ui.selectedElementId,
    selectedElementIds: ui.selectedElementIds,
    selectionAnchorElementId: ui.selectionAnchorElementId
  };
};

const selectA = () => useCadUiStore.getState().applySelection(
  useCadDocumentStore.getState().elements,
  {
    selectedElementId: "selection-a",
    selectedElementIds: ["selection-a"],
    selectionAnchorElementId: "selection-a"
  }
);

describe("editor selection stability across transient invalid source", () => {
  beforeEach(() => {
    useCadDocumentStore.setState(initialCadDocumentState());
    useCadUiStore.setState(initialCadUiState());
    useCadDocumentStore.getState().commitText(validSource, "test");
    selectA();
    expect(selection().selectedElementId).toBe("selection-a");
  });

  it("preserves the last stable selection when an errorful editor snapshot temporarily drops its element", () => {
    useCadDocumentStore.getState().commitText(errorfulWithoutA, "editor");

    expect(useCadDocumentStore.getState().diagnostics).toContainEqual(
      expect.objectContaining({ code: "missing-attribute-value", severity: "error" })
    );
    expect(useCadDocumentStore.getState().elements.some((element) => element.id === "selection-a")).toBe(false);
    expect(selection()).toEqual({
      selectedElementId: "selection-a",
      selectedElementIds: ["selection-a"],
      selectionAnchorElementId: "selection-a"
    });

    useCadDocumentStore.getState().commitText(validSource, "editor");
    expect(useCadDocumentStore.getState().diagnostics.filter((item) => item.severity === "error")).toEqual([]);
    expect(selection().selectedElementId).toBe("selection-a");
  });

  it("clears the preserved selection when the next error-free editor revision intentionally deletes it", () => {
    useCadDocumentStore.getState().commitText(errorfulWithoutA, "editor");
    expect(selection().selectedElementId).toBe("selection-a");

    useCadDocumentStore.getState().commitText(bOnlySource, "editor");
    expect(selection()).toEqual({
      selectedElementId: null,
      selectedElementIds: [],
      selectionAnchorElementId: null
    });
  });

  it.each(["hidden", "disabled"] as const)(
    "prunes the preserved selection when the final valid revision makes it %s",
    (activity) => {
      useCadDocumentStore.getState().commitText(errorfulWithoutA, "editor");
      expect(selection().selectedElementId).toBe("selection-a");

      useCadDocumentStore.getState().commitText(
        dslFlatTextForElements([{ ...pointA, activity }, pointB]),
        "editor"
      );
      expect(selection()).toEqual({
        selectedElementId: null,
        selectedElementIds: [],
        selectionAnchorElementId: null
      });
    }
  );

  it("keeps unrelated selected members while an error exists elsewhere", () => {
    useCadUiStore.getState().setSelectedElementIds(["selection-a", "selection-b"], "selection-a");
    useCadDocumentStore.getState().commitText(errorfulWithBoth, "editor");

    expect(selection()).toEqual({
      selectedElementId: "selection-a",
      selectedElementIds: ["selection-a", "selection-b"],
      selectionAnchorElementId: "selection-a"
    });
  });

  it("keeps replaceTextDocument as an authoritative reset path", () => {
    useCadDocumentStore.getState().commitText(errorfulWithoutA, "editor");
    expect(selection().selectedElementId).toBe("selection-a");

    useCadDocumentStore.getState().replaceTextDocument(bOnlySource, {
      currentFilePath: "/tmp/replaced.nui",
      dirtySinceSave: false
    });
    expect(selection()).toEqual({
      selectedElementId: null,
      selectedElementIds: [],
      selectionAnchorElementId: null
    });
  });
});
'''
          Path("src/state/cadDocumentStore.selectionStability.test.ts").write_text(selection_test)

          # Shared host wrappers pin only render-owned document fields. The current
          # compiledDocumentRevision and all callbacks stay live for interaction guards.
          for wrapper, import_anchor, module_anchor, theme_line in [
              (
                  "src/components/TauriDrawingCanvas.tsx",
                  'import { useModuleInstanceSelectionReconciliation } from "./useModuleInstanceSelectionReconciliation";\n',
                  '''    const moduleSemanticContext = useMemo(() => ({
      moduleMaterialization,
      moduleSemanticAnalysis,
