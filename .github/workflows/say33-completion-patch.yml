name: SAY-33 completion integration patch

on:
  push:
    branches:
      - sayosomi/say-33-nui4-typed-geometry-arrays-point-line-path
    paths:
      - .github/workflows/say33-completion-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sayosomi/say-33-nui4-typed-geometry-arrays-point-line-path
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integrate geometry array completion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          # Source completion context: keep ScalarType scalar-only and add a
          # dedicated geometry-array value lane.
          replace_exact(
              "src/dsl/dslCompletionContext.ts",
              'import { typedDeclarationInitializerCompletionContext } from "./dslTypedDeclarationCompletionContext";\n',
              'import { typedDeclarationInitializerCompletionContext } from "./dslTypedDeclarationCompletionContext";\nimport { geometryArrayDeclarationCompletionContextAt, type GeometryArrayCompletionContext } from "./dslGeometryArrayCompletionContext";\n'
          )
          replace_exact(
              "src/dsl/dslCompletionContext.ts",
              '  | { kind: "typedInitializer"; from: number; to: number; declaredType: ScalarType; positionContext: ScalarExpressionCompletionContext }\n',
              '  | { kind: "typedInitializer"; from: number; to: number; declaredType: ScalarType; positionContext: ScalarExpressionCompletionContext }\n  | ({ kind: "geometryArrayValue" } & GeometryArrayCompletionContext)\n'
          )
          replace_exact(
              "src/dsl/dslCompletionContext.ts",
              '''  const declaredTypeContext = declaredTypeCompletionContextAt(code, pos);\n  if (declaredTypeContext) return { kind: "declaredType", ...declaredTypeContext };\n\n  const typedDeclarationContext = typedDeclarationInitializerCompletionContext(code, pos);''',
              '''  const declaredTypeContext = declaredTypeCompletionContextAt(code, pos);\n  if (declaredTypeContext) return { kind: "declaredType", ...declaredTypeContext };\n\n  const geometryArrayContext = geometryArrayDeclarationCompletionContextAt(code, pos);\n  if (geometryArrayContext) return { kind: "geometryArrayValue", ...geometryArrayContext };\n\n  const typedDeclarationContext = typedDeclarationInitializerCompletionContext(code, pos);'''
          )

          # Declaration type completion is valid for arrays only on const.
          replace_exact(
              "src/dsl/dslDeclaredTypeCompletionContext.ts",
              '''export type DslDeclaredTypeCompletionContext = {\n  from: number;\n  to: number;\n};''',
              '''export type DslDeclaredTypeCompletionContext = {\n  from: number;\n  to: number;\n  bindingKind: "const" | "let";\n};'''
          )
          replace_exact(
              "src/dsl/dslDeclaredTypeCompletionContext.ts",
              '  return { from: start, to: pos };\n',
              '  return { from: start, to: pos, bindingKind: statement.bindingKind };\n'
          )
          replace_exact(
              "src/dsl/dslCompletionContext.ts",
              '  | { kind: "declaredType"; from: number; to: number }\n',
              '  | { kind: "declaredType"; from: number; to: number; bindingKind: "const" | "let" }\n'
          )

          # Host-neutral query delegates geometry-array value candidates to the
          # shared Module/source lexical candidate owner.
          replace_exact(
              "src/dsl/dslCompletionQuery.ts",
              '''  if (context.kind === "declaredType") return dslTypedDeclarationTypeNames.map((label) => ({ kind: "type" as const, label, identity: label }));''',
              '''  if (context.kind === "declaredType") {\n    const names = context.bindingKind === "const"\n      ? dslTypedDeclarationTypeNames\n      : dslTypedDeclarationTypeNames.filter((label) => !label.endsWith("[]"));\n    return names.map((label) => ({ kind: "type" as const, label, identity: label }));\n  }'''
          )
          replace_exact(
              "src/dsl/dslCompletionQuery.ts",
              '''  if (context.kind === "moduleCallee" || context.kind === "moduleArgumentLabel" || context.kind === "moduleArgumentValue" || context.kind === "moduleQualifiedMember" || context.kind === "moduleReference") {\n    return moduleCandidatesAt(context, input, position, semantic, compiled, exact, statementIndex, recovery);\n  }''',
              '''  if (context.kind === "moduleCallee" || context.kind === "moduleArgumentLabel" || context.kind === "moduleArgumentValue" || context.kind === "moduleQualifiedMember" || context.kind === "moduleReference" || context.kind === "geometryArrayValue") {\n    return moduleCandidatesAt(context, input, position, semantic, compiled, exact, statementIndex, recovery);\n  }'''
          )

          # Module/source candidate owner learns array values without widening
          # DslModuleParameterType or ScalarType.
          replace_exact(
              "src/dsl/moduleCompletionCandidates.ts",
              '''} from "./moduleGeometryInterfaces";\n''',
              '''} from "./moduleGeometryInterfaces";\nimport {\n  geometryArrayDeclarationCompletionContextAt,\n  geometryArrayValueCompletionContextAt,\n  type GeometryArrayCompletionContext\n} from "./dslGeometryArrayCompletionContext";\nimport { isGeometryArrayTypeAssignable, type GeometryArrayType } from "./geometryArrayTypes";\n'''
          )
          array_helpers = r'''
const geometryArrayTypeForSlot = (
  compiled: CompiledDslDocument,
  definitionStatementId: string,
  parameterIndex: number
): GeometryArrayType | null =>
  compiled.sourceLexicalNamespace?.geometryArraySemanticAnalysis?.moduleParametersBySlot
    .get(`${definitionStatementId}:${parameterIndex}`)?.type ?? null;

const geometryArrayReferenceCompletions = (
  compiled: CompiledDslDocument,
  statementIndex: number,
  expected: GeometryArrayType,
  request?: ModuleCompletionRequest
): ModuleCompletionCandidate[] => {
  const analysis = compiled.sourceLexicalNamespace?.geometryArraySemanticAnalysis;
  if (!analysis) return [];
  const result: ModuleCompletionCandidate[] = [];
  for (const name of bodyNames(compiled, statementIndex, request?.scopeId)) {
    const resolved = visibleLookup(compiled, statementIndex, name, request?.scopeId, request?.sourceOrderIndex);
    if (!resolved) continue;
    const { lookup } = resolved;
    if (lookup.kind === "parameter") {
      const actual = geometryArrayTypeForSlot(
        compiled,
        lookup.parameter.value.definitionStatementId,
        lookup.parameter.value.parameterIndex
      );
      if (
        isGeometryArrayTypeAssignable(actual, expected) &&
        optionalParameterIsAvailable(compiled, statementIndex, lookup.parameter.value, request)
      ) {
        result.push({
          kind: "binding",
          label: name,
          identity: `module-array-parameter:${lookup.parameter.value.definitionStatementId}:${lookup.parameter.value.parameterIndex}`
        });
      }
      continue;
    }
    if (lookup.kind !== "resolved" || lookup.declaration.kind !== "typedDeclaration") continue;
    const value = analysis.valuesByStatementIndex.get(lookup.declaration.statementIndex);
    if (value && isGeometryArrayTypeAssignable(value.type, expected)) {
      result.push({ kind: "binding", label: name, identity: value.statementId });
    }
  }
  return result;
};

const geometryArrayMemberCompletions = (
  compiled: CompiledDslDocument,
  statementIndex: number,
  expected: GeometryArrayType,
  request?: ModuleCompletionRequest
): ModuleCompletionCandidate[] =>
  expected.elementType === "point"
    ? geometryCompletions(compiled, statementIndex, "point", request)
    : geometryInterfaceCompletions(compiled, statementIndex, expected.elementType, request);

const geometryArrayCandidates = (
  compiled: CompiledDslDocument,
  statementIndex: number,
  context: GeometryArrayCompletionContext,
  request?: ModuleCompletionRequest
) => context.mode === "member"
  ? geometryArrayMemberCompletions(compiled, statementIndex, context.expectedType, request)
  : geometryArrayReferenceCompletions(compiled, statementIndex, context.expectedType, request);

'''
          replace_exact(
              "src/dsl/moduleCompletionCandidates.ts",
              'const moduleCalleeCompletions = (compiled: CompiledDslDocument, statementIndex: number, request: ModuleCompletionRequest): ModuleCompletionCandidate[] => {\n',
              array_helpers + 'const moduleCalleeCompletions = (compiled: CompiledDslDocument, statementIndex: number, request: ModuleCompletionRequest): ModuleCompletionCandidate[] => {\n'
          )

          old_parameter_type = r'''const moduleArgumentParameterType = (
  compiled: CompiledDslDocument,
  statementIndex: number,
  argumentIndex: number,
  request: ModuleCompletionRequest
): DslModuleParameterType | null => {
  const instance = currentInstance(compiled, statementIndex);
  const definition = instance?.callee && compiled.moduleSemanticAnalysis?.definitionsByStatementId.get(instance.callee.definitionStatementId);
  if (!definition) return null;
  const liveArgument = liveArguments(request)?.[argumentIndex];
  if (request.currentDefinitionParameters) {
    const parameter = liveArgument?.key
      ? request.currentDefinitionParameters.find((candidate) => candidate.name === liveArgument.key)
      : request.currentDefinitionParameters[argumentIndex];
    return parameter?.type ?? null;
  }
  const binding = instance?.parameterBindings.find((candidate) => candidate.argumentIndex === argumentIndex);
  const parameter = liveArgument?.key
    ? definition.parameters.find((candidate) => candidate.name === liveArgument.key)
    : binding && definition.parameters[binding.parameterIndex];
  return parameter?.type ?? binding?.parameterType ?? null;
};
'''
          new_parameter_type = r'''type ModuleArgumentParameterSlot = {
  definitionStatementId: string;
  parameterIndex: number;
  type: DslModuleParameterType | null;
};

const moduleArgumentParameterSlot = (
  compiled: CompiledDslDocument,
  statementIndex: number,
  argumentIndex: number,
  request: ModuleCompletionRequest
): ModuleArgumentParameterSlot | null => {
  const instance = currentInstance(compiled, statementIndex);
  const definition = instance?.callee && compiled.moduleSemanticAnalysis?.definitionsByStatementId.get(instance.callee.definitionStatementId);
  if (!definition) return null;
  const liveArgument = liveArguments(request)?.[argumentIndex];
  if (request.currentDefinitionParameters) {
    const parameter = liveArgument?.key
      ? request.currentDefinitionParameters.find((candidate) => candidate.name === liveArgument.key)
      : request.currentDefinitionParameters[argumentIndex];
    return parameter
      ? {
          definitionStatementId: parameter.definitionStatementId,
          parameterIndex: parameter.parameterIndex,
          type: parameter.type
        }
      : null;
  }
  const binding = instance?.parameterBindings.find((candidate) => candidate.argumentIndex === argumentIndex);
  const parameter = liveArgument?.key
    ? definition.parameters.find((candidate) => candidate.name === liveArgument.key)
    : binding && definition.parameters[binding.parameterIndex];
  if (parameter) {
    return {
      definitionStatementId: parameter.definitionStatementId,
      parameterIndex: parameter.parameterIndex,
      type: parameter.type
    };
  }
  return binding
    ? {
        definitionStatementId: definition.statementId,
        parameterIndex: binding.parameterIndex,
        type: binding.parameterType
      }
    : null;
};

const moduleArgumentParameterType = (
  compiled: CompiledDslDocument,
  statementIndex: number,
  argumentIndex: number,
  request: ModuleCompletionRequest
): DslModuleParameterType | null =>
  moduleArgumentParameterSlot(compiled, statementIndex, argumentIndex, request)?.type ?? null;

const moduleArgumentGeometryArrayContext = (
  compiled: CompiledDslDocument,
  statementIndex: number,
  argumentIndex: number,
  request: ModuleCompletionRequest
): GeometryArrayCompletionContext | null => {
  const slot = moduleArgumentParameterSlot(compiled, statementIndex, argumentIndex, request);
  const expectedType = slot
    ? geometryArrayTypeForSlot(compiled, slot.definitionStatementId, slot.parameterIndex)
    : null;
  if (!expectedType || !request.liveStatementText || request.logicalCursorPosition === undefined) return null;
  const liveArgument = liveArguments(request)?.[argumentIndex];
  const valueSpan = liveArgument
    ? liveArgument.valueSpan.start === liveArgument.valueSpan.end && liveArgument.rawValueSpan
      ? liveArgument.rawValueSpan
      : liveArgument.valueSpan
    : request.argumentValueSpan;
  if (!valueSpan) return null;
  return geometryArrayValueCompletionContextAt(
    request.liveStatementText,
    request.logicalCursorPosition,
    { start: valueSpan.start, end: Math.max(valueSpan.end, request.logicalCursorPosition) },
    expectedType
  );
};

const geometryArrayContextForRequest = (
  compiled: CompiledDslDocument,
  statementIndex: number,
  request: ModuleCompletionRequest
): GeometryArrayCompletionContext | null => {
  if (request.liveStatementText && request.logicalCursorPosition !== undefined) {
    const declaration = geometryArrayDeclarationCompletionContextAt(
      request.liveStatementText,
      request.logicalCursorPosition
    );
    if (declaration) return declaration;
  }
  return request.argumentIndex !== undefined
    ? moduleArgumentGeometryArrayContext(compiled, statementIndex, request.argumentIndex, request)
    : null;
};
'''
          replace_exact("src/dsl/moduleCompletionCandidates.ts", old_parameter_type, new_parameter_type)

          replace_exact(
              "src/dsl/moduleCompletionCandidates.ts",
              '''const moduleArgumentValues = (compiled: CompiledDslDocument, statementIndex: number, argumentIndex: number, request: ModuleCompletionRequest): ModuleCompletionCandidate[] => {\n  const parameterType = moduleArgumentParameterType(compiled, statementIndex, argumentIndex, request);''',
              '''const moduleArgumentValues = (compiled: CompiledDslDocument, statementIndex: number, argumentIndex: number, request: ModuleCompletionRequest): ModuleCompletionCandidate[] => {\n  const arrayContext = moduleArgumentGeometryArrayContext(compiled, statementIndex, argumentIndex, request);\n  if (arrayContext) return geometryArrayCandidates(compiled, statementIndex, arrayContext, request);\n  const parameterType = moduleArgumentParameterType(compiled, statementIndex, argumentIndex, request);'''
          )

          qualified_helpers = r'''
const qualifiedGeometryArrayMemberCompletions = (
  compiled: CompiledDslDocument,
  definition: ModuleDefinitionSemantic,
  expected: GeometryArrayType
): ModuleCompletionCandidate[] => {
  const result: ModuleCompletionCandidate[] = [];
  for (const entry of definition.exports) {
    if (entry.kind !== "geometry") continue;
    const actual = moduleGeometryInterfaceTypeOfElement(compiled.statements[entry.exportedStatementIndex]);
    if (expected.elementType === "point") {
      if (actual === "point") result.push({ kind: "geometry", label: entry.name, identity: entry.name });
      else if (actual === "line" || actual === "path") {
        result.push(
          { kind: "geometry", label: `${entry.name}.start`, identity: `${entry.name}:start` },
          { kind: "geometry", label: `${entry.name}.end`, identity: `${entry.name}:end` }
        );
      }
      continue;
    }
    if (isModuleGeometryInterfaceAssignable(actual, expected.elementType)) {
      result.push({ kind: "geometry", label: entry.name, identity: entry.name });
    }
  }
  return result;
};

const qualifiedGeometryArrayReferenceCompletions = (
  compiled: CompiledDslDocument,
  definition: ModuleDefinitionSemantic,
  expected: GeometryArrayType
): ModuleCompletionCandidate[] =>
  (compiled.sourceLexicalNamespace?.geometryArraySemanticAnalysis?.values ?? [])
    .filter((value) => value.ownerModuleDefinitionStatementIndex === definition.statementIndex && value.exported)
    .filter((value) => isGeometryArrayTypeAssignable(value.type, expected))
    .map((value) => ({ kind: "binding" as const, label: value.name, identity: value.statementId }));

'''
          replace_exact(
              "src/dsl/moduleCompletionCandidates.ts",
              'const qualifiedMemberCompletions = (compiled: CompiledDslDocument, statementIndex: number, request: ModuleCompletionRequest): ModuleCompletionCandidate[] => {\n',
              qualified_helpers + 'const qualifiedMemberCompletions = (compiled: CompiledDslDocument, statementIndex: number, request: ModuleCompletionRequest): ModuleCompletionCandidate[] => {\n'
          )
          replace_exact(
              "src/dsl/moduleCompletionCandidates.ts",
              '''  const definition = instance?.callee && analysis.definitionsByStatementId.get(instance.callee.definitionStatementId);\n  if (!definition) return [];\n  if (request.argumentIndex !== undefined) {''',
              '''  const definition = instance?.callee && analysis.definitionsByStatementId.get(instance.callee.definitionStatementId);\n  if (!definition) return [];\n  const arrayContext = geometryArrayContextForRequest(compiled, statementIndex, request);\n  if (arrayContext) {\n    return arrayContext.mode === "member"\n      ? qualifiedGeometryArrayMemberCompletions(compiled, definition, arrayContext.expectedType)\n      : qualifiedGeometryArrayReferenceCompletions(compiled, definition, arrayContext.expectedType);\n  }\n  if (request.argumentIndex !== undefined) {'''
          )
          replace_exact(
              "src/dsl/moduleCompletionCandidates.ts",
              '''  if (request.kind === "callee") return moduleCalleeCompletions(request.compiled, statementIndex, request);\n  if (request.kind === "label") return moduleArgumentLabels(request.compiled, statementIndex, request);\n  if (!request.compiled.moduleSemanticAnalysis) return [];\n  if (request.kind === "value") return moduleArgumentValues(request.compiled, statementIndex, request.argumentIndex ?? 0, request);''',
              '''  if (request.kind === "callee") return moduleCalleeCompletions(request.compiled, statementIndex, request);\n  if (request.kind === "label") return moduleArgumentLabels(request.compiled, statementIndex, request);\n  const declarationArrayContext = request.liveStatementText && request.logicalCursorPosition !== undefined\n    ? geometryArrayDeclarationCompletionContextAt(request.liveStatementText, request.logicalCursorPosition)\n    : null;\n  if (declarationArrayContext) return geometryArrayCandidates(request.compiled, statementIndex, declarationArrayContext, request);\n  if (!request.compiled.moduleSemanticAnalysis) return [];\n  if (request.kind === "value") return moduleArgumentValues(request.compiled, statementIndex, request.argumentIndex ?? 0, request);'''
          )

          # Keep Module inline-array replacement scoped to the current member.
          member_start_helper = r'''
const currentInlineListMemberStart = (source: string, valueStart: number, pos: number) => {
  let first = valueStart;
  while (first < pos && /\s/.test(source[first] ?? "")) first += 1;
  if (source[first] !== "[") return valueStart;
  let start = first + 1;
  let quote: string | null = null;
  let depth = 0;
  for (let index = first + 1; index < pos; index += 1) {
    const char = source[index];
    if (quote) {
      if (char === quote && source[index - 1] !== "\\") quote = null;
      continue;
    }
    if (char === '"' || char === "'") quote = char;
    else if (char === "(" || char === "[" || char === "{") depth += 1;
    else if (char === ")" || char === "]" || char === "}") depth = Math.max(0, depth - 1);
    else if (char === "," && depth === 0) start = index + 1;
  }
  while (start < pos && /\s/.test(source[start] ?? "")) start += 1;
  return start;
};

'''
          replace_exact(
              "src/dsl/dslModuleCompletionContext.ts",
              '/** Module calls use the ordinary module parser\'s spelling. This classifier is\n',
              member_start_helper + '/** Module calls use the ordinary module parser\'s spelling. This classifier is\n'
          )
          replace_exact(
              "src/dsl/dslModuleCompletionContext.ts",
              '''    const valueFrom = containing.valueSpan.start === containing.valueSpan.end ? pos : containing.valueSpan.start;\n    const qualifiedMember = qualifiedMemberContextAt(code, valueFrom, pos, scanned.indexOf(containing));\n    if (qualifiedMember) return qualifiedMember;\n    return { kind: "moduleArgumentValue", from: valueFrom, to: pos, argumentIndex: scanned.indexOf(containing) };''',
              '''    const valueFrom = containing.valueSpan.start === containing.valueSpan.end ? pos : containing.valueSpan.start;\n    const memberFrom = currentInlineListMemberStart(code, valueFrom, pos);\n    const qualifiedMember = qualifiedMemberContextAt(code, memberFrom, pos, scanned.indexOf(containing));\n    if (qualifiedMember) return qualifiedMember;\n    return { kind: "moduleArgumentValue", from: memberFrom, to: pos, argumentIndex: scanned.indexOf(containing) };'''
          )
          replace_exact(
              "src/dsl/dslModuleCompletionContext.ts",
              '''  return {\n    kind: "moduleArgumentValue",\n    from: valueStart,\n    to: pos,\n    argumentIndex: Math.max(0, scanned.length - 1)\n  };''',
              '''  return {\n    kind: "moduleArgumentValue",\n    from: currentInlineListMemberStart(code, valueStart, pos),\n    to: pos,\n    argumentIndex: Math.max(0, scanned.length - 1)\n  };'''
          )

          # CodeMirror adapter: geometry references use the same @ insertion
          # convention as other source references; qualified members stay bare.
          replace_exact(
              "src/editor/cmAutocomplete.ts",
              '''const asModuleCompletions = (candidates: readonly ModuleCompletionCandidate[], bareReferences = false): Completion[] =>\n  candidates.map((candidate) => {\n    if (candidate.kind === "binding") {\n      const label = bareReferences ? candidate.label : `@${candidate.label}`;\n      return { label, ...(bareReferences ? {} : { apply: label }), type: "constant" };\n    }''',
              '''const asModuleCompletions = (candidates: readonly ModuleCompletionCandidate[], bareReferences = false): Completion[] =>\n  candidates.map((candidate) => {\n    if (candidate.kind === "binding" || candidate.kind === "geometry") {\n      const label = bareReferences ? candidate.label : `@${candidate.label}`;\n      return { label, ...(bareReferences ? {} : { apply: label }), type: "constant" };\n    }'''
          )
          replace_exact(
              "src/editor/cmAutocomplete.ts",
              '    return { label: candidate.label, type: candidate.kind === "geometry" ? "constant" : "property" };\n',
              '    return { label: candidate.label, type: "property" };\n'
          )
          replace_exact(
              "src/editor/cmAutocomplete.ts",
              '''    if (candidate.kind === "argumentName") return { label: candidate.label, apply: `${candidate.label}: `, type: "property" };''',
              '''    if (candidate.kind === "geometry") {\n      const label = bareReferences ? candidate.label : `@${candidate.label}`;\n      return { label, ...(bareReferences ? {} : { apply: label }), type: "constant" };\n    }\n    if (candidate.kind === "argumentName") return { label: candidate.label, apply: `${candidate.label}: `, type: "property" };'''
          )
          replace_exact(
              "src/editor/cmAutocomplete.ts",
              '''    completionContext.kind === "templateHole"\n  )''',
              '''    completionContext.kind === "templateHole" ||\n    completionContext.kind === "geometryArrayValue"\n  )''',
              count=1
          )
          replace_exact(
              "src/editor/cmAutocomplete.ts",
              '''const declaredTypeCompletions = (): Completion[] => dslTypedDeclarationTypeNames.map((label) =>''',
              '''const declaredTypeCompletions = (allowGeometryArrays: boolean): Completion[] => dslTypedDeclarationTypeNames\n  .filter((label) => allowGeometryArrays || !label.endsWith("[]"))\n  .map((label) =>'''
          )
          replace_exact(
              "src/editor/cmAutocomplete.ts",
              '    completions = neutralQuery ? neutralCompletions : declaredTypeCompletions();\n',
              '    completions = neutralQuery ? neutralCompletions : declaredTypeCompletions(completionContext.bindingKind === "const");\n'
          )
          replace_exact(
              "src/editor/cmAutocomplete.ts",
              '''  } else if (completionContext.kind === "typedInitializer" || completionContext.kind === "conditionExpression") {''',
              '''  } else if (completionContext.kind === "geometryArrayValue") {\n    disablesCompletionFiltering = referenceToken?.startsWith("@") ?? false;\n    if (neutralQuery && neutralCompletions.length > 0 &&\n      (!semanticInput.semantic || neutralSemanticIsCurrent || neutralHasSourceCandidates)) {\n      completions = neutralCompletions;\n      usesNeutralQuery = true;\n    } else {\n      const metadata = options.moduleSemanticMetadata?.();\n      const site = moduleSiteAt(options, context.pos, "moduleBody");\n      completions = metadata\n        ? asModuleCompletions(moduleCompletionCandidates({\n            compiled: metadata,\n            cursorPosition: context.pos,\n            kind: "reference",\n            sourceText: input.source,\n            logicalCursorPosition: input.localPos,\n            liveStatementText: input.lineText,\n            ...(site ? {\n              statementIndex: site.statementIndex,\n              scopeId: site.scopeId,\n              sourceOrderIndex: site.sourceOrderIndex\n            } : {})\n          }))\n        : [];\n    }\n  } else if (completionContext.kind === "typedInitializer" || completionContext.kind === "conditionExpression") {'''
          )

          # Existing context tests now carry bindingKind, and explicitly cover
          # the const-only geometry-array type surface.
          replace_exact(
              "src/dsl/dslDeclaredTypeCompletionContext.test.ts",
              '    expect(declaredTypeCompletionContextAt(source, pos)).toEqual({ from: expectedFrom, to: pos });\n    expect(dslCompletionContextAt(source, pos)).toEqual({ kind: "declaredType", from: expectedFrom, to: pos });\n',
              '    expect(declaredTypeCompletionContextAt(source, pos)).toEqual({ from: expectedFrom, to: pos, bindingKind: "const" });\n    expect(dslCompletionContextAt(source, pos)).toEqual({ kind: "declaredType", from: expectedFrom, to: pos, bindingKind: "const" });\n'
          )

          # Dedicated host-neutral integration coverage.
          Path("src/dsl/geometryArrayCompletion.integration.test.ts").write_text(r'''import { describe, expect, it } from "vitest";
import { compileDslDocument } from "./dslDocument";
import { parseDslSnapshot } from "./dslParser";
import { queryDslCompletion } from "./dslCompletionQuery";

const revision = 33;

const compile = (source: string) => {
  const parsed = parseDslSnapshot({ normalizedSource: source, sourceRevision: revision });
  return compileDslDocument(source, {
    preparsed: parsed,
    assignedStatementIds: new Map(parsed.statements.map((_, index) => [index, `array-completion:${index}`]))
  });
};

const queryAt = (source: string, marker: string) => {
  const compiled = compile(source);
  const position = source.indexOf(marker) + marker.length;
  expect(position).toBeGreaterThanOrEqual(marker.length);
  return queryDslCompletion({
    source: { normalizedSource: source, sourceRevision: revision },
    position,
    semantic: { sourceRevision: revision, sourceText: source, compiled }
  });
};

const labels = (result: ReturnType<typeof queryDslCompletion>) => result?.candidates.map((candidate) => candidate.label) ?? [];

const geometryBase = [
  "nui 4",
  "point A = coordinate(x: 0, y: 0)",
  "point B = coordinate(x: 10, y: 0)",
  "line L = segment(start: @A, end: @B)",
  "arc Curve = arc(center: @A, radius: 10, start: 0, end: 90, direction: counterclockwise)"
];

describe("geometry array expected-type completion", () => {
  it("filters inline members by point/line/path interface", () => {
    const strict = [...geometryBase, "const strict: line[] = [@]"].join("\n");
    expect(labels(queryAt(strict, "[@"))).toContain("L");
    expect(labels(queryAt(strict, "[@"))).not.toContain("Curve");

    const paths = [...geometryBase, "const paths: path[] = [@]"].join("\n");
    expect(labels(queryAt(paths, "[@"))).toEqual(expect.arrayContaining(["L", "Curve"]));

    const points = [...geometryBase, "const points: point[] = [@]"].join("\n");
    expect(labels(queryAt(points, "[@"))).toEqual(expect.arrayContaining(["A", "B", "L.start", "L.end"]));
  });

  it("offers only assignable named arrays for a whole-array reference", () => {
    const source = [
      ...geometryBase,
      "const strict: line[] = [@L]",
      "const paths: path[] = [@Curve]",
      "const points: point[] = [@A]",
      "const copy: path[] = @"
    ].join("\n");
    const result = queryAt(source, "const copy: path[] = @");
    expect(labels(result)).toEqual(expect.arrayContaining(["strict", "paths"]));
    expect(labels(result)).not.toContain("points");
  });

  it("uses the Module parameter array type for inline and named arguments", () => {
    const named = [
      ...geometryBase,
      "const strict: line[] = [@L]",
      "const paths: path[] = [@Curve]",
      "module Use(paths: path[]) {",
      "}",
      "instance x = Use(paths: @)"
    ].join("\n");
    expect(labels(queryAt(named, "paths: @"))).toEqual(expect.arrayContaining(["strict", "paths"]));

    const inline = [
      ...geometryBase,
      "module Use(paths: path[]) {",
      "}",
      "instance x = Use(paths: [@])"
    ].join("\n");
    const result = queryAt(inline, "paths: [@");
    expect(labels(result)).toEqual(expect.arrayContaining(["L", "Curve"]));
    expect(inline.slice(result!.replacementRange.from, result!.replacementRange.to)).toBe("@");
  });

  it("offers Module array parameters inside local array declarations", () => {
    const source = [
      "nui 4",
      "module Copy(paths: path[]) {",
      "  const local: path[] = @",
      "}",
    ].join("\n");
    expect(labels(queryAt(source, "const local: path[] = @"))).toContain("paths");
  });

  it("offers compatible exported arrays through a qualified instance reference", () => {
    const source = [
      "nui 4",
      "module Maker() {",
      "  point A = coordinate(x: 0, y: 0)",
      "  point B = coordinate(x: 10, y: 0)",
      "  line L = segment(start: @A, end: @B)",
      "  export const edges: line[] = [@L]",
      "}",
      "instance made = Maker()",
      "const copy: path[] = @made::"
    ].join("\n");
    expect(labels(queryAt(source, "@made::"))).toContain("edges");
  });

  it("does not advertise immutable geometry-array types on let declarations", () => {
    const constSource = "const value: pa";
    expect(labels(queryAt(constSource, "pa"))).toEqual(expect.arrayContaining(["point[]", "path[]"]));

    const letSource = "let value: pa";
    expect(labels(queryAt(letSource, "pa"))).not.toEqual(expect.arrayContaining(["point[]"]));
    expect(labels(queryAt(letSource, "pa"))).not.toContain("point[]");
    expect(labels(queryAt(letSource, "pa"))).not.toContain("line[]");
    expect(labels(queryAt(letSource, "pa"))).not.toContain("path[]");
  });
});
