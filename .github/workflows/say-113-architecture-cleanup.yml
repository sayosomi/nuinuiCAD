name: SAY-113 architecture cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sayosomi/say-113-runtime-inspection-geometry-source-flow-metadata
          fetch-depth: 0
      - name: Fix architecture section placement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("ARCHITECTURE.md")
          text = path.read_text()
          old = "### TypeScript evaluation\n\n### Runtime geometry source-flow inspection\n\n"
          new = "### TypeScript evaluation\n\n"
          if text.count(old) != 1:
              raise SystemExit("expected one misplaced runtime source-flow heading")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git rm .github/workflows/say-113-architecture-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: keep source flow under TypeScript evaluation"
          git push origin HEAD:sayosomi/say-113-runtime-inspection-geometry-source-flow-metadata
