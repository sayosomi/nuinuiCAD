name: SAY-33 completion patch trigger

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'sayosomi' && github.head_ref == 'sayosomi/say-33-nui4-typed-geometry-arrays-point-line-path'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sayosomi/say-33-nui4-typed-geometry-arrays-point-line-path
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Extract and apply reviewed SAY-33 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/say33-completion-patch.yml').read_text()
          match = re.search(r"(?ms)^\s{10}python3 <<'PY'\n(?P<body>.*?)^\s{10}PY\s*$", source)
          if not match:
              raise SystemExit('could not extract embedded SAY-33 patch script')
          Path('/tmp/say33_completion_patch.py').write_text(textwrap.dedent(match.group('body')))
          PY
          python3 /tmp/say33_completion_patch.py
      - name: Focused completion verification
        run: >-
          npx vitest run
          src/dsl/dslDeclaredTypeCompletionContext.test.ts
          src/dsl/dslCompletionQuery.test.ts
          src/editor/cmAutocomplete.test.ts
          src/dsl/geometryArrayLanguageQueries.integration.test.ts
      - run: npm run build
      - run: npm run lint
      - name: Commit successful patch
        shell: bash
        run: |
          rm .github/workflows/say33-completion-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'patch produced no changes'; exit 1; }
          git commit -m "feat(SAY-33): integrate geometry array completion"
          git push origin HEAD:sayosomi/say-33-nui4-typed-geometry-arrays-point-line-path
