name: SAY-113 direct implementation

on:
  push:
    branches:
      - sayosomi/say-113-runtime-inspection-geometry-source-flow-metadata

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sayosomi/say-113-runtime-inspection-geometry-source-flow-metadata
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Shared runtime result type.
          replace_once(
              "src/types/geometry.ts",
              '''export type ForGroupGeneratedRow = {\n  forGroupId: ElementId;\n  templateElementId: ElementId;\n  generatedElementId: ElementId;\n  iterationIndex: number;\n  variableName: string;\n  variableValue: number;\n  elementName: string;\n  elementType: CadElementType;\n};\n\nexport type EvaluationResult = {''',
              '''export type ForGroupGeneratedRow = {\n  forGroupId: ElementId;\n  templateElementId: ElementId;\n  generatedElementId: ElementId;\n  iterationIndex: number;\n  variableName: string;\n  variableValue: number;\n  elementName: string;\n  elementType: CadElementType;\n};\n\n/** A successful source-semantic in-place geometry mutation, in runtime execution order. */\nexport type GeometryMutationExecution = {\n  mutationElementId: ElementId;\n  targetElementIds: ElementId[];\n};\n\nexport type EvaluationResult = {'''
          )
          replace_once(
              "src/types/geometry.ts",
              '''  /** Every successfully evaluated declaration, captured before later mutations. */\n  preMutationGeometry?: Map<ElementId, ComputedGeometry>;\n  /** Concrete module-instance geometry captured at materialization end. */''',
              '''  /** Every successfully evaluated declaration, captured before later mutations. */\n  preMutationGeometry?: Map<ElementId, ComputedGeometry>;\n  /** Successful in-place geometry mutations, preserving actual runtime execution order. */\n  geometryMutationExecutions?: GeometryMutationExecution[];\n  /** Concrete module-instance geometry captured at materialization end. */'''
          )

          # TypeScript reference evaluator: record only mutations that executed without an evaluation error.
          replace_once(
              "src/geometry/evaluate.ts",
              '''  EvaluationWarning,\n  ForGroupGeneratedRow\n} from "../types/geometry";''',
              '''  EvaluationWarning,\n  ForGroupGeneratedRow,\n  GeometryMutationExecution\n} from "../types/geometry";'''
          )
          replace_once(
              "src/geometry/evaluate.ts",
              '''};\n\nexport const evaluateElements = (\n  elements: CadElement[],''',
              '''};\n\nconst geometryMutationTargetIds = (element: CadElement): ElementId[] => {\n  const targetIds = (() => {\n    switch (element.type) {\n      case "edge":\n        return [element.endpoint1.lineId, element.endpoint2.lineId];\n      case "extendTrim":\n        return [element.endpoint.lineId];\n      case "pathReverse":\n        return [element.targetLineId];\n      case "move":\n      case "symmetricMove":\n        return element.baseLineIds;\n      default:\n        return [];\n    }\n  })();\n  return Array.from(new Set(targetIds));\n};\n\nexport const evaluateElements = (\n  elements: CadElement[],'''
          )
          replace_once(
              "src/geometry/evaluate.ts",
              '''  const preMutationGeometry = new Map<ElementId, ComputedGeometry>();\n  const instanceBaseGeometry = new Map<ElementId, ComputedGeometry[]>();''',
              '''  const preMutationGeometry = new Map<ElementId, ComputedGeometry>();\n  const geometryMutationExecutions: GeometryMutationExecution[] = [];\n  const instanceBaseGeometry = new Map<ElementId, ComputedGeometry[]>();'''
          )
          replace_once(
              "src/geometry/evaluate.ts",
              '''    evaluateElement(elementToEvaluate, {\n      computedGeometry,''',
              '''    const mutationTargetIds = geometryMutationTargetIds(elementToEvaluate);\n    const errorCountBeforeElementEvaluation = errors.length;\n    evaluateElement(elementToEvaluate, {\n      computedGeometry,'''
          )
          replace_once(
              "src/geometry/evaluate.ts",
              '''    });\n    if (!preMutationGeometry.has(elementToEvaluate.id)) {\n      const geometry = computedGeometry.get(elementToEvaluate.id);''',
              '''    });\n    if (mutationTargetIds.length > 0 && errors.length === errorCountBeforeElementEvaluation) {\n      geometryMutationExecutions.push({\n        mutationElementId: elementToEvaluate.id,\n        targetElementIds: mutationTargetIds\n      });\n    }\n    if (!preMutationGeometry.has(elementToEvaluate.id)) {\n      const geometry = computedGeometry.get(elementToEvaluate.id);'''
          )
          replace_once(
              "src/geometry/evaluate.ts",
              '''    preMutationGeometry,\n    instanceBaseGeometry,''',
              '''    preMutationGeometry,\n    geometryMutationExecutions,\n    instanceBaseGeometry,'''
          )

          # JSON payload parity / Rust bridge.
          replace_once(
              "src/geometry/evaluationPayload.ts",
              '''  EvaluationWarning,\n  ForGroupGeneratedRow\n} from "../types/geometry";''',
              '''  EvaluationWarning,\n  ForGroupGeneratedRow,\n  GeometryMutationExecution\n} from "../types/geometry";'''
          )
          replace_once(
              "src/geometry/evaluationPayload.ts",
              '''  preMutationGeometry?: ComputedGeometry[];\n  instanceBaseGeometry?: Array<{ instanceId: ElementId; geometry: ComputedGeometry[] }>;''',
              '''  preMutationGeometry?: ComputedGeometry[];\n  geometryMutationExecutions?: GeometryMutationExecution[];\n  instanceBaseGeometry?: Array<{ instanceId: ElementId; geometry: ComputedGeometry[] }>;'''
          )
          replace_once(
              "src/geometry/evaluationPayload.ts",
              '''  preMutationGeometry: result.preMutationGeometry?.size\n    ? Array.from(result.preMutationGeometry.values())\n    : undefined,\n  instanceBaseGeometry:''',
              '''  preMutationGeometry: result.preMutationGeometry?.size\n    ? Array.from(result.preMutationGeometry.values())\n    : undefined,\n  geometryMutationExecutions: result.geometryMutationExecutions?.length\n    ? result.geometryMutationExecutions\n    : undefined,\n  instanceBaseGeometry:'''
          )
          replace_once(
              "src/geometry/evaluationPayload.ts",
              '''  preMutationGeometry: new Map(\n    (payload.preMutationGeometry ?? []).map((geometry) => [geometry.elementId, geometry])\n  ),\n  instanceBaseGeometry:''',
              '''  preMutationGeometry: new Map(\n    (payload.preMutationGeometry ?? []).map((geometry) => [geometry.elementId, geometry])\n  ),\n  geometryMutationExecutions: payload.geometryMutationExecutions ?? [],\n  instanceBaseGeometry:'''
          )

          # Rust result state/payload.
          replace_once(
              "src-tauri/src/evaluation/types.rs",
              '''#[derive(Debug, Serialize)]\n#[serde(rename_all = "camelCase")]\npub(crate) struct EffectiveDrawingModifierStroke {''',
              '''#[derive(Debug, Clone, Serialize)]\n#[serde(rename_all = "camelCase")]\npub(crate) struct GeometryMutationExecution {\n    pub(crate) mutation_element_id: ElementId,\n    pub(crate) target_element_ids: Vec<ElementId>,\n}\n\n#[derive(Debug, Serialize)]\n#[serde(rename_all = "camelCase")]\npub(crate) struct EffectiveDrawingModifierStroke {'''
          )
          replace_once(
              "src-tauri/src/evaluation/types.rs",
              '''    #[serde(skip_serializing_if = "Vec::is_empty")]\n    pub(crate) pre_mutation_geometry: Vec<Value>,\n    #[serde(skip_serializing_if = "Vec::is_empty")]\n    pub(crate) instance_base_geometry: Vec<Value>,''',
              '''    #[serde(skip_serializing_if = "Vec::is_empty")]\n    pub(crate) pre_mutation_geometry: Vec<Value>,\n    #[serde(skip_serializing_if = "Vec::is_empty")]\n    pub(crate) geometry_mutation_executions: Vec<GeometryMutationExecution>,\n    #[serde(skip_serializing_if = "Vec::is_empty")]\n    pub(crate) instance_base_geometry: Vec<Value>,'''
          )
          replace_once(
              "src-tauri/src/evaluation/types.rs",
              '''    pub(crate) pre_mutation_geometry: HashMap<ElementId, Value>,\n    pub(crate) instance_base_geometry: HashMap<ElementId, Vec<Value>>,''',
              '''    pub(crate) pre_mutation_geometry: HashMap<ElementId, Value>,\n    pub(crate) geometry_mutation_executions: Vec<GeometryMutationExecution>,\n    pub(crate) instance_base_geometry: HashMap<ElementId, Vec<Value>>,'''
          )

          replace_once(
              "src-tauri/src/evaluation/mod.rs",
              '''    EvaluationState,\n};''',
              '''    EvaluationState, GeometryMutationExecution,\n};'''
          )
          replace_once(
              "src-tauri/src/evaluation/mod.rs",
              '''fn evaluate_element_by_type(\n    id: ElementId,''',
              '''fn geometry_mutation_target_ids(element: &Value) -> Vec<ElementId> {\n    let endpoint_line_id = |key: &str| {\n        element\n            .get(key)\n            .and_then(|endpoint| endpoint.get("lineId"))\n            .and_then(Value::as_str)\n            .map(ToOwned::to_owned)\n    };\n    let mut target_ids = match element_type(element) {\n        Some("edge") => [endpoint_line_id("endpoint1"), endpoint_line_id("endpoint2")]\n            .into_iter()\n            .flatten()\n            .collect::<Vec<_>>(),\n        Some("extendTrim") => endpoint_line_id("endpoint").into_iter().collect(),\n        Some("pathReverse") => element\n            .get("targetLineId")\n            .and_then(Value::as_str)\n            .map(ToOwned::to_owned)\n            .into_iter()\n            .collect(),\n        Some("move" | "symmetricMove") => element\n            .get("baseLineIds")\n            .and_then(Value::as_array)\n            .into_iter()\n            .flatten()\n            .filter_map(Value::as_str)\n            .map(ToOwned::to_owned)\n            .collect(),\n        _ => Vec::new(),\n    };\n    let mut seen = HashSet::new();\n    target_ids.retain(|target_id| seen.insert(target_id.clone()));\n    target_ids\n}\n\nfn evaluate_element_by_type(\n    id: ElementId,'''
          )
          replace_once(
              "src-tauri/src/evaluation/mod.rs",
              '''    let capture_id = id.clone();\n    match element_type(&element) {''',
              '''    let capture_id = id.clone();\n    let mutation_target_ids = geometry_mutation_target_ids(&element);\n    let error_count_before_element_evaluation = state.errors.len();\n    match element_type(&element) {'''
          )
          replace_once(
              "src-tauri/src/evaluation/mod.rs",
              '''        _ => {}\n    }\n    if !state.pre_mutation_geometry.contains_key(&capture_id) {''',
              '''        _ => {}\n    }\n    if !mutation_target_ids.is_empty()\n        && state.errors.len() == error_count_before_element_evaluation\n    {\n        state\n            .geometry_mutation_executions\n            .push(GeometryMutationExecution {\n                mutation_element_id: capture_id.clone(),\n                target_element_ids: mutation_target_ids,\n            });\n    }\n    if !state.pre_mutation_geometry.contains_key(&capture_id) {'''
          )
          replace_once(
              "src-tauri/src/evaluation/mod.rs",
              '''        pre_mutation_geometry: HashMap::new(),\n        instance_base_geometry: HashMap::new(),''',
              '''        pre_mutation_geometry: HashMap::new(),\n        geometry_mutation_executions: Vec::new(),\n        instance_base_geometry: HashMap::new(),'''
          )
          replace_once(
              "src-tauri/src/evaluation/mod.rs",
              '''        instance_base_geometry: instance_snapshots\n            .iter()''',
              '''        geometry_mutation_executions: state.geometry_mutation_executions,\n        instance_base_geometry: instance_snapshots\n            .iter()'''
          )

          # Host-neutral source/runtime join. It deliberately reuses sourceOwnership and generated-row mapping.
          Path("src/geometry/geometrySourceFlow.ts").write_text('''import type { StatementIdentity } from "../document/statementIdentity";\nimport type { CompiledDslDocument } from "../dsl/dslDocument";\nimport type { DslPhysicalSpan } from "../dsl/logicalStatementSourceMap";\nimport { sourceOwnerForRuntimeElementId, type SourceOwner } from "../dsl/sourceOwnership";\nimport type { CadElementType, ElementId, EvaluationResult } from "../types/geometry";\n\nexport type GeometrySourceFlowStep = {\n  kind: "construction" | "mutation";\n  /** Canonical source-semantic construction/mutation name (`segment`, `move`, `reverse`, ...). */\n  operation: string;\n  elementType: CadElementType;\n  /** Runtime occurrence that executed this source operation. */\n  runtimeOperationElementId: ElementId;\n  /** Reconciler/source-ownership identity of the authoritative authored statement. */\n  sourceStatementId: StatementIdentity;\n  sourceStatementIndex: number;\n  /** Exact current-revision authored statement span. */\n  sourceSpan: DslPhysicalSpan;\n};\n\nexport type GeometrySourceFlow = {\n  runtimeElementId: ElementId;\n  steps: readonly GeometrySourceFlowStep[];\n};\n\ntype SourceOperation = {\n  owner: SourceOwner;\n  step: GeometrySourceFlowStep;\n};\n\n/**\n * Joins exact-current runtime mutation facts to authoritative source ownership.\n * No source text search, runtime-id parsing, or geometry re-evaluation occurs here.\n */\nexport const buildGeometrySourceFlowByRuntimeElementId = (\n  compiledDocument: CompiledDslDocument,\n  evaluation: EvaluationResult\n): ReadonlyMap<ElementId, GeometrySourceFlow> => {\n  const statementMap = compiledDocument.statementMap;\n  if (!statementMap) return new Map();\n\n  const generatedTemplateByRuntimeElementId = new Map(\n    (evaluation.forGroupGeneratedRows ?? []).map((row) => [row.generatedElementId, row.templateElementId] as const)\n  );\n  const ownershipDocument = {\n    statementMap,\n    moduleMaterialization: compiledDocument.moduleMaterialization\n  };\n\n  const sourceOwner = (runtimeElementId: ElementId): SourceOwner | null => {\n    let currentId: ElementId | undefined = runtimeElementId;\n    const visited = new Set<ElementId>();\n    while (currentId && !visited.has(currentId)) {\n      visited.add(currentId);\n      const owner = sourceOwnerForRuntimeElementId(ownershipDocument, currentId);\n      if (owner) return owner;\n      currentId = generatedTemplateByRuntimeElementId.get(currentId);\n    }\n    return null;\n  };\n\n  const sourceOperation = (\n    runtimeOperationElementId: ElementId,\n    kind: GeometrySourceFlowStep["kind"]\n  ): SourceOperation | null => {\n    const owner = sourceOwner(runtimeOperationElementId);\n    if (!owner) return null;\n    const statement = compiledDocument.statements[owner.sourceStatementIndex];\n    if (!statement || statement.kind !== "element" || !statement.type) return null;\n    return {\n      owner,\n      step: {\n        kind,\n        operation: statement.construction,\n        elementType: statement.type,\n        runtimeOperationElementId,\n        sourceStatementId: owner.sourceStatementId,\n        sourceStatementIndex: owner.sourceStatementIndex,\n        sourceSpan: statement.physicalSpan\n      }\n    };\n  };\n\n  const mutableFlows = new Map<ElementId, GeometrySourceFlowStep[]>();\n  for (const runtimeElementId of evaluation.computedGeometry.keys()) {\n    const construction = sourceOperation(runtimeElementId, "construction");\n    if (!construction) continue;\n    mutableFlows.set(runtimeElementId, [construction.step]);\n  }\n\n  for (const mutation of evaluation.geometryMutationExecutions ?? []) {\n    const operation = sourceOperation(mutation.mutationElementId, "mutation");\n    if (!operation) continue;\n    for (const targetElementId of mutation.targetElementIds) {\n      mutableFlows.get(targetElementId)?.push(operation.step);\n    }\n  }\n\n  return new Map(\n    Array.from(mutableFlows, ([runtimeElementId, steps]) => [\n      runtimeElementId,\n      { runtimeElementId, steps: [...steps] }\n    ])\n  );\n};\n''')

          Path("src/geometry/geometrySourceFlow.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { compileDslDocument, type CompiledDslDocument } from "../dsl/dslDocument";\nimport { parseDsl } from "../dsl/dslParser";\nimport type { CadElement } from "../types/geometry";\nimport { evaluateElements } from "./evaluate";\nimport { buildGeometrySourceFlowByRuntimeElementId } from "./geometrySourceFlow";\nimport { buildEvaluationOptions } from "./productionEvaluationContext";\n\nconst compileWithIds = (source: string, prefix = "flow") => {\n  const parsed = parseDsl(source);\n  const compiled = compileDslDocument(source, {\n    preparsed: parsed,\n    assignedStatementIds: new Map(parsed.statements.map((_, index) => [index, `${prefix}:${index}`] as const))\n  });\n  expect(compiled.diagnostics.filter((diagnostic) => diagnostic.severity === "error")).toEqual([]);\n  expect(compiled.document).not.toBeNull();\n  expect(compiled.statementMap).not.toBeNull();\n  return compiled;\n};\n\nconst evaluateCompiled = (compiled: CompiledDslDocument) => {\n  if (!compiled.document) throw new Error("expected compiled document");\n  return evaluateElements(\n    compiled.document.elements,\n    buildEvaluationOptions({\n      compiledDocument: compiled,\n      evaluationLimitIndex: compiled.document.evaluationLimitIndex\n    })\n  );\n};\n\nconst named = (compiled: CompiledDslDocument, name: string) => {\n  const element = compiled.document?.elements.find((candidate) => candidate.name === name);\n  if (!element) throw new Error(`missing ${name}`);\n  return element;\n};\n\nconst point = (id: string, x: number, y: number): CadElement => ({\n  id, name: id, type: "freePoint", activity: "visible", x, y\n});\n\ndescribe("geometry source flow", () => {\n  it("emits a declaration-only construction step", () => {\n    const compiled = compileWithIds([\n      "nui 4",\n      "line AB = segment(start: (0, 0), end: (10, 0))"\n    ].join("\\n"));\n    const evaluation = evaluateCompiled(compiled);\n    const line = named(compiled, "AB");\n    const flow = buildGeometrySourceFlowByRuntimeElementId(compiled, evaluation).get(line.id);\n\n    expect(flow?.steps.map((step) => [step.kind, step.operation])).toEqual([["construction", "segment"]]);\n  });\n\n  it("preserves successful mutation execution order and exact authored spans", () => {\n    const compiled = compileWithIds([\n      "nui 4",\n      "line AB = segment(start: (0, 0), end: (10, 0))",\n      "reverse(target: @AB)",\n      "reverse(target: @AB)"\n    ].join("\\n"));\n    const evaluation = evaluateCompiled(compiled);\n    const line = named(compiled, "AB");\n    const flow = buildGeometrySourceFlowByRuntimeElementId(compiled, evaluation).get(line.id);\n    const reverseStatements = compiled.statements.filter(\n      (statement) => statement.kind === "element" && statement.construction === "reverse"\n    );\n\n    expect(evaluation.errors).toEqual([]);\n    expect(flow?.steps.map((step) => [step.kind, step.operation])).toEqual([\n      ["construction", "segment"],\n      ["mutation", "reverse"],\n      ["mutation", "reverse"]\n    ]);\n    expect(flow?.steps[1].sourceSpan).toEqual(reverseStatements[0]?.physicalSpan);\n    expect(flow?.steps[2].sourceSpan).toEqual(reverseStatements[1]?.physicalSpan);\n    expect(flow?.steps.every((step) => step.sourceStatementId.length > 0)).toBe(true);\n  });\n\n  it("does not turn ordinary geometry references into flow steps", () => {\n    const compiled = compileWithIds([\n      "nui 4",\n      "line Source = segment(start: (0, 0), end: (10, 0))",\n      "line Offset = offset(sources: [@Source], distance: 1, side: left, closed: false, suppressTrimWarnings: false)"\n    ].join("\\n"));\n    const evaluation = evaluateCompiled(compiled);\n    const flows = buildGeometrySourceFlowByRuntimeElementId(compiled, evaluation);\n\n    expect(flows.get(named(compiled, "Source").id)?.steps.map((step) => step.operation)).toEqual(["segment"]);\n    expect(flows.get(named(compiled, "Offset").id)?.steps.map((step) => step.operation)).toEqual(["offset"]);\n  });\n\n  it("excludes failed and disabled mutations from runtime facts", () => {\n    const failed = evaluateElements([{\n      id: "reverse", name: "", type: "pathReverse", activity: "visible", targetLineId: "missing"\n    }]);\n    const disabled = evaluateElements([\n      point("a", 0, 0),\n      point("b", 10, 0),\n      {\n        id: "line", name: "line", type: "line", activity: "visible",\n        startPoint: { mode: "reference", pointId: "a" },\n        endPoint: { mode: "reference", pointId: "b" }\n      },\n      { id: "reverse", name: "", type: "pathReverse", activity: "disabled", targetLineId: "line" }\n    ]);\n\n    expect(failed.geometryMutationExecutions).toEqual([]);\n    expect(disabled.geometryMutationExecutions).toEqual([]);\n  });\n\n  it("maps for-generated runtime geometry and mutation occurrences back to authored template steps", () => {\n    const compiled = compileWithIds([\n      "nui 4",\n      "point A = coordinate(x: 0, y: 0)",\n      "point B = coordinate(x: 10, y: 0)",\n      "for i in range(from: 0, count: 2, step: 1) {",\n      "  line AB = segment(start: @A, end: @B)",\n      "  reverse(target: @AB)",\n      "}"\n    ].join("\\n"));\n    const evaluation = evaluateCompiled(compiled);\n    const lineRows = (evaluation.forGroupGeneratedRows ?? []).filter((row) => row.elementType === "line");\n    const reverseRows = (evaluation.forGroupGeneratedRows ?? []).filter((row) => row.elementType === "pathReverse");\n    const flows = buildGeometrySourceFlowByRuntimeElementId(compiled, evaluation);\n\n    expect(lineRows).toHaveLength(2);\n    expect(reverseRows).toHaveLength(2);\n    for (const [index, row] of lineRows.entries()) {\n      const flow = flows.get(row.generatedElementId);\n      expect(flow?.steps.map((step) => step.operation)).toEqual(["segment", "reverse"]);\n      expect(flow?.steps[0].runtimeOperationElementId).toBe(row.generatedElementId);\n      expect(flow?.steps[1].runtimeOperationElementId).toBe(reverseRows[index]?.generatedElementId);\n    }\n  });\n\n  it("maps separate module runtime occurrences to the same authoritative authored operations", () => {\n    const compiled = compileWithIds([\n      "nui 4",\n      "module M() {",\n      "  export line L = segment(start: (0, 0), end: (10, 0))",\n      "  reverse(target: @L)",\n      "}",\n      "instance First = M()",\n      "instance Second = M()"\n    ].join("\\n"), "module-flow");\n    const evaluation = evaluateCompiled(compiled);\n    const lines = compiled.document!.elements.filter((element) => element.name === "L");\n    const flows = buildGeometrySourceFlowByRuntimeElementId(compiled, evaluation);\n\n    expect(lines).toHaveLength(2);\n    const first = flows.get(lines[0].id);\n    const second = flows.get(lines[1].id);\n    expect(first?.steps.map((step) => step.operation)).toEqual(["segment", "reverse"]);\n    expect(second?.steps.map((step) => step.operation)).toEqual(["segment", "reverse"]);\n    expect(first?.steps.map((step) => step.sourceStatementId)).toEqual(\n      second?.steps.map((step) => step.sourceStatementId)\n    );\n    expect(first?.steps.map((step) => step.runtimeOperationElementId)).not.toEqual(\n      second?.steps.map((step) => step.runtimeOperationElementId)\n    );\n  });\n});\n''')

          # Payload round-trip assertion.
          replace_once(
              "src/geometry/evaluationPayload.test.ts",
              '''    expect(roundTrip.preMutationGeometry).toEqual(evaluation.preMutationGeometry);\n    expect(roundTrip.errors).toEqual(evaluation.errors);''',
              '''    expect(roundTrip.preMutationGeometry).toEqual(evaluation.preMutationGeometry);\n    expect(roundTrip.geometryMutationExecutions).toEqual(evaluation.geometryMutationExecutions);\n    expect(roundTrip.errors).toEqual(evaluation.errors);'''
          )
          replace_once(
              "src/geometry/evaluationPayload.test.ts",
              '''  it("omits an empty effective stroke map from the JSON payload", () => {''',
              '''  it("round-trips ordered successful geometry mutation executions", () => {\n    const evaluation = evaluateElements([\n      { id: "a", name: "A", type: "freePoint", activity: "visible", x: 0, y: 0 },\n      { id: "b", name: "B", type: "freePoint", activity: "visible", x: 10, y: 0 },\n      {\n        id: "line", name: "Line", type: "line", activity: "visible",\n        startPoint: { mode: "reference", pointId: "a" },\n        endPoint: { mode: "reference", pointId: "b" }\n      },\n      { id: "reverse", name: "", type: "pathReverse", activity: "visible", targetLineId: "line" }\n    ]);\n    const payload = evaluationResultToPayload(evaluation);\n\n    expect(payload.geometryMutationExecutions).toEqual([\n      { mutationElementId: "reverse", targetElementIds: ["line"] }\n    ]);\n    expect(evaluationPayloadToResult(payload).geometryMutationExecutions).toEqual(\n      evaluation.geometryMutationExecutions\n    );\n  });\n\n  it("omits an empty effective stroke map from the JSON payload", () => {'''
          )

          # Rust focused assertions: success, failure, disabled, generated occurrence identity.
          replace_once(
              "src-tauri/src/evaluation/path_reverse_evaluator_tests.rs",
              '''    assert!(result.errors.is_empty());\n    assert!(geometry_missing(&result, "reverse"));\n    let line_geometry = geometry(&result, "line");''',
              '''    assert!(result.errors.is_empty());\n    assert!(geometry_missing(&result, "reverse"));\n    assert_eq!(result.geometry_mutation_executions.len(), 1);\n    assert_eq!(result.geometry_mutation_executions[0].mutation_element_id, "reverse");\n    assert_eq!(result.geometry_mutation_executions[0].target_element_ids, vec!["line"]);\n    let line_geometry = geometry(&result, "line");'''
          )
          replace_once(
              "src-tauri/src/evaluation/path_reverse_evaluator_tests.rs",
              '''    assert_eq!(result.errors.len(), 1);\n    assert_eq!(result.errors[0].missing_dependency_id, "missing-line");''',
              '''    assert_eq!(result.errors.len(), 1);\n    assert!(result.geometry_mutation_executions.is_empty());\n    assert_eq!(result.errors[0].missing_dependency_id, "missing-line");'''
          )
          replace_once(
              "src-tauri/src/evaluation/path_reverse_evaluator_tests.rs",
              '''    assert!(result.errors.is_empty());\n    let geometry = geometry(&result, "line");\n    assert_close(geometry["start"]["x"].as_f64().unwrap(), 0.0);''',
              '''    assert!(result.errors.is_empty());\n    assert!(result.geometry_mutation_executions.is_empty());\n    let geometry = geometry(&result, "line");\n    assert_close(geometry["start"]["x"].as_f64().unwrap(), 0.0);'''
          )
          replace_once(
