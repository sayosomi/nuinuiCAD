name: SAY-153 PR Verify Minimal

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'sayosomi/say-153-headless-mcp-foundation-stdio-server-document_inspect'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-153-headless-mcp-foundation-stdio-server-document_inspect
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Classify MCP paths as Node work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/ci/classifyChanges.mjs")
          text = path.read_text()
          old = '      path.startsWith("test/") ||\n      path.startsWith("vscode-extension/") ||'
          new = '      path.startsWith("test/") ||\n      path.startsWith("mcp-server/") ||\n      path.startsWith("vscode-extension/") ||'
          if text.count(old) != 1:
              raise SystemExit(f"classifier target count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Update lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Existing classifier tests
        run: node --test scripts/ci/classifyChanges.node-test.mjs

      - name: Focused MCP tests
        run: npm test -- mcp-server/test/documentSnapshot.test.ts mcp-server/test/stdio.test.ts

      - name: Build MCP
        run: npm run build:mcp

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Diff check
        run: git diff --check

      - name: Commit verified dependency and CI integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json scripts/ci/classifyChanges.mjs
          git rm .github/workflows/say-153-verify.yml .github/workflows/say-153-pr-verify.yml .github/workflows/say-153-pr-verify-fix.yml .github/workflows/say-153-pr-verify-min.yml
          git commit -m "chore: lock and verify MCP server integration"
          git push origin HEAD:sayosomi/say-153-headless-mcp-foundation-stdio-server-document_inspect
