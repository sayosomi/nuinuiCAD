name: SAY-115 Direct Implement

on:
  push:
    branches:
      - sayosomi/say-115-legacy-palette-remove-source-canonical-model
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-115-legacy-palette-remove-source-canonical-model
          fetch-depth: 0

      - name: Sync latest main in preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Apply SAY-115 preview patch
        run: |
          python scripts/say115_transform.py
          python scripts/say115_fixup.py
          python scripts/say115_test_fixup.py
          python scripts/say115_test_followup.py
          python scripts/say115_full_test_fixup.py
          python scripts/say115_escape_fix.py
          git diff --check

      - name: Install Tauri Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify transformed tree
        run: |
          npm run lint
          npm run build
          npm test -- src/dsl/dslSettingsParser.test.ts src/dsl/dslCompiler.test.ts src/dsl/dslDocument.test.ts src/dsl/dslSerializeElement.test.ts src/document/textPatch.test.ts
          cargo build --quiet --manifest-path src-tauri/Cargo.toml --example evaluate_fixture
          set +e
          npm test > /tmp/say115-full-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "=== full test failure summary ==="
            grep -E "FAIL|failed|Error|AssertionError|×|❯" /tmp/say115-full-test.log | tail -250 || true
            echo "=== full test raw tail ==="
            tail -300 /tmp/say115-full-test.log
          fi
          exit "$status"
