name: SAY-115 Direct Implement

on:
  push:
    branches:
      - sayosomi/say-115-legacy-palette-remove-source-canonical-model
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-115-legacy-palette-remove-source-canonical-model
          fetch-depth: 0

      - name: Apply SAY-115 preview patch
        run: |
          python scripts/say115_transform.py
          python scripts/say115_fixup.py
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build
