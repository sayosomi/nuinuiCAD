name: SAY-115 Direct Implement

on:
  push:
    branches:
      - sayosomi/say-115-legacy-palette-remove-source-canonical-model
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-115-legacy-palette-remove-source-canonical-model
          fetch-depth: 0

      - name: Inventory legacy palette references
        shell: bash
        run: |
          set -euo pipefail
          pattern='DocumentPalette|PaletteColor|colorId|kind: "color"|dslStatementKeywords\.color|sectionEnds\.palette|serializePalette|compiled\.palette|data\.palette|palette:'
          echo '=== SOURCE REFERENCES ==='
          grep -R -n -E "$pattern" src --exclude='*.test.ts' --exclude='*.test.tsx' || true
          echo '=== CORE TEST REFERENCES ==='
          grep -R -n -E "$pattern" src/dsl src/document src/parameters --include='*.test.ts' --include='*.test.tsx' || true
