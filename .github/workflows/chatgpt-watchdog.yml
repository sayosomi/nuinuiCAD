name: ChatGPT watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: chatgpt-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Test watchdog helper
        run: node --test scripts/ci/chatgptWatchdog.node-test.mjs

      - name: Check active ChatGPT sessions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MERGE_WEBHOOK_URL }}
          WATCHDOG_ISSUE_NUMBER: "514"
          WATCHDOG_TIMEOUT_MINUTES: "15"
        run: node scripts/ci/chatgptWatchdog.mjs
