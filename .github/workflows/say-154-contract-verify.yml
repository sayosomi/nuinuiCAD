name: SAY-154 contract verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vscode-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build VS Code extension
        run: npm run build:vscode
      - name: Definition and language-analysis tests
        run: npm test -- vscode-extension/src/definitionProvider.test.ts vscode-extension/src/languageAnalysisSession.test.ts src/dsl/dslDefinitionQuery.test.ts src/dsl/dslReferencesQuery.test.ts
