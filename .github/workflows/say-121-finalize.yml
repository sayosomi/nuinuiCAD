name: SAY-121 finalize semantic call

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sayosomi/say-121-module-diagnostics-recursion-cycle-explanations'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sayosomi/say-121-module-diagnostics-recursion-cycle-explanations
          fetch-depth: 0
      - name: Preserve existing recursion primary set
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path("src/dsl/moduleSemanticAnalysis.ts")
          text = path.read_text()
          old = "  const recursionCycles = moduleRecursionCycles(callEdges);"
          new = "  const recursionCycles = moduleRecursionCycles(semanticDefinitions, callEdges);"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one recursion cycle call, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/say-121-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/dsl/moduleSemanticAnalysis.ts
          git add -u -- .github/workflows/say-121-finalize.yml
          git commit -m "fix: preserve recursion diagnostic count (SAY-121)"
          git push origin HEAD:sayosomi/say-121-module-diagnostics-recursion-cycle-explanations
