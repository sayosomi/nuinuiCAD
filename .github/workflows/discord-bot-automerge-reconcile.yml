name: Reconcile GitHub-token auto-merges to Discord

# GitHub does not fire push/pull_request_target workflows for merges made with
# GITHUB_TOKEN. Reconcile the authoritative merged PR state instead.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  issue_comment:
    types:
      - created
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: discord-bot-auto-merge-reconcile
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'sayosomi' &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == '/discord-reconcile-bot-merges') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted notification implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Allow CI-triggered bot auto-merge to settle before reconciliation
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEWED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "BLOCKED: invalid completed CI head SHA" >&2; exit 1; }

          # workflow_run.pull_requests can be empty even for a genuine PR run.
          # Use the commit's authoritative associated PRs and refuse to guess.
          linked="$(gh api "repos/$REPO/commits/$REVIEWED_SHA/pulls?per_page=100")"
          pr_number="$(jq -er --arg repo "$REPO" --arg head "$REVIEWED_SHA" '
            [.[] | select(
              .head.sha == $head and
              .head.repo.full_name == $repo and
              .base.repo.full_name == $repo and
              .base.ref == "main"
            )] |
            if length == 1 then .[0].number else empty end
          ' <<< "$linked")" || {
            echo "RECONCILE: no unique reviewed-head PR; proceed to normal bounded scan" >&2
            pr_number=""
          }
          if [[ -n "$pr_number" ]]; then
            [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] ||
              { echo "BLOCKED: invalid linked PR number" >&2; exit 1; }

            # GitHub can finish required CI, emit workflow_run, and only then
            # carry out the reserved merge. Wait here, not in the Human chat.
            # Ordinary non-bot PRs exit immediately; schedule remains fallback.
            for attempt in {1..18}; do
              live="$(gh api "repos/$REPO/pulls/$pr_number")"
              jq -e --arg repo "$REPO" --arg head "$REVIEWED_SHA" '
                .head.sha == $head and
                .head.repo.full_name == $repo and
                .base.repo.full_name == $repo and
                .base.ref == "main"
              ' <<< "$live" >/dev/null || {
                echo "RECONCILE: PR head/base drift; leave normal scan to handle state" >&2
                break
              }
              if jq -e '.merged == true and .state == "closed"' <<< "$live" >/dev/null; then
                echo "RECONCILE: PR #$pr_number merged; run notification scan" >&2
                break
              fi
              if ! jq -e '
                .state == "open" and
                .auto_merge.merge_method == "merge" and
                .auto_merge.enabled_by.login == "github-actions[bot]"
              ' <<< "$live" >/dev/null; then
                echo "RECONCILE: PR #$pr_number has no active GitHub-bot auto-merge; skip wait" >&2
                break
              fi
              if [[ "$attempt" -eq 18 ]]; then
                echo "RECONCILE: bot auto-merge still pending after bounded wait; scheduled scan remains fallback" >&2
                break
              fi
              sleep 5
            done
          fi

      - name: Send previously missed GitHub-token merge notifications once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MERGE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [[ -n "$DISCORD_WEBHOOK_URL" ]] || { echo "ERROR: Discord webhook secret is absent" >&2; exit 1; }
          [[ "$REPO" == "sayosomi/nuinuiCAD" ]] || exit 1
          cutoff="$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ)"

          # A bounded current-state scan, not a replay of every historical PR.
          recent="$(gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=100")"
          jq -e --arg cutoff "$cutoff" '
            type == "array" and
            (length < 100 or (.[-1].updated_at < $cutoff))
          ' <<< "$recent" >/dev/null ||
            { echo "ERROR: more than 100 recently updated closed PRs; enlarge scan safely" >&2; exit 1; }
          numbers="$(jq -r --arg cutoff "$cutoff" '
            .[] | select(.merged_at != null and .merged_at >= $cutoff) | .number
          ' <<< "$recent")"

          while IFS= read -r number; do
            [[ -n "$number" ]] || continue
            [[ "$number" =~ ^[1-9][0-9]*$ ]] || exit 1

            pr="$(gh api "repos/$REPO/pulls/$number")"
            jq -e --arg cutoff "$cutoff" '
              .state == "closed" and
              .merged == true and
              .base.ref == "main" and
              .merged_at >= $cutoff and
              .merged_by.login == "github-actions[bot]"
            ' <<< "$pr" >/dev/null || continue

            merge_sha="$(jq -r '.merge_commit_sha // empty' <<< "$pr")"
            [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] ||
              { echo "ERROR: missing merge SHA for PR $number" >&2; exit 1; }
            marker="<!-- discord-bot-merge-notified:$merge_sha -->"

            # A bot-authored PR comment is the durable receipt. A replay after
            # a crash may resend, but a recorded success is never resent.
            comments="$(gh api --paginate "repos/$REPO/issues/$number/comments?per_page=100")"
            if jq -se --arg marker "$marker" '
              any(.[][]; .user.login == "github-actions[bot]" and .body == $marker)
            ' <<< "$comments" >/dev/null; then
              echo "ALREADY NOTIFIED PR #$number"
              continue
            fi

            export REPOSITORY_NAME="$REPO"
            export PR_NUMBER="$number"
            export PR_TITLE="$(jq -r '.title' <<< "$pr")"
            export PR_URL="$(jq -r '.html_url' <<< "$pr")"
            node scripts/ci/discordPrNotification.mjs merge
            gh api -X POST "repos/$REPO/issues/$number/comments" -f body="$marker" --jq '.id' >/dev/null
            echo "DISCORD BOT MERGE NOTIFIED PR #$number ($merge_sha)"
          done <<< "$numbers"
