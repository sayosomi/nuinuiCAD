name: SAY-164 refresh Cargo lock

on:
  push:
    branches:
      - sayosomi/say-164-rust-evaluator-extract-from-tauri-into-host-neutral-crate

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-164-rust-evaluator-extract-from-tauri-into-host-neutral-crate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh Tauri Cargo lockfile
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "SAY-164: refresh Tauri Cargo lockfile"
          git push origin HEAD:sayosomi/say-164-rust-evaluator-extract-from-tauri-into-host-neutral-crate
