name: SAY-164 refresh Cargo lock

on:
  push:
    branches:
      - sayosomi/say-164-rust-evaluator-extract-from-tauri-into-host-neutral-crate

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-164-rust-evaluator-extract-from-tauri-into-host-neutral-crate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh Tauri Cargo lockfile
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Require the tracked Tauri lockfile in CI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          replacements = {
              'cargo check --manifest-path src-tauri/Cargo.toml': 'cargo check --locked --manifest-path src-tauri/Cargo.toml',
              'cargo test --manifest-path src-tauri/Cargo.toml': 'cargo test --locked --manifest-path src-tauri/Cargo.toml',
              'cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings': 'cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected CI command: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit generated and CI changes
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/Cargo.lock .github/workflows/ci.yml; then
            echo "Generated and CI files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock .github/workflows/ci.yml
          git commit -m "SAY-164: lock Tauri dependency resolution in CI"
          git push origin HEAD:sayosomi/say-164-rust-evaluator-extract-from-tauri-into-host-neutral-crate
