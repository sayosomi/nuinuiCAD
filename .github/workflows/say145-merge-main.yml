name: SAY-145 refresh latest main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-main:
    if: ${{ github.event.pull_request.head.ref == 'sayosomi/say-145-runtime-diagnostics-session-ownership-fix' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SAY-145 follow-up branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Merge latest main and remove helper
        run: python3 scripts/say145-merge-main.py
