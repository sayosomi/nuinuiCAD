name: SAY-127 Apply Runtime Trace Wiring

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-127-runtime-inspection-short-circuit-condition-trace
          fetch-depth: 0

      - name: Repair staged patch target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("automation/say-127-apply.py")
          text = path.read_text()
          old = '''replace_once(
              "src-tauri/src/evaluation/types.rs",
              "    pub(crate) geometry_mutation_executions: Vec<GeometryMutationExecution>,",
              "    pub(crate) geometry_mutation_executions: Vec<GeometryMutationExecution>,\\n"
              "    pub(crate) condition_evaluation_traces: Vec<Value>,"
          )'''
          new = '''replace_once(
              "src-tauri/src/evaluation/types.rs",
              "    pub(crate) geometry_mutation_executions: Vec<GeometryMutationExecution>,\\n"
              "    pub(crate) instance_base_geometry: HashMap<ElementId, Vec<Value>>,",
              "    pub(crate) geometry_mutation_executions: Vec<GeometryMutationExecution>,\\n"
              "    pub(crate) condition_evaluation_traces: Vec<Value>,\\n"
              "    pub(crate) instance_base_geometry: HashMap<ElementId, Vec<Value>>,"
          )'''
          if text.count(old) != 1:
              raise SystemExit(f"repair target count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply wiring
        run: python3 automation/say-127-apply.py

      - name: Wire top-level conditional trace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/evaluation/mod.rs")
          text = path.read_text()
          old = "resolve_conditional_group_branch(expression, resolver, &state)"
          new = '''{
                      let (active_branch, trace) =
                          resolve_conditional_group_condition(expression, resolver, &state);
                      state.condition_evaluation_traces.push(serde_json::json!({
                          "elementId": id.clone(),
                          "trace": trace,
                      }));
                      active_branch
                  }'''
          if text.count(old) != 1:
              raise SystemExit(f"top-level resolver call count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install Node dependencies
        run: npm ci

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Focused TypeScript trace tests
        run: npx vitest run src/scalars/conditionEvaluationTrace.test.ts

      - name: Install Tauri Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Focused Rust trace tests
        run: cargo test --manifest-path src-tauri/Cargo.toml condition_evaluation_trace

      - name: TypeScript build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Remove temporary apply helpers
        run: git rm -f automation/say-127-apply.py .github/workflows/say-127-apply.yml

      - name: Commit and push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SAY-127: wire short-circuit condition traces"
          git push origin HEAD:sayosomi/say-127-runtime-inspection-short-circuit-condition-trace
