name: SAY-81 apply integration patch

on:
  push:
    branches:
      - sayosomi/say-81-vs-code-reveal-in-canvas-semantic-caret-targeting-for

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply SAY-81 integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          # Carry compiler-owned Module geometry lowering through the canonical compiled document.
          replace_exact(
              "src/dsl/dslDocument.ts",
              'import type { ModuleMaterialization } from "./moduleMaterialization";\n',
              'import type { ModuleMaterialization } from "./moduleMaterialization";\nimport type { ModuleGeometryRuntimeCompilation } from "./moduleGeometryRuntime";\n'
          )
          replace_exact(
              "src/dsl/dslDocument.ts",
              '  /** Task 5 runtime expansion && source-origin mapping; never persisted as source. */\n  moduleMaterialization?: ModuleMaterialization;\n',
              '  /** Task 5 runtime expansion && source-origin mapping; never persisted as source. */\n  moduleMaterialization?: ModuleMaterialization;\n  /** Compiler-owned Module geometry lowering for exact current runtime consumers. */\n  moduleGeometryRuntime?: ModuleGeometryRuntimeCompilation;\n'
          )
          replace_exact(
              "src/dsl/dslDocument.ts",
              '      ...(compiled.moduleMaterialization ? { moduleMaterialization: compiled.moduleMaterialization } : {}),\n      ...(moduleScalarCompilation?.scalarExecutionPositionByRuntimeElementId\n',
              '      ...(compiled.moduleMaterialization ? { moduleMaterialization: compiled.moduleMaterialization } : {}),\n      ...(compiled.moduleGeometryRuntime ? { moduleGeometryRuntime: compiled.moduleGeometryRuntime } : {}),\n      ...(moduleScalarCompilation?.scalarExecutionPositionByRuntimeElementId\n',
              expected=1
          )
          replace_exact(
              "src/dsl/dslDocument.ts",
              '    ...(compiled.moduleMaterialization ? { moduleMaterialization: compiled.moduleMaterialization } : {}),\n    ...(moduleScalarCompilation?.scalarExecutionPositionByRuntimeElementId\n',
              '    ...(compiled.moduleMaterialization ? { moduleMaterialization: compiled.moduleMaterialization } : {}),\n    ...(compiled.moduleGeometryRuntime ? { moduleGeometryRuntime: compiled.moduleGeometryRuntime } : {}),\n    ...(moduleScalarCompilation?.scalarExecutionPositionByRuntimeElementId\n',
              expected=1
          )

          # Stable JSON-safe Reveal result protocol: runtime IDs remain Webview-local.
          replace_exact(
              "src/vscode/protocol.ts",
              'import type { NormalizedSourceRange } from "../dsl/dslNavigationQuery";\n',
              'import type { NormalizedSourceRange } from "../dsl/dslNavigationQuery";\nimport type { DslCanvasRevealDegradation, DslCanvasRevealFailureReason } from "../dsl/dslCanvasRevealQuery";\n'
          )
          replace_exact(
              "src/vscode/protocol.ts",
              'export type VscodeOutputPreviewPlaceCommit = {\n  type: "outputPreviewPlaceCommit";\n  documentVersion: number;\n  normalizedSourceSnapshot: string;\n  statementRange: NormalizedSourceRange;\n  patches: readonly VscodeOutputPreviewPlaceCoordinatePatch[];\n};\n\nexport type VscodeToExtensionMessage =\n',
              'export type VscodeOutputPreviewPlaceCommit = {\n  type: "outputPreviewPlaceCommit";\n  documentVersion: number;\n  normalizedSourceSnapshot: string;\n  statementRange: NormalizedSourceRange;\n  patches: readonly VscodeOutputPreviewPlaceCoordinatePatch[];\n};\n\nexport type VscodeCanvasNavigationResult =\n  | { type: "canvasNavigationResult"; requestId: number; status: "resolved"; degradations: readonly DslCanvasRevealDegradation[] }\n  | { type: "canvasNavigationResult"; requestId: number; status: "failed"; reason: DslCanvasRevealFailureReason }\n  | { type: "canvasNavigationResult"; requestId: number; status: "focused" };\n\nexport type VscodeToExtensionMessage =\n'
          )
          replace_exact(
              "src/vscode/protocol.ts",
              '  | { type: "canvasNavigationResult"; requestId: number; status: "ready" | "no-target" | "no-renderable-geometry" | "stale" | "focused" }\n',
              '  | VscodeCanvasNavigationResult\n'
          )

          # Preserve requested semantic/materialization order only when explicitly requested.
          replace_exact(
              "src/commands/selectionCommands.ts",
              '/** Replace Canvas selection in document order through the shared history owner. */\nexport const replaceCanvasSelection = (\n  elementIds: readonly ElementId[],\n  primaryElementId?: ElementId,\n  recordHistory = false\n) => {\n  const elements = useCadDocumentStore.getState().elements;\n  const selectableIds = selectionEligibleElementIds(elements);\n  const requested = new Set(elementIds);\n  const orderedIds = elements\n    .filter((element) => requested.has(element.id) && selectableIds.has(element.id))\n    .map((element) => element.id);\n',
              '/** Replace Canvas selection through the shared history owner. Document order remains the default. */\nexport const replaceCanvasSelection = (\n  elementIds: readonly ElementId[],\n  primaryElementId?: ElementId,\n  recordHistory = false,\n  ordering: "document" | "requested" = "document"\n) => {\n  const elements = useCadDocumentStore.getState().elements;\n  const selectableIds = selectionEligibleElementIds(elements);\n  const requested = new Set(elementIds);\n  const orderedIds = ordering === "requested"\n    ? Array.from(requested).filter((id) => selectableIds.has(id))\n    : elements\n        .filter((element) => requested.has(element.id) && selectableIds.has(element.id))\n        .map((element) => element.id);\n'
          )

          # Webview: shared source semantics -> runtime/materialization target set -> selection + viewport.
          replace_exact(
              "src/vscode/VSCodeApp.tsx",
              'import { queryDslCanvasSourceDefinition, queryDslCanvasSourceTarget } from "../dsl/dslNavigationQuery";\nimport { sourceOwnerByRuntimeElementId } from "../dsl/sourceOwnership";\n',
              'import { queryDslCanvasSourceDefinition, queryDslCanvasSourceTarget } from "../dsl/dslNavigationQuery";\nimport { queryDslCanvasRevealSourceTarget } from "../dsl/dslCanvasRevealQuery";\nimport { queryDslCanvasRevealRuntimeTarget } from "../dsl/dslCanvasRevealRuntime";\n'
          )
          replace_exact(
              "src/vscode/VSCodeApp.tsx",
              'import { canvasNavigationContainerTarget } from "./canvasNavigationContainerTarget";\n',
              'import { canvasNavigationContainerTarget } from "./canvasNavigationContainerTarget";\nimport { effectiveDrawElementIds, effectiveEvaluationElementIds } from "../model/elementActivity";\nimport { effectiveVisibleElementIdsForProfile, visibilityProfileById } from "../model/visibilityProfiles";\n'
          )
          p = Path("src/vscode/VSCodeApp.tsx")
          text = p.read_text()
          start = text.index('      } else if (message.type === "canvasNavigationRequest") {')
          end = text.index('      } else if (message.type === "focusCanvas") {', start)
          replacement = '''      } else if (message.type === "canvasNavigationRequest") {
        pendingCanvasFocusRequestRef.current = null;
        latestCanvasNavigationRequestRef.current = message.requestId;
        const current = currentAuthoritativeDocument(message.documentVersion);
        if (!current || canvasHistoryInFlightRef.current !== null) {
          api.postMessage({
            type: "canvasNavigationResult",
            requestId: message.requestId,
            status: "failed",
            reason: "source-mismatch"
          });
          return;
        }
        const sourceTarget = queryDslCanvasRevealSourceTarget({
          source: current.source,
          compiled: current.compiled,
          position: message.normalizedSourceOffset
        });
        if (sourceTarget.status === "failed") {
          api.postMessage({
            type: "canvasNavigationResult",
            requestId: message.requestId,
            status: "failed",
            reason: sourceTarget.reason
          });
          return;
        }

        const runtimeElements = effectiveElements(current.state);
        const drawingModifiers = current.state.modifiers ?? [];
        const effectiveVisibleElementIds = effectiveDrawElementIds(runtimeElements, drawingModifiers);
        const effectiveEnabledElementIds = effectiveEvaluationElementIds(runtimeElements, drawingModifiers);
        const activeVisibilityProfile = visibilityProfileById(
          current.state.visibilityProfiles,
          current.state.activeVisibilityProfileId
        );
        const profileVisibleElementIds = effectiveVisibleElementIdsForProfile({
          elements: [...runtimeElements],
          profile: activeVisibilityProfile
        });
        const revealResult = queryDslCanvasRevealRuntimeTarget({
          target: sourceTarget.target,
          compiled: current.compiled,
          moduleGeometryRuntime: current.compiled.moduleGeometryRuntime,
          elements: runtimeElements,
          effectiveVisibleElementIds,
          effectiveEnabledElementIds,
          profileVisibleElementIds
        });
        if (revealResult.status === "failed") {
          api.postMessage({
            type: "canvasNavigationResult",
            requestId: message.requestId,
            status: "failed",
            reason: revealResult.reason
          });
          return;
        }

        const currentEvaluation = evaluationRef.current;
        const currentEvaluationIsCurrent = evaluationStateIsCurrentFor(
          evaluationStateRef.current,
          current.state.compiledDocumentRevision
        );
        const selectionIds = [...revealResult.runtimeElementIds];
        const primarySelectionId = revealResult.primaryRuntimeElementId;
        let revealBounds = null;
        if (selectionIds.length === 1) {
          const containerTarget = canvasNavigationContainerTarget({
            runtimeElementIds: selectionIds,
            elements: runtimeElements,
            evaluation: currentEvaluation,
            evaluationIsCurrent: currentEvaluationIsCurrent,
            moduleMaterialization: current.compiled.moduleMaterialization,
            visibilityProfiles: current.state.visibilityProfiles,
            activeVisibilityProfileId: current.state.activeVisibilityProfileId,
            measureCanvasTextWidth
          });
          if (containerTarget.status === "stale") {
            api.postMessage({
              type: "canvasNavigationResult",
              requestId: message.requestId,
              status: "failed",
              reason: "source-mismatch"
            });
            return;
          }
          if (containerTarget.status === "no-renderable-geometry") {
            api.postMessage({
              type: "canvasNavigationResult",
              requestId: message.requestId,
              status: "failed",
              reason: "no-revealable-runtime-target"
            });
            return;
          }
          if (containerTarget.status === "ready") revealBounds = containerTarget.bounds;
        }

        if (!replaceCanvasSelection(selectionIds, primarySelectionId, true, "requested")) {
          api.postMessage({
            type: "canvasNavigationResult",
            requestId: message.requestId,
            status: "failed",
            reason: "no-revealable-runtime-target"
          });
          return;
        }

        const viewport = canvasFocusRef.current;
        if (viewport) {
          const rect = viewport.getBoundingClientRect();
          const bounds = revealBounds ?? (
            currentEvaluation &&
            currentEvaluationIsCurrent &&
            currentEvaluation.computedGeometry instanceof Map
              ? canvasElementDrawingBounds({
                  elementId: primarySelectionId,
                  elements: runtimeElements,
                  evaluation: currentEvaluation,
                  visibilityProfiles: current.state.visibilityProfiles,
                  activeVisibilityProfileId: current.state.activeVisibilityProfileId,
                  measureCanvasTextWidth
                })
              : null
          );
          if (bounds && Number.isFinite(rect.width) && Number.isFinite(rect.height)) {
            const pan = minimumCanvasPanForBounds(bounds, useCadUiStore.getState().canvasViewport, {
              width: rect.width,
              height: rect.height
            });
            if (pan && (pan.dx !== 0 || pan.dy !== 0)) {
              useCadUiStore.getState().panCanvasViewport(pan.dx, pan.dy);
            }
          }
        }
        api.postMessage({
          type: "canvasNavigationResult",
          requestId: message.requestId,
          status: "resolved",
          degradations: revealResult.degradations
        });
'''
          p.write_text(text[:start] + replacement + text[end:])

          # Extension host: same source preflight + localized single notification + existing focus handoff.
          replace_exact(
              "vscode-extension/src/extension.ts",
              'import { queryDslCanvasSourceTarget, type NormalizedSourceRange } from "../../src/dsl/dslNavigationQuery";\n',
              'import { queryDslCanvasSourceTarget, type NormalizedSourceRange } from "../../src/dsl/dslNavigationQuery";\nimport { queryDslCanvasRevealSourceTarget } from "../../src/dsl/dslCanvasRevealQuery";\n'
          )
          replace_exact(
              "vscode-extension/src/extension.ts",
              'import { presentBakeOperationResult } from "./bakeOperationPresentation";\n',
              'import { presentBakeOperationResult } from "./bakeOperationPresentation";\nimport {\n  revealInCanvasNotificationFor,\n  type RevealInCanvasPresentationOutcome\n} from "./revealInCanvasPresentation";\n'
          )
          insert_after = '''const toVscodeDiagnostic = (
  document: vscode.TextDocument,
  diagnostic: CompilerDiagnostic
): vscode.Diagnostic => {'''
          ext = Path("vscode-extension/src/extension.ts")
          text = ext.read_text()
          diagnostic_start = text.index(insert_after)
          diagnostic_end = text.index('\n};\n\nconst webviewHtml =', diagnostic_start) + len('\n};')
          presentation_helper = '''

const presentRevealInCanvasOutcome = (outcome: RevealInCanvasPresentationOutcome): void => {
  const displayLanguage = (vscode as typeof vscode & { env?: { language?: string } }).env?.language ?? "en";
  const notification = revealInCanvasNotificationFor(outcome, displayLanguage);
  if (!notification) return;
  if (notification.severity === "warning") {
    void vscode.window.showWarningMessage(notification.message);
  } else {
    void vscode.window.showErrorMessage(notification.message);
  }
};'''
          text = text[:diagnostic_end] + presentation_helper + text[diagnostic_end:]

          start = text.index('  const handleCanvasNavigationResult = (')
          end = text.index('  const completeCanvasHistory =', start)
          replacement = '''  const handleCanvasNavigationResult = (
    session: DocumentSession,
    message: Extract<VscodeToExtensionMessage, { type: "canvasNavigationResult" }>
  ): void => {
    const inFlight = session.inFlightCanvasNavigation;
    if (!inFlight || inFlight.requestId !== message.requestId) return;
    if (message.status === "resolved") {
      if (
        session.document.version !== inFlight.documentVersion ||
        session.inFlightCanvasHistory !== null ||
        canvasHistoryHandoffSession !== null
      ) {
        session.pendingCanvasFocus = null;
        session.inFlightCanvasNavigation = null;
        return;
      }
      presentRevealInCanvasOutcome({ status: "resolved", degradations: message.degradations });
      if (inFlight.focusSent) return;
      session.pendingCanvasFocus = { requestId: message.requestId };
      session.panel.reveal(vscode.ViewColumn.Beside, false);
      flushPendingCanvasFocus(session);
      return;
    }
    if (message.status === "focused") {
      session.pendingCanvasFocus = null;
      session.inFlightCanvasNavigation = null;
      return;
    }
    session.pendingCanvasFocus = null;
    session.inFlightCanvasNavigation = null;
    presentRevealInCanvasOutcome({ status: "failed", reason: message.reason });
    deliverPendingCanvasNavigation(session);
  };

'''
          text = text[:start] + replacement + text[end:]

          start = text.index('  const revealInCanvas = (): void => {')
          end = text.index('  const startBenchmark =', start)
          replacement = '''  const revealInCanvas = (): void => {
    const editor = activeNuiEditor();
    if (!editor) return;
    const document = editor.document;
    const rawSource = document.getText();
    const sessionForDocument = languageAnalysisSessionFor(document);
    if (sessionForDocument.getSource() !== rawSource) sessionForDocument.replaceSource(rawSource);
    const source = {
      normalizedSource: normalizedSourceFor(rawSource),
      sourceRevision: sessionForDocument.getSourceRevision()
    };
    const semantic = sessionForDocument.definitionSemanticSnapshot(source);
    if (!semantic?.compiled) {
      presentRevealInCanvasOutcome({ status: "failed", reason: "analysis-unavailable" });
      return;
    }
    const normalizedSourceOffset = normalizedOffsetFromRaw(rawSource, document.offsetAt(editor.selection.active));
    const sourceTarget = queryDslCanvasRevealSourceTarget({
      source,
      compiled: semantic.compiled,
      position: normalizedSourceOffset
    });
    if (sourceTarget.status === "failed") {
      presentRevealInCanvasOutcome({ status: "failed", reason: sourceTarget.reason });
      return;
    }

    const key = documentKey(document);
    let session = sessions.get(key, "canvas");
    if (canvasHistoryHandoffSession !== null || (session !== undefined && session.inFlightCanvasHistory !== null)) {
      presentRevealInCanvasOutcome({ status: "failed", reason: "canvas-history-busy" });
      return;
    }
    if (!session) session = createCanvasPanel(editor.document, true);
    if (!session) return;

    const requestId = nextNavigationRequestId++;
    session.pendingCanvasNavigation = {
      requestId,
      documentVersion: document.version,
      normalizedSourceOffset
    };
    session.pendingCanvasFocus = null;
    session.panel.reveal(vscode.ViewColumn.Beside, true);
    deliverPendingCanvasNavigation(session);
  };

'''
          text = text[:start] + replacement + text[end:]
          ext.write_text(text)

          # Update navigation test fixtures from the old transport statuses.
          for path in ["vscode-extension/src/extension.test.ts", "src/vscode/VSCodeApp.test.tsx"]:
              p = Path(path)
              text = p.read_text()
              # Multiline object literals in tests: add an empty degradation list for old success messages.
              text = re.sub(
                  r'(type:\s*"canvasNavigationResult",\s*\n\s*requestId:\s*[^,\n]+,\s*\n\s*)status:\s*"ready"',
                  r'\1status: "resolved",\n      degradations: []',
                  text
              )
              # One-line/object-containing old success values.
              text = text.replace('status: "ready" }', 'status: "resolved", degradations: [] }')
              p.write_text(text)

          # The Extension test mock may now receive degraded-success warnings.
          p = Path("vscode-extension/src/extension.test.ts")
          text = p.read_text()
          if 'showWarningMessage: vi.fn(),' not in text:
              text = text.replace('  showErrorMessage: vi.fn(),\n', '  showErrorMessage: vi.fn(),\n  showWarningMessage: vi.fn(),\n', 1)
              text = text.replace('      showErrorMessage: mocks.showErrorMessage,\n', '      showErrorMessage: mocks.showErrorMessage,\n      showWarningMessage: mocks.showWarningMessage,\n', 1)
              text = text.replace('  mocks.showErrorMessage.mockReset();\n', '  mocks.showErrorMessage.mockReset();\n  mocks.showWarningMessage.mockReset();\n')
          p.write_text(text)
          PY

          git rm .github/workflows/say81-apply-integration.yml
          git add src/dsl/dslDocument.ts src/vscode/protocol.ts src/commands/selectionCommands.ts src/vscode/VSCodeApp.tsx vscode-extension/src/extension.ts vscode-extension/src/extension.test.ts src/vscode/VSCodeApp.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SAY-81: integrate semantic Reveal through VS Code"
          git push
