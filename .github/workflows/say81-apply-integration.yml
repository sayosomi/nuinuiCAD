name: SAY-81 apply integration patch

on:
  push:
    branches:
      - sayosomi/say-81-vs-code-reveal-in-canvas-semantic-caret-targeting-for
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply SAY-81 integration
        run: python scripts/say81-apply-integration.py
      - name: Commit integrated implementation
        shell: bash
        run: |
          git rm .github/workflows/say81-apply-integration.yml scripts/say81-apply-integration.py
          git add src/dsl/dslDocument.ts src/vscode/protocol.ts src/commands/selectionCommands.ts src/vscode/VSCodeApp.tsx vscode-extension/src/extension.ts vscode-extension/src/extension.test.ts src/vscode/VSCodeApp.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SAY-81: integrate semantic Reveal through VS Code"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
