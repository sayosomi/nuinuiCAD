name: SAY-190 acceptance patch

on:
  push:
    branches:
      - sayosomi/say-190-nui4-arc-direction-explicit-clockwise-counterclockwise

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SAY-190 acceptance edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/dsl/dslSerializeElement.ts",
              '''    case "choice":\n      return formatDslName(value as string);''',
              '''    case "choice":\n      return formatDslName(\n        element.type === "arcLine" && parameterKey === "direction" && value === undefined\n          ? "counterclockwise"\n          : value as string\n      );'''
          )

          replace_once(
              "src/dsl/__fixtures__/nui4CanonicalStatements.ts",
              '''  { key: "arcLine", elementType: "arcLine", construction: "arc", minimal: "arc arcLine-default-min = arc(center: @A, radius: 30, start: 0, end: 90)", populated: "arc populated = arc(center: @A, radius: 12, start: 12, end: 12, steps: [x: 0.5])" },''',
              '''  { key: "arcLine", elementType: "arcLine", construction: "arc", minimal: "arc arcLine-default-min = arc(center: @A, radius: 30, start: 0, end: 90, direction: counterclockwise)", populated: "arc populated = arc(center: @A, radius: 12, start: 12, end: 12, direction: clockwise, steps: [x: 0.5])" },'''
          )

          marker = '''  it("lineTangentOffsetPoint.curveSide (choice)", () => {'''
          insertion = '''  it("arcLine.direction (choice)", () => {\n    const compiled = compileFor([\n      "const 向き: choice(counterclockwise, clockwise) = clockwise",\n      "arc A = arc(center: (0, 0), radius: 10, start: 15, end: 155, direction: @向き)"\n    ].join("\\n"));\n    const { sourcesByOccurrenceKey, diagnostics } = compilePropertyBindings(compiled);\n    expect(diagnostics).toEqual([]);\n    expect(sourceFor(sourcesByOccurrenceKey.get(propertyBindingOccurrenceKey(1, "direction")))).toEqual({\n      bindingId: "binding:stable-0",\n      type: { kind: "choice", options: ["counterclockwise", "clockwise"] },\n      name: "向き"\n    });\n  });\n\n'''
          replace_once("src/scalars/propertyBindingCompiler.test.ts", marker, insertion + marker)

          marker = '''  it("fails closed (no computedGeometry, an error) when the bound boolean binding is poisoned", () => {'''
          insertion = '''  it("arcLine.direction bound to a choice const matches the same literal clockwise arc", () => {\n    const bound = compileCanonical([\n      "nui 4",\n      "const 向き: choice(counterclockwise, clockwise) = clockwise",\n      "arc A = arc(center: (0, 0), radius: 10, start: 15, end: 155, direction: @向き)"\n    ].join("\\n"));\n    const literal = compileCanonical([\n      "nui 4",\n      "arc A = arc(center: (0, 0), radius: 10, start: 15, end: 155, direction: clockwise)"\n    ].join("\\n"));\n\n    const boundResult = evaluateElements(bound.document.elements, {\n      scalarProgram: bound.scalarProgram,\n      propertyBindingEntries: entriesFor(bound)\n    });\n    const literalResult = evaluateElements(literal.document.elements, {});\n    const boundGeometry = boundResult.computedGeometry.get(idByName(bound, "A"));\n    const literalGeometry = literalResult.computedGeometry.get(idByName(literal, "A"));\n\n    expect(boundResult.errors).toEqual([]);\n    expect(geometryShape(boundGeometry)).toEqual(geometryShape(literalGeometry));\n    expect(boundGeometry).toMatchObject({ kind: "arcLine", sweepAngleDeg: -220 });\n  });\n\n'''
          replace_once("src/geometry/propertyBindingRuntimeIntegration.test.ts", marker, insertion + marker)

          replace_once(
              "src/geometry/geometryHoverPresentation.test.ts",
              '''        { label: "スイープ", value: "-90°" },\n        { label: "長さ", value: "78.54 mm" },''',
              '''        { label: "スイープ", value: "-90°" },\n        { label: "進行方向", value: "時計回り" },\n        { label: "長さ", value: "78.54 mm" },'''
          )

          replace_once(
              "src/commands/bakeGeometry.test.ts",
              '''  it("rejects reversed arcs without inserting an approximation", () => {''',
              '''  it("bakes reversed arcs exactly as clockwise arcs", () => {'''
          )
          replace_once(
              "src/commands/bakeGeometry.test.ts",
              '''    expect(plan?.generatedElementIds).toEqual([]);\n    expect(applyLineSplices(current.sourceText, plan!.splices)).toContain("// Bake skipped: arc A — not losslessly representable");''',
              '''    expect(plan?.generatedElementIds).toHaveLength(1);\n    expect(applyLineSplices(current.sourceText, plan!.splices)).toContain(\n      "arc A_bake = arc(center: (0, 0), radius: 10, start: 90, end: 0, direction: clockwise)"\n    );'''
          )
          replace_once(
              "src/commands/bakeGeometry.test.ts",
              '''      "arc A_bake = arc(center: (0, 0), radius: 12, start: 30, end: 150)"''',
              '''      "arc A_bake = arc(center: (0, 0), radius: 12, start: 30, end: 150, direction: counterclockwise)"'''
          )

          spec_anchor = '''The construction call is named-argument-first. In canonical multi-line form,\nthe final argument has a trailing comma. A single-line call is parseable, but\nthe Source Editor's canonical formatter emits the stable multi-line shape for a\nmulti-argument call.\n\n### Tangent offsets by Bezier curvature side'''
          spec_insert = '''The construction call is named-argument-first. In canonical multi-line form,\nthe final argument has a trailing comma. A single-line call is parseable, but\nthe Source Editor's canonical formatter emits the stable multi-line shape for a\nmulti-argument call.\n\n### Explicit direction for concrete arcs\n\nThe concrete `arc(...)` construction has an optional `direction` choice:\n\n```text\narc A = arc(\n  center: @Center,\n  radius: 40,\n  start: 15,\n  end: 155,\n  direction: clockwise,\n)\n```\n\n`direction` is `choice(counterclockwise, clockwise)` and defaults to\n`counterclockwise` when omitted. Canonical serialization always emits the\nresolved token, including `direction: counterclockwise` for omitted input. The\nchoice uses the normal scalar-property binding path, so a compatible typed\nchoice reference is valid. This does not add a readable `@Arc.direction`\ngeometry property.\n\nRuntime direction is represented only by signed `ComputedArcLine.sweepAngleDeg`.\nFor `counterclockwise`, the sweep is the positive traversal from `start` to\n`end`; for `clockwise`, it is the negative traversal from `start` to `end`.\nThus `15 -> 155` is `+140°` counterclockwise and `-220°` clockwise, while\n`155 -> 15` clockwise is `-140°`. Equal angles produce canonical `0` in either\ndirection (never `-0`). An explicit non-zero whole turn such as `0 -> 360` is\n`+360°` counterclockwise or `-360°` clockwise. Arc length remains non-negative.\n\n`direction` belongs only to concrete `arc(...)`. The `through(...)` and\n`corner(...)` arc constructions retain their existing signatures and do not\naccept this argument.\n\n### Tangent offsets by Bezier curvature side'''
          replace_once("docs/nui4/spec.md", spec_anchor, spec_insert)

          dsl_anchor = '''group 前身頃 {\n  line stitching = segment(\n    start: @A,\n    end: @B,\n  )\n}\n```\n\n条件分岐と反復には名前を付けません。反復変数は body 内の束縛で、参照時は `@` が必要です。'''
          dsl_insert = '''group 前身頃 {\n  line stitching = segment(\n    start: @A,\n    end: @B,\n  )\n}\n```\n\n### 円弧の進行方向\n\n通常の `arc(...)` では `direction` に `counterclockwise`（反時計回り）または\n`clockwise`（時計回り）を指定できます。省略時は `counterclockwise` です。\n\n```text\narc A = arc(\n  center: @Center,\n  radius: 40,\n  start: 15,\n  end: 155,\n  direction: clockwise,\n)\n```\n\n保存時は省略した場合も `direction: counterclockwise` が明示されます。\n`direction` は通常の `choice(counterclockwise, clockwise)` property なので、同じ\nchoice 型の binding を `direction: @向き` のように渡せます。\n\n内部では反時計回りを正、時計回りを負の signed sweep として扱います。例えば\n`start: 15, end: 155` は反時計回りなら `+140°`、時計回りなら `-220°` です。\n同じ角度同士は `0°`、`0 -> 360` の明示的な1周は反時計回り `+360°`、時計回り\n`-360°` になります。長さは進行方向に関係なく正です。`through(...)` と\n`corner(...)` には `direction` はありません。\n\n条件分岐と反復には名前を付けません。反復変数は body 内の束縛で、参照時は `@` が必要です。'''
          replace_once("docs/dsl.md", dsl_anchor, dsl_insert)

          Path("src/geometry/arcDirection.integration.test.ts").write_text(r'''import { describe, expect, it } from "vitest";
import { compileFreshCanonicalText } from "../document/canonicalDocument";
import { constructionFor } from "../dsl/dslConstructions";
import { documentDslRefs } from "../dsl/dslSerializer";
import { serializeElementStatementLogical } from "../dsl/dslSerializeElement";
import type { ArcLineElement, EvaluationResult } from "../types/geometry";
import { evaluateElements } from "./evaluate";
import { geometryHoverPresentation } from "./geometryHoverPresentation";
import { buildEvaluationOptions } from "./productionEvaluationContext";

const compile = (source: string) => {
  const result = compileFreshCanonicalText(source);
  if (result.status === "fatal") throw new Error(result.diagnostics.map((diagnostic) => diagnostic.message).join("\n"));
  return result.doc;
};

const evaluate = (compiled: ReturnType<typeof compile>): EvaluationResult =>
  evaluateElements(compiled.document.elements, buildEvaluationOptions({
    compiledDocument: compiled,
    evaluationLimitIndex: undefined
  }));

const arcByName = (compiled: ReturnType<typeof compile>, name: string): ArcLineElement => {
  const element = compiled.document.elements.find((candidate) => candidate.name === name);
  if (!element || element.type !== "arcLine") throw new Error(`expected arc ${name}`);
  return element;
};

const computedArc = (evaluation: EvaluationResult, id: string) => {
  const geometry = evaluation.computedGeometry.get(id);
  if (!geometry || geometry.kind !== "arcLine") throw new Error("expected computed arc");
  return geometry;
};

const directionRow = (compiled: ReturnType<typeof compile>, evaluation: EvaluationResult, arc: ArcLineElement) => {
  const presentation = geometryHoverPresentation(arc, evaluation);
  if (presentation.availability.kind !== "geometry") throw new Error("expected geometry Hover rows");
  return presentation.availability.rows.find((row) => row.kind === "value" && row.label === "進行方向");
};

describe("nui4 concrete arc direction", () => {
  it("defaults omitted direction to counterclockwise and serializes the default explicitly", () => {
    const compiled = compile([
      "nui 4",
      "arc A = arc(center: (0, 0), radius: 40, start: 15, end: 155)"
    ].join("\n"));
    const arc = arcByName(compiled, "A");
    const evaluation = evaluate(compiled);

    expect(arc.direction).toBe("counterclockwise");
    expect(serializeElementStatementLogical(arc, documentDslRefs(compiled.document.elements))).toBe(
      "arc A = arc(center: (0, 0), radius: 40, start: 15, end: 155, direction: counterclockwise)"
    );
    expect(computedArc(evaluation, arc.id)).toMatchObject({ sweepAngleDeg: 140 });
    expect(directionRow(compiled, evaluation, arc)).toMatchObject({ value: "反時計回り" });
  });

  it("uses the negative complementary sweep for clockwise traversal while keeping length positive", () => {
    const compiled = compile([
      "nui 4",
      "arc A = arc(center: (0, 0), radius: 40, start: 15, end: 155, direction: clockwise)"
    ].join("\n"));
    const arc = arcByName(compiled, "A");
    const evaluation = evaluate(compiled);
    const geometry = computedArc(evaluation, arc.id);

    expect(geometry.sweepAngleDeg).toBe(-220);
    expect(geometry.length).toBeGreaterThan(0);
    expect(directionRow(compiled, evaluation, arc)).toMatchObject({ value: "時計回り" });
  });

  it("keeps equal angles at canonical zero and reports no Hover direction", () => {
    const compiled = compile([
      "nui 4",
      "arc A = arc(center: (0, 0), radius: 40, start: 0, end: 0, direction: clockwise)"
    ].join("\n"));
    const arc = arcByName(compiled, "A");
    const evaluation = evaluate(compiled);
    const geometry = computedArc(evaluation, arc.id);

    expect(geometry.sweepAngleDeg).toBe(0);
    expect(Object.is(geometry.sweepAngleDeg, -0)).toBe(false);
    expect(directionRow(compiled, evaluation, arc)).toMatchObject({ value: "なし" });
  });

  it("preserves an explicit whole clockwise turn", () => {
    const compiled = compile([
      "nui 4",
      "arc A = arc(center: (0, 0), radius: 40, start: 0, end: 360, direction: clockwise)"
    ].join("\n"));
    const arc = arcByName(compiled, "A");
    expect(computedArc(evaluate(compiled), arc.id).sweepAngleDeg).toBe(-360);
  });

  it("keeps direction exclusive to concrete arc(...) construction", () => {
    expect(constructionFor("arc", "arc")?.args.map((arg) => arg.arg)).toContain("direction");
    expect(constructionFor("arc", "through")?.args.map((arg) => arg.arg)).not.toContain("direction");
    expect(constructionFor("arc", "corner")?.args.map((arg) => arg.arg)).not.toContain("direction");
  });
});
''')

          rust = Path("rust-evaluator/src/evaluation/line_evaluators.rs")
          text = rust.read_text()
          marker = "#[cfg(test)]\nmod arc_direction_tests"
          if marker in text:
              raise SystemExit("Rust arc direction tests already exist")
          rust.write_text(text + r'''

#[cfg(test)]
mod arc_direction_tests {
    use super::directed_sweep_degrees;

    #[test]
    fn directed_sweep_matches_nui4_arc_direction_contract() {
        assert_eq!(directed_sweep_degrees(15.0, 155.0, "counterclockwise"), 140.0);
        assert_eq!(directed_sweep_degrees(15.0, 155.0, "clockwise"), -220.0);
        assert_eq!(directed_sweep_degrees(155.0, 15.0, "clockwise"), -140.0);
        assert_eq!(directed_sweep_degrees(0.0, 360.0, "counterclockwise"), 360.0);
        assert_eq!(directed_sweep_degrees(0.0, 360.0, "clockwise"), -360.0);
        let zero = directed_sweep_degrees(0.0, 0.0, "clockwise");
        assert_eq!(zero, 0.0);
        assert!(!zero.is_sign_negative());
    }
}
''')

          Path('.github/workflows/say190-acceptance-patch.yml').unlink()
          PY
      - name: Verify SAY-190 acceptance surface
        shell: bash
        run: |
          npm ci
          npm run build
          npm run lint
          npm test -- --run src/geometry/evaluateGeometryPrimitives.test.ts src/geometry/arcDirection.integration.test.ts src/geometry/geometryHoverPresentation.test.ts src/geometry/propertyBindingRuntimeIntegration.test.ts src/scalars/propertyBindingCompiler.test.ts src/commands/bakeGeometry.test.ts src/dsl/dslParameterSpans.test.ts
          cargo test --manifest-path rust-evaluator/Cargo.toml
      - name: Commit tested acceptance changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "SAY-190: cover arc direction contract"
          git push origin HEAD:${GITHUB_REF_NAME}
