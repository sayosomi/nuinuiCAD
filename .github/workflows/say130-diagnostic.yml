name: SAY-130 Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused:
    name: Focused typo query tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Focused tests
        run: npm test -- src/dsl/dslTypoSuggestionQuery.test.ts
