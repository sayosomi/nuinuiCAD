name: SAY-129 one-shot cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sayosomi/say-129-legacy-palette-remove-storeuicanvas-adapter-paths'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Remove remaining SAY-129 palette references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              before = p.read_text()
              after = fn(before)
              if after != before:
                  p.write_text(after)

          # Production callers/surfaces.
          edit('src/editor/sourceEditorController.ts', lambda s: s.replace('      palette: state.palette,\n', ''))
          edit('src/components/InspectorPanel.tsx', lambda s: s
               .replace('  const palette = useCadDocumentStore((state) => state.palette);\n', '')
               .replace('        palette,\n', '')
               .replace('[activeProfileId, elements, evaluation, groupFoldById, palette, profiles]',
                        '[activeProfileId, elements, evaluation, groupFoldById, profiles]'))
          edit('src/components/SourceEditorPane.tsx', lambda s: s
               .replace('import { Layers3, Palette } from "lucide-react";\n', 'import { Layers3 } from "lucide-react";\n')
               .replace('          <button type="button" className="palette-open-button" onClick={() => dispatchCommand("openPaletteSettings")}>\n            <Palette size={15} aria-hidden="true" />\n            <span className="source-editor-icon-button-label">パレット</span>\n          </button>\n', ''))
          edit('src/document/documentFile.ts', lambda s: s
               .replace('import { defaultDocumentPalette } from "../palette/palette";\n', '')
               .replace('import { loadPaletteTemplateSettings } from "../palette/paletteSettingsStorage";\n', '')
               .replace('  const palette = await loadPaletteTemplateSettings()\n    .then((settings) => settings.palette)\n    .catch(() => defaultDocumentPalette());\n', '')
               .replace('  useCadDocumentStore.getState().replaceDocument(\n    {\n      ...initialDocument.doc.document,\n      palette\n    },\n    null\n  );\n', '  useCadDocumentStore.getState().replaceDocument(initialDocument.doc.document, null);\n'))

          # Removed Canvas adapter / overlay inputs in tests.
          for path in [
              'src/components/CanvasOverlay.test.tsx',
              'src/components/DrawingCanvas.dragThreshold.test.ts',
              'src/components/DrawingCanvas.test.ts',
              'src/components/canvasRevisionPresentation.test.ts',
              'src/editor/sourceEditorEvaluationDecorations.test.ts',
          ]:
              edit(path, lambda s: re.sub(r'^\s*(?:elementColors|palette):[^\n]*\n', '', s, flags=re.M))
          edit('src/components/CanvasOverlay.test.tsx', lambda s: re.sub(
              r'^\s*elementColors=\{new Map\(\)\}\n', '', s, flags=re.M))

          # Store fixtures which used removed compatibility/UI fields.
          fixture_paths = [
              'src/commands/imageCreationCommands.test.ts',
              'src/components/CommandPalette.test.tsx',
              'src/components/DrawingCanvas.test.ts',
              'src/components/ImageImportDialog.test.tsx',
              'src/components/ShortcutSettingsDialog.test.tsx',
          ]
          for path in fixture_paths:
              edit(path, lambda s: re.sub(r'^\s*(?:palette|showPaletteSettings|showSelectionColorPicker):[^\n]*\n', '', s, flags=re.M))

          # Imports left unused after compatibility fixture removal.
          for path in [
              *fixture_paths,
              'src/components/DrawingCanvas.dragThreshold.test.ts',
              'src/editor/sourceEditorEvaluationDecorations.test.ts',
          ]:
              edit(path, lambda s: s.replace('import { defaultDocumentPalette } from "../palette/palette";\n', ''))
          edit('src/components/canvasRevisionPresentation.test.ts', lambda s: s.replace(
              'import type { LegacyDocumentPalette } from "../palette/palette";\n', ''))

          # Header Palette UI test is obsolete with the removed surface.
          def source_pane_test(s):
              s = s.replace('import { PaletteSettingsDialog } from "./PalettePanel";\n', '')
              s = re.sub(
                  r'\n  it\("opens palette settings from the header button", \(\) => \{.*?\n  \}\);\n',
                  '\n', s, flags=re.S)
              return s
          edit('src/components/SourceEditorPane.test.tsx', source_pane_test)

          # Palette is no longer part of replaceDocument input; the test still covers replacement.
          edit('src/state/cadDocumentStore.test.ts', lambda s: s
               .replace('        palette: useCadDocumentStore.getState().palette,\n', '')
               .replace('\n  it("keeps legacy palette UI edits outside canonical document history", () => {\n    useCadDocumentStore.getState().setDefaultColorId("cut-red");\n    expect(useCadDocumentStore.getState().palette.defaultColorId).toBe("cut-red");\n    expect(useCadDocumentStore.getState().past).toHaveLength(0);\n\n    useCadDocumentStore.getState().deletePaletteColor("guide-blue");\n    expect(useCadDocumentStore.getState().palette.colors.some((color) => color.id === "guide-blue")).toBe(false);\n    expect(useCadDocumentStore.getState().past).toHaveLength(0);\n  });\n', '\n'))
          edit('src/state/cadDocumentStore.shadow.test.ts', lambda s: re.sub(
              r'\n  it\("パレット操作\(追加・編集・既定色変更・削除\)で警告が出ない", \(\) => \{.*?\n  \}\);\n',
              '\n', s, flags=re.S))

          # These tests only cover helpers removed by this task.
          for path in [
              'src/palette/colorApplicability.test.ts',
              'src/palette/elementColors.test.ts',
          ]:
              Path(path).unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build VS Code
        run: npm run build:vscode
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "fix: remove remaining legacy palette references"
          git push origin HEAD:sayosomi/say-129-legacy-palette-remove-storeuicanvas-adapter-paths
