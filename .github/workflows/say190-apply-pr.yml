name: SAY-190 PR patch helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'sayosomi/say-190-nui4-arc-direction-explicit-clockwise-counterclockwise' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply embedded SAY-190 patch
        shell: bash
        run: |
          python3 <<'EXTRACTOR'
          from pathlib import Path
          workflow = Path('.github/workflows/say190-apply.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          exec(compile(script, 'say190-embedded-patch.py', 'exec'), {})
          EXTRACTOR
      - name: Focused regression tests
        run: >-
          npx vitest run
          src/commands/bakeFailureResults.test.ts
          src/commands/bakeGeometry.test.ts
          src/commands/creationRecipes.test.ts
          src/dsl/dslSerializer.test.ts
          src/geometry/geometryHoverPresentation.test.ts
          src/editor/sourceEditorController.test.ts
      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          rm -f .github/workflows/say190-apply.yml .github/workflows/say190-apply-pr.yml say190-helper-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SAY-190: align arc direction tests and docs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
