name: SAY-125 Tauri consistency

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'sayosomi/say-125-module-instance-selection-frame-reveal-semantics'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sayosomi/say-125-module-instance-selection-frame-reveal-semantics
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply consistency patch
        run: |
          python .github/say125_tauri_consistency.py
          rm .github/say125_tauri_consistency.py .github/workflows/say-125-tauri-consistency.yml
      - name: Install dependencies
        run: npm ci
      - name: Focused tests
        run: npx vitest run src/components/moduleInstanceSelectionFrame.test.ts src/components/CanvasOverlay.test.tsx src/vscode/VSCodeApp.test.tsx vscode-extension/src/extension.test.ts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build VS Code
        run: npm run build:vscode
      - name: Commit consistency fix
        run: |
          git add -- src/components/AppLayout.tsx src/components/TauriDrawingCanvas.tsx .github/say125_tauri_consistency.py .github/workflows/say-125-tauri-consistency.yml
          git diff --cached --check
          git commit -m "fix: share Module instance text bounds across Canvas hosts (SAY-125)"
          git push origin HEAD:sayosomi/say-125-module-instance-selection-frame-reveal-semantics
