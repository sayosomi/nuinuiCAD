name: SAY-153 Review Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'sayosomi/say-153-headless-mcp-foundation-stdio-server-document_inspect'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: sayosomi/say-153-headless-mcp-foundation-stdio-server-document_inspect
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply review fixes
        run: |
          python scripts/say153-review-fix.py
          python scripts/say153-review-fix2.py

      - name: Install dependencies
        run: npm ci

      - name: Classifier tests
        run: node --test scripts/ci/classifyChanges.node-test.mjs

      - name: Build MCP
        run: npm run build:mcp

      - name: Focused MCP tests
        run: npm test -- mcp-server/test/documentSnapshot.test.ts mcp-server/test/stdio.test.ts

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Diff check
        run: git diff --check

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mcp-server/src/documentSnapshot.ts mcp-server/test/documentSnapshot.test.ts scripts/ci/classifyChanges.node-test.mjs ARCHITECTURE.md
          git rm .github/workflows/say-153-review-fix.yml scripts/say153-review-fix.py scripts/say153-review-fix2.py
          git commit -m "fix: preserve full MCP diagnostic structure"
          git push origin HEAD:sayosomi/say-153-headless-mcp-foundation-stdio-server-document_inspect
