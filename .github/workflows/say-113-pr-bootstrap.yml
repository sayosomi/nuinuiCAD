name: SAY-113 PR bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sayosomi/say-113-runtime-inspection-geometry-source-flow-metadata
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply staged implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          awk '
            /python <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/say-113-direct-implement.yml > /tmp/say-113-apply.py
          test -s /tmp/say-113-apply.py
          sed -i 's/## Evaluation\\n/### TypeScript evaluation\\n/g' /tmp/say-113-apply.py
          python /tmp/say-113-apply.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          npm ci
          npm test -- src/geometry/geometrySourceFlow.test.ts src/geometry/evaluationPayload.test.ts
          git diff --check
          git rm .github/workflows/say-113-direct-implement.yml .github/workflows/say-113-pr-bootstrap.yml
          git add -A
          git commit -m "SAY-113: add exact geometry source flow metadata"
          git push origin HEAD:sayosomi/say-113-runtime-inspection-geometry-source-flow-metadata
