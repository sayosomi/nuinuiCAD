name: SAY-113 blocking fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-rust-test-state:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'sayosomi/say-113-runtime-inspection-geometry-source-flow-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch missing EvaluationState test initialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = {
              "src-tauri/src/evaluation/bezier_feature_point_evaluator.rs": 2,
              "src-tauri/src/evaluation/numeric_binding_runtime.rs": 2,
              "src-tauri/src/evaluation/scalars/bindings_tests.rs": 1,
              "src-tauri/src/evaluation/scalars/geometry_builtin_runtime_tests.rs": 1,
          }
          pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)pre_mutation_geometry: HashMap::new\(\),\n"
              r"(?P=indent)instance_base_geometry: HashMap::new\(\),"
          )

          total = 0
          for path_text, expected in targets.items():
              path = Path(path_text)
              text = path.read_text()

              def replacement(match: re.Match[str]) -> str:
                  indent = match.group("indent")
                  return (
                      f"{indent}pre_mutation_geometry: HashMap::new(),\n"
                      f"{indent}geometry_mutation_executions: Vec::new(),\n"
                      f"{indent}instance_base_geometry: HashMap::new(),"
                  )

              updated, actual = pattern.subn(replacement, text)
              if actual != expected:
                  raise SystemExit(
                      f"{path_text}: expected {expected} initializer match(es), found {actual}"
                  )
              path.write_text(updated)
              total += actual

          if total != 6:
              raise SystemExit(f"expected 6 total replacements, got {total}")
          PY
          git diff --check

      - name: Commit blocking fix and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/say-113-blocking-fix.yml
          git add \
            src-tauri/src/evaluation/bezier_feature_point_evaluator.rs \
            src-tauri/src/evaluation/numeric_binding_runtime.rs \
            src-tauri/src/evaluation/scalars/bindings_tests.rs \
            src-tauri/src/evaluation/scalars/geometry_builtin_runtime_tests.rs
          git diff --cached --check
          git commit -m "fix(SAY-113): initialize mutation history in Rust tests"
          git push origin HEAD:${{ github.head_ref }}
