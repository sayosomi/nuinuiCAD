[package]
name = "nuinuicad-rust-evaluator"
version = "0.0.0"
description = "Host-neutral Rust evaluator for nuinuiCAD"
authors = ["yosomi"]
edition = "2021"
rust-version = "1.77"
default-run = "evaluation_stdio"

[dependencies]
kurbo = "0.11.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
